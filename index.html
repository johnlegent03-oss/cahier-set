<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#203037;--muted:#6b7b7d;--a:#397466;--a2:#e4f1ec;--b:#d8e3df}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,#dceee7aa,transparent 28%),radial-gradient(circle at 95% 15%,#e2ebf6aa,transparent 25%),var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
.head{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:var(--a2);display:grid;place-items:center;font-size:23px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1000px;margin:auto;padding:26px 20px 50px}
.hero,.session,.empty{background:#ffffffed;border:1px solid var(--b);border-radius:20px;padding:20px;box-shadow:0 6px 20px #23413b0b}
.hero{border-radius:22px;margin-bottom:18px}.hero h2{font-size:29px;margin:7px 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:800}
.muted{color:var(--muted);line-height:1.55}
.session{margin:14px 0}.session h3{margin:7px 0 15px}
.problem{background:#edf6f2;border-left:4px solid var(--a);border-radius:10px;padding:15px;margin-top:14px;line-height:1.55}
.section-title{margin:28px 0 12px}
.small{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:10px 13px;border-radius:10px;border:1px solid var(--b);background:#fff;color:var(--text);font-weight:700;text-decoration:none}
.btn:hover{border-color:#9dbdb5}
.pdf-card{background:#f4faf7;border:1px solid #cfe4dc;border-radius:12px;padding:12px;margin-top:10px}
.pdf-title{font-size:12px;color:#42645c;font-weight:800}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
.error{background:#fff0ef;border-color:#efc0ba}
@media(max-width:600px){main{padding:18px 12px 40px}.hero{padding:17px}.hero h2{font-size:24px}}

.rich-output{line-height:1.6}.rich-output p{margin:.45em 0}.rich-output ul,.rich-output ol{padding-left:24px}
.day-entry{margin:14px 0;padding:13px 15px;border:1px solid #dce8e3;border-radius:13px;background:#fbfdfc}
.day-date{font-size:12px;font-weight:850;color:var(--a);letter-spacing:.04em;margin-bottom:8px}
.content-label{font-size:13px;font-weight:850;margin-bottom:6px}

.print-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.print-tools select{padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--text);font-weight:700}.print-btn{background:var(--a);color:#fff;border-color:var(--a);cursor:pointer}.print-btn:hover{border-color:var(--a)}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#203037;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #printArea h1{font-size:24px;margin:0 0 6px}
  #printArea h2{font-size:20px;margin:18px 0 8px}
  #printArea h3{font-size:16px;margin:12px 0 7px}
  #printArea .print-cover{border-bottom:2px solid #397466;padding-bottom:14px;margin-bottom:20px}
  #printArea .print-meta{color:#6b7b7d;font-size:12px}
  #printArea .print-section{break-inside:avoid;margin:14px 0}
  #printArea .print-box{border:1px solid #d8e3df;border-radius:10px;padding:10px;margin:8px 0}
  #printArea .rich-output img{display:block;max-width:100%!important;width:auto!important;height:auto!important;max-height:250mm;object-fit:contain;break-inside:avoid;page-break-inside:avoid}
  #printArea .print-date{font-size:11px;font-weight:700;color:#397466;margin-bottom:5px}
  #printArea .print-pdf{border:1px dashed #9dbdb5;padding:8px;margin-top:7px;font-size:11px}
  #printArea a{color:inherit;text-decoration:none}
}

/* Impression du cahier élève */
@media print {
  @page { size: A4; margin: 15mm; }
  body {
    background: #fff !important;
    color: #203037 !important;
    min-height: auto;
  }
  header {
    position: static !important;
    background: #fff !important;
    border-bottom: 1px solid #d8e3df !important;
    box-shadow: none !important;
  }
  main { max-width: none !important; padding: 0 !important; }
  footer { padding: 15px 0 0 !important; }
  .no-print, .print-actions, .pdf-card { display: none !important; }
  .hero, .session, .empty {
    box-shadow: none !important;
    background: #fff !important;
    break-inside: avoid;
  }
  .session { page-break-inside: avoid; }
  .chapter-print { break-before: auto; }
}

</style>

 .print-btn {background:#467db4;border-color:#467db4;color:#fff}
 .print-btn:hover {background:#315f91;border-color:#315f91}
 .small {color:#a36538}
 /* Repères visuels renforcés pour que le changement soit immédiatement perceptible. */
 header {box-shadow:0 4px 18px #8e77501c}
 .brand .logo {border-radius:16px;background:linear-gradient(135deg,#ffe0ad,#d8eaff)!important;border:2px solid #fff;box-shadow:0 3px 10px #b7a27b55!important}
 .brand h1 {font-size:21px!important;font-weight:800!important;letter-spacing:.01em}
 .hero {border:2px solid #f0d7a9!important;box-shadow:0 8px 24px #b98b4920!important}
 .session {border-width:2px!important;border-radius:18px!important}
 .chapter-grid .session:nth-child(4n+1) {background:linear-gradient(135deg,#fff2dc,#fffaf1)!important}
 .chapter-grid .session:nth-child(4n+2) {background:linear-gradient(135deg,#e8f4ff,#fbfdff)!important}
 .chapter-grid .session:nth-child(4n+3) {background:linear-gradient(135deg,#f1eaff,#fffaff)!important}
 .chapter-grid .session:nth-child(4n) {background:linear-gradient(135deg,#eaf7e4,#fcfff9)!important}
 .chapter-grid .session::before {width:7px!important;top:0!important;bottom:0!important;left:0!important;border-radius:16px 0 0 16px!important}
 .section-title {padding:8px 12px!important;border-radius:12px;background:linear-gradient(90deg,#f1eaff,#fff8e9 70%,transparent)!important}
 .problem {border-left-width:6px!important;border-radius:0 14px 14px 0!important}
 .btn {border-width:2px!important;border-radius:12px!important;font-weight:800!important}
 .print-btn {box-shadow:0 4px 0 #244b75!important}
 .pdf-card {border-width:2px!important;border-radius:14px!important}
}
@media print {
 #printArea {font-family:Arial,sans-serif!important}
}

<style id="naturalist-refonte">
/* Cartes du cahier : esprit carnet naturaliste */
@media screen {
  #content .chapter-grid {
    gap: 18px;
  }

  #content .chapter-grid .session {
    position: relative;
    overflow: hidden;
    padding: 22px;
    border: 1px solid #d5dcc8;
    border-radius: 16px;
    background: #fffef8;
    box-shadow: 0 4px 14px rgba(48, 67, 43, 0.05);
    transition: border-color .2s, box-shadow .2s;
  }

  #content .chapter-grid .session::before {
    width: 4px;
    top: 0;
    bottom: 0;
    left: 0;
    border-radius: 0;
    background: #82916a;
  }

  #content .chapter-grid .session:hover {
    border-color: #9eae87;
    box-shadow: 0 8px 22px rgba(48, 67, 43, 0.09);
  }

  #content .chapter-grid .session h3 {
    color: #304832;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
    line-height: 1.35;
  }

  #content .chapter-grid .muted {
    color: #68715e;
    line-height: 1.6;
  }
}

@media screen and (max-width: 650px) {
  #content .chapter-grid .session {
    padding: 18px;
  }
}
</style>

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const text=x=>x==null?"":String(x);
function sanitizeRichHtml(value){
  const html=text(value);
  if(!html)return "";
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const root=doc.body.firstElementChild;
  if(!root)return "";
  const allowedTags=new Set(["B","I","U","BR","P","DIV","SPAN","FONT","STRONG","EM","MARK","SMALL","SUB","SUP","UL","OL","LI","H1","H2","H3","H4","H5","H6","TABLE","THEAD","TBODY","TR","TH","TD","A"]);
  const allowedStyle=new Set(["color","background-color","font-family","font-size","font-weight","font-style","text-decoration","text-align"]);
  [...root.querySelectorAll("*")].forEach(el=>{
    if(!allowedTags.has(el.tagName)){
      el.replaceWith(...[...el.childNodes]);
      return;
    }
    if(el.tagName==="FONT"){
  const color=el.getAttribute("color");
  if(color && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)){
    el.setAttribute("style",`color:${color}`);
  }
}
    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      if(name==="style"){
        const clean=attr.value.split(";").map(part=>part.trim()).filter(Boolean).filter(part=>{
          const i=part.indexOf(":"); if(i<1)return false;
          const prop=part.slice(0,i).trim().toLowerCase(),val=part.slice(i+1).trim().toLowerCase();
          return allowedStyle.has(prop) && !(/[<>]|url\s*\(|javascript:|expression\s*\(/i.test(val));
        }).join("; ");
        if(clean)el.setAttribute("style",clean);else el.removeAttribute("style");
        return;
      }
      if(name==="href"&&el.tagName==="A"){
        try{
          const u=new URL(attr.value,location.href);
          if(!/^https?:$/i.test(u.protocol)&&u.origin!==location.origin)throw new Error("unsafe");
          el.setAttribute("href",u.href);
          el.setAttribute("target","_blank");
          el.setAttribute("rel","noopener noreferrer");
        }catch(e){el.removeAttribute("href");}
        return;
      }
      el.removeAttribute(attr.name);
    });
  });
  return root.innerHTML;
}

function empty(){return {chapitres:[]}}

function normalizeEntry(e){
  const x=e&&typeof e==="object"?e:{};
  return {date:text(x.date||x.jour||x.datee),texte:sanitizeRichHtml(x.texte||x.text||x.contenu||x.html),pdf:text(x.pdf||x.pdfUrl||x.document)};
}
function legacyEntries(text,pdf){
  const t=text||"",p=pdf||"";
  return t||p?[{date:"",texte:t,pdf:p}]:[];
}
function normalizeSession(s){
  const x=s&&typeof s==="object"?s:{};
  const act=Array.isArray(x.activites)?x.activites.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.activite||x.activity,x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document);
  const cor=Array.isArray(x.corrections)?x.corrections.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.correction,x.pdfCorrection||x.pdf_correction||x.correctionPdf);
  const bil=Array.isArray(x.bilans)?x.bilans.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.bilan,"");
  return {titre:sanitizeRichHtml(x.titre||x.title||"Séance"),problematique:sanitizeRichHtml(x.problematique||x.probleme||x.problem),activites:act,corrections:cor,bilans:bil,activite:sanitizeRichHtml(x.activite||x.activity),correction:sanitizeRichHtml(x.correction),bilan:sanitizeRichHtml(x.bilan),pdfActivite:text(x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document),pdfCorrection:text(x.pdfCorrection||x.pdf_correction||x.correctionPdf)};
}
function normalizeChapter(ch){
  const x=ch&&typeof ch==="object"?ch:{};
  const raw=Array.isArray(x.seances)?x.seances:(Array.isArray(x.sessions)?x.sessions:[]);
  return {archive:x.archive===true,titre:sanitizeRichHtml(x.titre||x.title||"Chapitre"),problematique:sanitizeRichHtml(x.problematique||x.probleme||x.problem),germoir:sanitizeRichHtml(x.germoir),germoirPdf:text(x.germoirPdf||x.germoir_pdf),seances:raw.map(normalizeSession),schema:sanitizeRichHtml(x.schema||x.schemaBilan||x.schema_bilan),schemaPdf:text(x.schemaPdf||x.schema_pdf),memo:sanitizeRichHtml(x.memo||x.memorisation||x.ficheMemo),memoPdf:text(x.memoPdf||x.memo_pdf),evaluationPdf:text(x.evaluationPdf||x.evaluation_pdf||x.evalPdf||x.pdfEvaluation)};
}

async function loadClass(){
  const {data,error}=await sb.from("Cahier").select("classe,contenu").eq("classe",classe).maybeSingle();
  if(error)throw new Error(error.message);
  if(!data)return empty();
  let x=data.contenu;
  if(!x)x=empty();
  if(Array.isArray(x))x={chapitres:x};
  if(!Array.isArray(x.chapitres))x.chapitres=[];
  x.chapitres=x.chapitres.map(normalizeChapter);
  return x;
}

  return `<div class="pdf-card"><div class="pdf-title">📄 ${esc(label)}</div><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le PDF</a></div>`;
}

  home();
}

function fmtDate(d){
  if(!d)return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  return m?`${m[3]}/${m[2]}/${m[1]}`:esc(d);
}
function renderEntries(entries,label){
  if(!entries?.length)return "";
  return `<div class="content-label">${label}</div>${entries.map(e=>`<div class="day-entry">
    ${e.date?`<div class="day-date">📅 ${fmtDate(e.date)}</div>`:""}
    <div class="rich-output">${e.texte||""}</div>
    ${pdfButton(e.pdf,label.replace(/^. /,''))}
  </div>`).join("")}`;
}

async function chapter(i){
  try{
    const x=await loadClass();
    const ch=x.chapitres[i];
    if(!ch||ch.archive===true){await home();return;}
    content.innerHTML=`<button class="btn" onclick="home()">← ${esc(classe)}</button>
    <div class="print-tools"><button class="btn print-btn" onclick="printChapter(${i})">🖨️ Imprimer / PDF ce chapitre</button></div>
    <section class="hero" style="margin-top:14px">
      ${ch.germoir||ch.germoirPdf?`<div class="problem" style="margin-bottom:18px"><strong>🌱 Germoir à idées</strong>${ch.germoir?`<div class="rich-output" style="margin-top:9px">${ch.germoir}</div>`:""}${pdfButton(ch.germoirPdf,"PDF du germoir à idées")}</div>`:""}
      <div class="print-actions no-print" style="display:flex;justify-content:flex-end;margin-bottom:8px">
        <button class="btn" type="button" onclick="printChapter(${i})">🖨️ Imprimer / PDF ce chapitre</button>
      </div>
      <span class="eyebrow">Chapitre ${i+1}</span><h2 class="rich-output">${ch.titre||""}</h2>
      ${ch.problematique?`<div class="problem"><strong>🎯 Problématique</strong><br><div class="rich-output">${ch.problematique}</div></div>`:""}
    </section>
    <h2 class="section-title">📖 Séances</h2>
    ${(ch.seances||[]).map((s,n)=>`<article class="session">
      <div class="small">SÉANCE ${n+1}</div><h3 class="rich-output">${s.titre||""}</h3>
      ${s.problematique?`<div class="problem"><strong>🎯 Problème de la séance</strong><div class="rich-output" style="margin-top:7px">${s.problematique}</div></div>`:""}
      ${renderEntries(s.activites,"🧪 Activité")}
      ${renderEntries(s.corrections,"✅ Correction")}
      ${renderEntries(s.bilans,"🧠 Bilan")}
      ${(!s.activites?.length&&!s.corrections?.length&&!s.bilans?.length&&s.activite)?`<p class="muted">${esc(s.activite)}</p>`:""}
    </article>`).join("")||`<p class="muted">Aucune séance pour le moment.</p>`}
    <section class="hero"><span class="eyebrow">Fin du chapitre</span><h2>🧠 Schéma-bilan</h2>${pdfButton(ch.schemaPdf,"Voir le schéma-bilan")}${ch.schema?`<div class="rich-output muted">${ch.schema}</div>`:""}</section>
    <section class="hero"><span class="eyebrow">À mémoriser</span><h2>📝 Fiche de mémorisation</h2>${pdfButton(ch.memoPdf,"Ouvrir la fiche de mémorisation")}${!ch.memoPdf&&ch.memo?`<div class="rich-output muted">${ch.memo}</div>`:""}</section>
    ${ch.evaluationPdf?`<section class="hero"><span class="eyebrow">Fin du chapitre</span><h2>✅ Évaluation</h2>${pdfButton(ch.evaluationPdf,"Ouvrir l'évaluation")}</section>`:""}`;
  }catch(e){errorPage(e.message)}
}


/* Logo dans les documents exportés, indépendant du décor de l'écran. */
function addExportLogos(root){
  if(!root)return;
  const source=document.querySelector('.brand .logo img');
  if(!source?.src)return;
  let targets=[...root.querySelectorAll('.print-page,.correction-student-page,.print-cover')];
  targets=targets.filter(el=>!targets.some(parent=>parent!==el&&parent.contains(el)));
  if(!targets.length)targets=[root.querySelector('.print-preview-page')||root];
  targets.forEach(target=>{
    if(target.querySelector('.svt-export-brand'))return;
    const title=target.querySelector('h1');
    const brand=document.createElement('div');brand.className='svt-export-brand';
    const image=document.createElement('img');image.src=source.src;image.alt='Logo SVT';image.width=48;image.height=48;image.loading='eager';
    brand.appendChild(image);
    if(title){title.parentNode.insertBefore(brand,title);brand.appendChild(title);}
    else{const text=document.createElement('span');text.textContent='SVT · John Legent';brand.appendChild(text);target.insertBefore(brand,target.firstChild);}
  });
}
async function printDocumentWithLogo(root,prepare){
  try{
    addExportLogos(root);
    await Promise.all([...root.querySelectorAll('.svt-export-brand img')].map(image=>image.decode?image.decode():new Promise((resolve,reject)=>{
      if(image.complete){image.naturalWidth?resolve():reject(new Error('Logo non chargé.'));return;}
      image.onload=resolve;image.onerror=()=>reject(new Error('Logo non chargé.'));
    })));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    if(prepare&&prepare()===false)return false;
    window.print();return true;
  }catch(e){alert('Impression non lancée : '+e.message);return false;}
}

function chapterPrintHtml(ch,i){
  const escPrint=x=>String(x??"");
  const entries=(arr,label)=>{
    if(!arr?.length)return "";
    return `<div class="print-section"><h3>${label}</h3>${arr.map(e=>`<div class="print-box">${e.date?`<div class="print-date">📅 ${fmtDate(e.date)}</div>`:""}${e.texte?`<div class="rich-output">${e.texte}</div>`:""}${e.pdf?`<div class="print-pdf">📄 Document PDF associé : <a href="${esc(e.pdf)}">ouvrir le PDF</a></div>`:""}</div>`).join("")}</div>`;
  };
  return `<div class="print-cover"><div class="print-meta">Cahier numérique de SVT · ${escPrint(classe)}</div><h1>Chapitre ${i+1} — ${escPrint(ch.titre)}</h1>${ch.problematique?`<div>${ch.problematique}</div>`:""}</div>
  ${ch.germoir||ch.germoirPdf?`<div class="print-section"><h2>🌱 Germoir à idées</h2>${ch.germoir?`<div class="print-box rich-output">${ch.germoir}</div>`:""}${ch.germoirPdf?`<div class="print-pdf">📄 PDF associé : <a href="${esc(ch.germoirPdf)}">ouvrir le PDF</a></div>`:""}</div>`:""}
  ${(ch.seances||[]).map((s,n)=>`<div class="print-section"><h2>📖 Séance ${n+1} — ${escPrint(s.titre)}</h2>${s.problematique?`<div class="print-box"><strong>🎯 Problématique</strong><div class="rich-output">${s.problematique}</div></div>`:""}${entries(s.activites,"🧪 Activité")}${entries(s.corrections,"✅ Correction")}${entries(s.bilans,"🧠 Bilan")}</div>`).join("")}
  ${ch.schema||ch.schemaPdf?`<div class="print-section"><h2>🧠 Schéma-bilan</h2>${ch.schema?`<div class="print-box rich-output">${ch.schema}</div>`:""}${ch.schemaPdf?`<div class="print-pdf">📄 PDF associé : <a href="${esc(ch.schemaPdf)}">ouvrir le PDF</a></div>`:""}</div>`:""}
  ${ch.memo||ch.memoPdf?`<div class="print-section"><h2>📝 Fiche de mémorisation</h2>${ch.memo?`<div class="print-box rich-output">${ch.memo}</div>`:""}${ch.memoPdf?`<div class="print-pdf">📄 PDF associé : <a href="${esc(ch.memoPdf)}">ouvrir le PDF</a></div>`:""}</div>`:""}
  ${ch.evaluationPdf?`<div class="print-section"><h2>✅ Évaluation</h2><div class="print-pdf">📄 PDF associé : <a href="${esc(ch.evaluationPdf)}">ouvrir l'évaluation</a></div></div>`:""}`;
}

async function printChapter(i){
  try{
    const x=await loadClass();
    const ch=x.chapitres[i];
    if(!ch||ch.archive===true){alert("Ce chapitre n’est pas disponible dans le cahier élève.");return;}
    const area=document.getElementById("printArea");
    if(!area)throw new Error("Zone d'impression introuvable.");
    area.innerHTML=chapterPrintHtml(ch,i);
    const original=document.title;
    document.title=`Cahier de SVT - ${ch.titre||("Chapitre "+(i+1))}`;
    const cleanup=()=>{area.innerHTML="";document.title=original;window.removeEventListener("afterprint",cleanup);};
    window.addEventListener("afterprint",cleanup);
    await printDocumentWithLogo(area);
  }catch(e){alert("Impossible de préparer l'impression : "+e.message)}
}

function printSelectedChapter(){
  const select=document.getElementById("chapterToPrint");
  if(!select||select.value===""){alert("Choisis d'abord le chapitre à imprimer.");return;}
  printChapter(Number(select.value));
}


async function printAllChapters(){
  try{
    const x=await loadClass();
    const activeChapters=x.chapitres.map((ch,i)=>({ch,i})).filter(item=>item.ch.archive!==true);
    if(!activeChapters.length){alert("Aucun chapitre actif à imprimer.");return;}
    const area=document.getElementById("printArea");
    if(!area)throw new Error("Zone d'impression introuvable.");
    area.innerHTML=activeChapters.map(({ch,i})=>`<section class="chapter-print">${chapterPrintHtml(ch,i)}</section>`).join("");
    const original=document.title;
    document.title=`Cahier de SVT - ${classe}`;
    const cleanup=()=>{area.innerHTML="";document.title=original;window.removeEventListener("afterprint",cleanup);};
    window.addEventListener("afterprint",cleanup);
    await printDocumentWithLogo(area);
  }catch(e){alert("Impossible de préparer l'impression : "+e.message);}
}

function errorPage(msg){
  content.innerHTML=`<section class="hero error">
    <h2>⚠️ Impossible de charger le cahier</h2>
    <p class="muted">${esc(msg)}</p>
    <button class="btn" onclick="start()">Réessayer</button>
  </section>`;
}
