<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#203037;--muted:#6b7b7d;--a:#397466;--a2:#e4f1ec;--b:#d8e3df}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,#dceee7aa,transparent 28%),radial-gradient(circle at 95% 15%,#e2ebf6aa,transparent 25%),var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
.head{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:var(--a2);display:grid;place-items:center;font-size:23px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1000px;margin:auto;padding:26px 20px 50px}
.hero,.session,.empty{background:#ffffffed;border:1px solid var(--b);border-radius:20px;padding:20px;box-shadow:0 6px 20px #23413b0b}
.hero{border-radius:22px;margin-bottom:18px}.hero h2{font-size:29px;margin:7px 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:800}
.muted{color:var(--muted);line-height:1.55}
.session{margin:14px 0}.session h3{margin:7px 0 15px}
.problem{background:#edf6f2;border-left:4px solid var(--a);border-radius:10px;padding:15px;margin-top:14px;line-height:1.55}
.section-title{margin:28px 0 12px}
.small{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:10px 13px;border-radius:10px;border:1px solid var(--b);background:#fff;color:var(--text);font-weight:700;text-decoration:none}
.btn:hover{border-color:#9dbdb5}
.pdf-card{background:#f4faf7;border:1px solid #cfe4dc;border-radius:12px;padding:12px;margin-top:10px}
.pdf-title{font-size:12px;color:#42645c;font-weight:800}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
.error{background:#fff0ef;border-color:#efc0ba}
@media(max-width:600px){main{padding:18px 12px 40px}.hero{padding:17px}.hero h2{font-size:24px}}

.rich-output{line-height:1.6}.rich-output p{margin:.45em 0}.rich-output ul,.rich-output ol{padding-left:24px}
.day-entry{margin:14px 0;padding:13px 15px;border:1px solid #dce8e3;border-radius:13px;background:#fbfdfc}
.day-date{font-size:12px;font-weight:850;color:var(--a);letter-spacing:.04em;margin-bottom:8px}
.content-label{font-size:13px;font-weight:850;margin-bottom:6px}

.print-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.print-tools select{padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--text);font-weight:700}.print-btn{background:var(--a);color:#fff;border-color:var(--a);cursor:pointer}.print-btn:hover{border-color:var(--a)}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#203037;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #printArea h1{font-size:24px;margin:0 0 6px}
  #printArea h2{font-size:20px;margin:18px 0 8px}
  #printArea h3{font-size:16px;margin:12px 0 7px}
  #printArea .print-cover{border-bottom:2px solid #397466;padding-bottom:14px;margin-bottom:20px}
  #printArea .print-meta{color:#6b7b7d;font-size:12px}
  #printArea .print-section{break-inside:avoid;margin:14px 0}
  #printArea .print-box{border:1px solid #d8e3df;border-radius:10px;padding:10px;margin:8px 0}
  #printArea .rich-output img{display:block;max-width:100%!important;width:auto!important;height:auto!important;max-height:250mm;object-fit:contain;break-inside:avoid;page-break-inside:avoid}
  #printArea .print-date{font-size:11px;font-weight:700;color:#397466;margin-bottom:5px}
  #printArea .print-pdf{border:1px dashed #9dbdb5;padding:8px;margin-top:7px;font-size:11px}
  #printArea a{color:inherit;text-decoration:none}
}

/* Impression du cahier élève */
@media print {
  @page { size: A4; margin: 15mm; }
  body {
    background: #fff !important;
    color: #203037 !important;
    min-height: auto;
  }
  header {
    position: static !important;
    background: #fff !important;
    border-bottom: 1px solid #d8e3df !important;
    box-shadow: none !important;
  }
  main { max-width: none !important; padding: 0 !important; }
  footer { padding: 15px 0 0 !important; }
  .no-print, .print-actions, .pdf-card { display: none !important; }
  .hero, .session, .empty {
    box-shadow: none !important;
    background: #fff !important;
    break-inside: avoid;
  }
  .session { page-break-inside: avoid; }
  .chapter-print { break-before: auto; }
}

</style>




<style id="export-logo-style">
/* Règles communes à l'aperçu et à l'impression. Le logo est une image, pas un fond. */
#printOverlay .svt-export-brand,#printArea .svt-export-brand{
 display:flex!important;align-items:center!important;gap:10px!important;
 width:100%;margin:0 0 8px!important;break-inside:avoid;page-break-inside:avoid;
 font-family:Arial,sans-serif;color:#263a2b;
}
#printOverlay .svt-export-brand>img,#printArea .svt-export-brand>img{
 display:block!important;visibility:visible!important;opacity:1!important;
 width:13mm!important;height:13mm!important;min-width:13mm!important;max-width:13mm!important;
 flex:0 0 13mm!important;object-fit:contain!important;border:0!important;
}
#printOverlay .svt-export-brand>h1,#printArea .svt-export-brand>h1{
 margin:0!important;min-width:0;flex:1;overflow-wrap:anywhere;
}
#printOverlay .svt-a4-grid .svt-export-brand{gap:7px!important;margin-bottom:4px!important}
#printOverlay .svt-a4-grid .svt-export-brand>img{
 width:9mm!important;height:9mm!important;min-width:9mm!important;max-width:9mm!important;flex-basis:9mm!important;
}
</style>

<style id="chapter-navigation-responsive">

<style id="confort-utilisation">
@media screen {
  /* Repérage au clavier, sur l’accueil et dans les chapitres. */
  #content a:focus-visible,
  #content button:focus-visible,
  #content select:focus-visible {
    outline: 3px solid #426849;
    outline-offset: 3px;
  }

  /* Le lien reste visible même au bord d’une carte. */
  #content .chapter-card-link:focus-visible {
    outline-offset: -4px;
    background: #e7efda;
  }

  /* Titres et contenus longs : éviter les débordements. */

  #content .chapter-front,
  #content .lesson-heading,
  #content .revision-card {
    min-width: 0;
  }

  #content .chapter-card h3,
  #content .chapter-front h2,
  #content .lesson-heading h3,
  #content .revision-card h3 {
    overflow-wrap: anywhere;
  }

  /* Préserver la lisibilité des documents intégrés. */
  #content .rich-output img,
  #content .rich-output video {
    max-width: 100%;
    height: auto;
  }

  /* Commandes plus faciles à toucher sur écran tactile. */
  @media (pointer: coarse) {
    #content .btn,
    #content .toc-links a,
    #content .chapter-card-link {
      min-height: 44px;
    }

    #content .chapter-back-top {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 12px;
    }
  }

  /* Respecter les préférences de réduction des animations. */
  @media (prefers-reduced-motion: reduce) {
    #content .chapter-card,
    #content .btn {
      transition: none !important;

  }
}

<body>
<header><div class="head">
  <div class="brand"><div class="logo"><img src="logo-svt.PNG" alt="Logo SVT"></div><div><h1>Cahier numérique de SVT</h1><p>John Legent · Professeur de SVT</p><p id="label">Chargement…</p></div></div>
</div></header>
<main id="content"></main>
<footer>Cahier numérique de SVT · John Legent · accès réservé à la classe.</footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const params=new URLSearchParams(location.search);
const code=(params.get("code")||"").trim().toLowerCase();

/*
  Codes utilisés dans les QR codes.
  Ils sont volontairement opaques : les élèves ne voient pas le nom
  de la classe dans l'adresse.
*/
const CLASS_CODES={
  "test-lab-9x2k": "TEST",
  "svt6e1-7kq4":"6e1",
  "svt6e2-m8p2":"6e2",
  "svt6e3-r5x9":"6e3",
  "svt6e4-n3v7":"6e4",
  "svt6e5-t6h2":"6e5",
  "svt5e1-q9w4":"5e1",
  "svt5e3-k2m8":"5e3",
  "svt5e5-p7r3":"5e5",
  "svt3e2-x4n6":"3e2",
  "svt3e3-b8q5":"3e3"
};

const classe=CLASS_CODES[code]||"";
const content=document.getElementById("content");
const label=document.getElementById("label");

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const text=x=>x==null?"":String(x);
function sanitizeRichHtml(value){
  const html=text(value);
  if(!html)return "";
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const root=doc.body.firstElementChild;
  if(!root)return "";
  const allowedTags=new Set(["B","I","U","BR","P","DIV","SPAN","FONT","STRONG","EM","MARK","SMALL","SUB","SUP","UL","OL","LI","H1","H2","H3","H4","H5","H6","TABLE","THEAD","TBODY","TR","TH","TD","A"]);
  const allowedStyle=new Set(["color","background-color","font-family","font-size","font-weight","font-style","text-decoration","text-align"]);
  [...root.querySelectorAll("*")].forEach(el=>{
    if(!allowedTags.has(el.tagName)){
      el.replaceWith(...[...el.childNodes]);
      return;
    }
    if(el.tagName==="FONT"){
  const color=el.getAttribute("color");
  if(color && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)){
    el.setAttribute("style",`color:${color}`);
  }
}
    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      if(name==="style"){
        const clean=attr.value.split(";").map(part=>part.trim()).filter(Boolean).filter(part=>{
          const i=part.indexOf(":"); if(i<1)return false;
          const prop=part.slice(0,i).trim().toLowerCase(),val=part.slice(i+1).trim().toLowerCase();
          return allowedStyle.has(prop) && !(/[<>]|url\s*\(|javascript:|expression\s*\(/i.test(val));
        }).join("; ");
        if(clean)el.setAttribute("style",clean);else el.removeAttribute("style");
        return;
      }
      if(name==="href"&&el.tagName==="A"){
        try{
          const u=new URL(attr.value,location.href);
          if(!/^https?:$/i.test(u.protocol)&&u.origin!==location.origin)throw new Error("unsafe");
          el.setAttribute("href",u.href);
          el.setAttribute("target","_blank");
          el.setAttribute("rel","noopener noreferrer");
        }catch(e){el.removeAttribute("href");}
        return;
      }
      el.removeAttribute(attr.name);
    });
  });
  return root.innerHTML;
}

function empty(){return {chapitres:[]}}

function normalizeEntry(e){
  const x=e&&typeof e==="object"?e:{};
  return {date:text(x.date||x.jour||x.datee),texte:sanitizeRichHtml(x.texte||x.text||x.contenu||x.html),pdf:text(x.pdf||x.pdfUrl||x.document)};
}
function legacyEntries(text,pdf){
  const t=text||"",p=pdf||"";
  return t||p?[{date:"",texte:t,pdf:p}]:[];
}
function normalizeSession(s){
  const x=s&&typeof s==="object"?s:{};
  const act=Array.isArray(x.activites)?x.activites.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.activite||x.activity,x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document);
  const cor=Array.isArray(x.corrections)?x.corrections.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.correction,x.pdfCorrection||x.pdf_correction||x.correctionPdf);
  const bil=Array.isArray(x.bilans)?x.bilans.map(normalizeEntry).filter(e=>e.texte||e.pdf||e.date):legacyEntries(x.bilan,"");
  return {titre:sanitizeRichHtml(x.titre||x.title||"Séance"),problematique:sanitizeRichHtml(x.problematique||x.probleme||x.problem),activites:act,corrections:cor,bilans:bil,activite:sanitizeRichHtml(x.activite||x.activity),correction:sanitizeRichHtml(x.correction),bilan:sanitizeRichHtml(x.bilan),pdfActivite:text(x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document),pdfCorrection:text(x.pdfCorrection||x.pdf_correction||x.correctionPdf)};
}
function normalizeChapter(ch){
  const x=ch&&typeof ch==="object"?ch:{};
  const raw=Array.isArray(x.seances)?x.seances:(Array.isArray(x.sessions)?x.sessions:[]);
  return {archive:x.archive===true,titre:sanitizeRichHtml(x.titre||x.title||"Chapitre"),problematique:sanitizeRichHtml(x.problematique||x.probleme||x.problem),germoir:sanitizeRichHtml(x.germoir),germoirPdf:text(x.germoirPdf||x.germoir_pdf),seances:raw.map(normalizeSession),schema:sanitizeRichHtml(x.schema||x.schemaBilan||x.schema_bilan),schemaPdf:text(x.schemaPdf||x.schema_pdf),memo:sanitizeRichHtml(x.memo||x.memorisation||x.ficheMemo),memoPdf:text(x.memoPdf||x.memo_pdf),evaluationPdf:text(x.evaluationPdf||x.evaluation_pdf||x.evalPdf||x.pdfEvaluation)};
}

async function loadClass(){
  const {data,error}=await sb.from("Cahier").select("classe,contenu").eq("classe",classe).maybeSingle();
  if(error)throw new Error(error.message);
  if(!data)return empty();
  let x=data.contenu;
  if(!x)x=empty();
  if(Array.isArray(x))x={chapitres:x};
  if(!Array.isArray(x.chapitres))x.chapitres=[];
  x.chapitres=x.chapitres.map(normalizeChapter);
  return x;
}

function pdfButton(url, label) {
  if (!url) return "";

  const title = label || "Document PDF";

  return `
    <div class="pdf-card document-card">
      <span class="document-icon" aria-hidden="true">PDF</span>

      <div class="document-info">
        <div class="pdf-title">${esc(title)}</div>
        <div class="document-note">
          Ouverture dans un nouvel onglet
        </div>
      </div>

      <a
        class="btn document-open"
        href="${esc(url)}"
        target="_blank"
        rel="noopener"
        aria-label="${esc(title)} — ouvrir dans un nouvel onglet"
      >
        Ouvrir <span aria-hidden="true">↗</span>
      </a>
    </div>
  `;
}

function start(){
  if(!classe){
    label.textContent="Accès par QR code";
    content.innerHTML=`<section class="hero error">
      <span class="eyebrow">Cahier numérique</span>
      <h2>🔒 Accès non disponible</h2>
      <p class="muted">Utilise le QR code ou le lien transmis par ton professeur pour accéder au cahier de ta classe.</p>
    </section>`;
    return;
  }
  label.textContent=`Classe ${classe}`;
  home();
}

function getChapterImage(titre) {
  const t = (titre || "").toLowerCase();

  const images = [
    [/matériau|materiau|conductivit/, "materiaux.png"],
    [/masse|volume|mesur/, "masse_volume.png"],
    [/énergie|energie|signal/, "energie_signal.png"],
    [/mélange|melange|dissolution|transformation/, "melanges_transformations.png"],
    [/pathogène|pathogene|bactérie|bacterie|virus/, "agents_pathogenes.png"],
    [/immunit|vaccin|antibiot/, "immunite.png"],
    [/digestion|nutriment/, "digestion.png"],
    [/respiration|circulation/, "respi-circu.png"],
    [/effort physique/, "effort_physique.png"],
    [/génétique|genetique|adn|chromosome|allèle|allele/, "diversité-genetique.png"],
    [/stabilité|stabilite|expression génétique|expression genetique|mitose/, "stabilite_expression_genetique.png"],
    [/évolution|evolution/, "evolution.png"],
    [/biodiversité|biodiversite|classification/, "ecosystemes.png"],
    [/écosystème|ecosysteme/, "ecosystemes.png"],
    [/cycle de la matière|cycle de la matiere/, "cycle_de_la_matiere.png"],
    [/reproduction.*plante|pollinisation/, "reproduction_des_plantes.png"],
    [/sexualité|sexualite|contraception|ist/, "sexualite-humaine.png"],
    [/reproduction humaine|puberté|puberte|embryon|fécondation|fecondation/, "reproduction_humaine.png"],
    [/reproduction des êtres vivants|reproduction des etres vivants|reproduction animale/, "reproduction-etres-vivants.png"],
    [/climat|réchauffement|rechauffement/, "climat.png"],
    [/météo|meteo|phénomène météorologique|phenomene meteorologique/, "phenomenes_meteo.png"],
    [/terre|tectonique|plaques|volcan|séisme|seisme|dynamique interne/, "dynamique-interne.png"],
    [/ressource|énergie renouvelable|energie renouvelable/, "ressources.png"],
    [/planète|planete|habitabilité|habitabilite/, "vie_sur_une_planete.png"],
    [/mouvement|vitesse|déplacement|deplacement/, "mouvement-vitesse.png"],
    [/alimentation|nutrition/, "alimentation_humaine.png"],
    [/vivant|cellule|espèce|espece/, "le_vivant.png"]
  ];

  const resultat = images.find(([motif]) => motif.test(t));

  return "illustrations-scientifiques/" +
    (resultat ? resultat[1] : "le_vivant.png");
}
function texteSansHTML(valeur) {
  const element = document.createElement("div");
  element.innerHTML = valeur || "";

  return (element.textContent || "")
    .replace(/\s+/g, " ")
    .trim();
}
function renderShell(activeIndex, inner, chapters){
  const nav=(chapters||[]).map(({ch,i,n})=>`<button class="side-chapter ${i===activeIndex?'active':''}" onclick="chapter(${i})"><span>${n+1}</span><span>${esc(texteSansHTML(ch.titre))}</span></button>`).join('');
  content.innerHTML=`<div class="notebook-layout">
    <aside class="notebook-sidebar">
      <button class="side-home" onclick="home()"><span>⌂</span> Accueil</button>
      <div class="side-label">Navigation des chapitres</div>${nav}
    </aside>
    <div class="notebook-main"><div class="notebook-banner"><img src="./bandeau-accueil.jpg" alt=""><div class="banner-fallback"><span>Cahier numérique</span><strong>de SVT</strong><small>Chaque observation est le début d’une découverte.</small></div><span class="grade-pill">${esc(classe||'SVT')}</span></div><div class="notebook-content">${inner}</div></div>
  </div>`;
}
async function home(){
  try{
    const x=await loadClass();
    const active=x.chapitres.map((ch,i)=>({ch,i,n:0})).filter(item=>item.ch.archive!==true).map((item,n)=>({...item,n}));
    if(active.length){await chapter(active[0].i);return;}
    renderShell(-1,`<section class="welcome-card"><p class="eyebrow">BIENVENUE</p><h2>Votre cahier numérique de SVT</h2><p>Des activités, des documents et des outils pour découvrir le monde du vivant et notre environnement.</p><p class="student-slogan">La curiosité pour boussole, la nature pour inspiration, la connaissance pour horizon.</p></section><section class="empty"><h3>Aucun chapitre publié pour le moment.</h3><p class="muted">Les contenus apparaîtront ici lorsqu’ils seront publiés par votre professeur.</p></section>`,active);
  }catch(e){errorPage(e.message)}
}
function showCollection(kind){
  loadClass().then(x=>{
    const active=x.chapitres.map((ch,i)=>({ch,i,n:0})).filter(item=>item.ch.archive!==true).map((item,n)=>({...item,n}));
    let title=kind==='bilans'?'Mes bilans':kind==='memo'?'Mémorisation active':kind==='evaluations'?'Mes évaluations':'Ressources';
    const cards=active.map(({ch,i,n})=>{
      let has=kind==='bilans'?(ch.schema||ch.schemaPdf):kind==='memo'?(ch.memo||ch.memoPdf):kind==='evaluations'?ch.evaluationPdf:(ch.seances||[]).length;
      if(!has)return '';
      return `<article class="resource-row"><div class="resource-icon">${kind==='bilans'?'❖':kind==='memo'?'▤':kind==='evaluations'?'✓':'▰'}</div><div><span class="eyebrow">CHAPITRE ${n+1}</span><h3>${ch.titre}</h3><button class="soft-button" onclick="chapter(${i})">Ouvrir le chapitre →</button></div></article>`;
    }).join('');
    renderShell(-1,`<div class="section-heading-row"><button class="back-button" onclick="home()">← Retour</button><h2>${title}</h2></div>${cards||'<p class="muted">Aucun contenu publié dans cette rubrique pour le moment.</p>'}`,active);
  }).catch(e=>errorPage(e.message));
}

function fmtDate(d){
  if(!d)return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  return m?`${m[3]}/${m[2]}/${m[1]}`:esc(d);
}
function renderEntries(entries,label){
  if(!entries?.length)return "";
  const kind=label.includes("Correction")?"correction":label.includes("Bilan")?"summary":"activity";
  const title=kind==="activity"?"Activité":kind==="correction"?"Correction":"Bilan · À retenir";
  return `<section class="lesson-block block-${kind}"><h4>${title}</h4>${entries.map(e=>`<div class="lesson-entry">${e.date?`<div class="day-date">${fmtDate(e.date)}</div>`:""}<div class="rich-output">${e.texte||""}</div>${pdfButton(e.pdf,title)}</div>`).join("")}</section>`;
}

function plainChapterText(value){
  const node=document.createElement('div');
  node.innerHTML=value||'';
  return (node.textContent||'').replace(/\s+/g,' ').trim();
}
function goToChapterSection(event,id){
  const target=document.getElementById(id);
  if(!target)return;
  event.preventDefault();
  if(!target.hasAttribute('tabindex'))target.setAttribute('tabindex','-1');
  target.focus({preventScroll:true});
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView({behavior:reduced?'instant':'smooth',block:'start'});
}

async function chapter(i){
  try{
    const x=await loadClass();
    const ch=x.chapitres[i];
    if(!ch||ch.archive===true){await home();return;}
    const active=x.chapitres.map((item,index)=>({ch:item,i:index,n:0})).filter(item=>item.ch.archive!==true).map((item,n)=>({...item,n}));
    const n=active.findIndex(item=>item.i===i)+1;
    const sessions=(ch.seances||[]).map((lesson,j)=>`<article class="lesson-tile"><div class="lesson-tile-top"><span class="lesson-number">${j+1}</span><span class="eyebrow">SÉANCE ${j+1}</span></div><h3>${lesson.titre||'Séance '+(j+1)}</h3><div class="lesson-neutral" aria-hidden="true">✦</div><button class="soft-button" onclick="openLesson(${i},${j})">Voir la séance <span>›</span></button></article>`).join('');
    const inner=`<section class="chapter-title-card"><div class="chapter-title-number">${n}</div><div><span class="eyebrow">CHAPITRE ${n}</span><h1>${ch.titre||'Chapitre'}</h1></div><img src="${getChapterImage(ch.titre)}" alt="" onerror="this.style.display='none'"></section>
      <section class="dashboard-card germoir-card"><h2><img class="dashboard-logo" src="./logo-germoir.png" alt="Logo Germoir à idées"> Germoir à idées</h2><p class="muted">Ce que je sais déjà, mes questions, ce que j’aimerais découvrir…</p><div class="rich-output">${ch.germoir||'<p>Qu’est-ce que je sais déjà sur ce sujet ? Quelles questions est-ce que je me pose ?</p>'}</div>${pdfButton(ch.germoirPdf,'Ouvrir le germoir à idées')}</section>
      ${ch.problematique?`<section class="problem-banner"><div class="problem-icon"><img class="section-logo problem-logo" src="./logo-problematique.png" alt="Logo Problématique"></div><div><h2>Problématique</h2><div class="rich-output">${ch.problematique}</div></div></section>`:''}
      <section class="lessons-section"><div class="section-heading-row"><div><h2>Les séances du chapitre</h2><p class="muted">Découvre les activités, les documents et les exercices.</p></div><span class="overview-pill">▦ Vue d’ensemble</span></div><div class="lesson-tiles">${sessions||'<p class="muted">Aucune séance publiée pour ce chapitre.</p>'}</div></section>
      <div class="dashboard-two revision-panels"><section class="dashboard-card revision-card-dashboard"><h2><img class="dashboard-logo" src="./logo-schema-bilan.png" alt="Logo Schéma-bilan"> Schéma-bilan</h2><p class="muted">Un schéma pour comprendre et retenir l’essentiel du chapitre.</p>${ch.schema?`<div class="rich-output">${ch.schema}</div>`:''}${pdfButton(ch.schemaPdf,'Voir le schéma-bilan')}${!ch.schema&&!ch.schemaPdf?'<p class="muted">Document à venir.</p>':''}</section><section class="dashboard-card revision-card-dashboard"><h2><img class="dashboard-logo" src="./logo-memorisation.png" alt="Logo Fiche de mémorisation"> Fiche de mémorisation</h2><p class="muted">Une fiche synthétique et des cartes pour réviser.</p>${ch.memo?`<div class="rich-output">${ch.memo}</div>`:''}${pdfButton(ch.memoPdf,'Voir la fiche de mémorisation')}${!ch.memo&&!ch.memoPdf?'<p class="muted">Document à venir.</p>':''}</section></div>
      <section class="evaluation-strip"><img class="dashboard-logo evaluation-logo" src="./logo-evaluation.png" alt="Logo Évaluation"><div><h2>Évaluation</h2><p class="muted">Entraîne-toi pour vérifier tes connaissances.</p></div><div class="evaluation-actions">${ch.evaluationPdf?pdfButton(ch.evaluationPdf,'Évaluation du chapitre'):'<span class="muted">Évaluation à venir</span>'}</div></section>
      <div class="chapter-bottom-actions"><button class="soft-button" onclick="home()">← Accueil</button><button class="soft-button" onclick="printChapter(${i})">Imprimer / PDF du chapitre</button></div>`;
    renderShell(i,inner,active);
    window.scrollTo({top:0,behavior:'instant'});
  }catch(e){errorPage(e.message)}
}
async function openLesson(i,j){
  try{
    const x=await loadClass(); const ch=x.chapitres[i]; const lesson=ch?.seances?.[j];
    if(!ch||!lesson){await chapter(i);return;}
    const active=x.chapitres.map((item,index)=>({ch:item,i:index,n:0})).filter(item=>item.ch.archive!==true).map((item,n)=>({...item,n}));
    const body=`<div class="lesson-detail-top"><button class="back-button" onclick="chapter(${i})">← Retour au chapitre</button><span class="eyebrow">CHAPITRE ${active.findIndex(item=>item.i===i)+1} · SÉANCE ${j+1}</span><h1>${lesson.titre||'Séance '+(j+1)}</h1>${lesson.problematique?`<section class="problem-banner"><div><h2>Problème de la séance</h2><div class="rich-output">${lesson.problematique}</div></div></section>`:''}</div>
    ${renderEntries(lesson.activites,'Activité')}${renderEntries(lesson.corrections,'Correction')}${renderEntries(lesson.bilans,'Bilan')}${(!lesson.activites?.length&&!lesson.corrections?.length&&!lesson.bilans?.length&&lesson.activite)?`<section class="dashboard-card"><h2>Activité</h2><div class="rich-output">${lesson.activite}</div>${pdfButton(lesson.pdfActivite,'Ouvrir le document')}</section>`:''}
    ${(!lesson.activites?.length&&!lesson.corrections?.length&&!lesson.bilans?.length&&!lesson.activite)?'<p class="muted">Les documents de cette séance seront bientôt disponibles.</p>':''}<div class="chapter-bottom-actions"><button class="soft-button" onclick="chapter(${i})">← Toutes les séances</button><button class="soft-button" onclick="printChapter(${i})">Imprimer le chapitre</button></div>`;
    renderShell(i,body,active); window.scrollTo({top:0,behavior:'instant'});
  }catch(e){errorPage(e.message)}
}

/* Logo dans les documents exportés, indépendant du décor de l'écran. */
function addExportLogos(root){
  if(!root)return;
  const source=document.querySelector('.brand .logo img');
  if(!source?.src)return;
  let targets=[...root.querySelectorAll('.print-page,.correction-student-page,.print-cover')];
  targets=targets.filter(el=>!targets.some(parent=>parent!==el&&parent.contains(el)));
  if(!targets.length)targets=[root.querySelector('.print-preview-page')||root];
  targets.forEach(target=>{
    if(target.querySelector('.svt-export-brand'))return;
    const title=target.querySelector('h1');
    const brand=document.createElement('div');brand.className='svt-export-brand';
    const image=document.createElement('img');image.src=source.src;image.alt='Logo SVT';image.width=48;image.height=48;image.loading='eager';
    brand.appendChild(image);
    if(title){title.parentNode.insertBefore(brand,title);brand.appendChild(title);}
    else{const text=document.createElement('span');text.textContent='SVT · John Legent';brand.appendChild(text);target.insertBefore(brand,target.firstChild);}
  });
}
async function printDocumentWithLogo(root,prepare){
  try{
    addExportLogos(root);
    await Promise.all([...root.querySelectorAll('.svt-export-brand img')].map(image=>image.decode?image.decode():new Promise((resolve,reject)=>{
      if(image.complete){image.naturalWidth?resolve():reject(new Error('Logo non chargé.'));return;}
      image.onload=resolve;image.onerror=()=>reject(new Error('Logo non chargé.'));
    })));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    if(prepare&&prepare()===false)return false;
    window.print();return true;
  }catch(e){alert('Impression non lancée : '+e.message);return false;}
}

function chapterPrintHtml(ch,i){
  const linked=(url,label)=>url?`<div class="print-pdf"><span>DOCUMENT PDF</span> · <a href="${esc(url)}">${esc(label)}</a></div>`:"";
  const entries=(arr,label,kind)=>{
    if(!arr?.length)return "";
    return `<section class="print-learning print-${kind}">${arr.map((e,n)=>`<div class="print-entry ${n===0?"print-entry-first":""}">${n===0?`<h3>${label}</h3>`:""}${e.date?`<div class="print-date">${fmtDate(e.date)}</div>`:""}${e.texte?`<div class="rich-output">${e.texte}</div>`:""}${linked(e.pdf,"Ouvrir le document associé")}</div>`).join("")}</section>`;
  };
  return `<article class="print-notebook">
    <header class="print-cover"><div class="print-meta">CAHIER NUMÉRIQUE DE SVT · ${esc(classe)}</div><h1>Chapitre ${i+1} — ${ch.titre||""}</h1><p class="print-motto">Chaque observation est le début d'une découverte.</p></header>
    ${ch.problematique?`<section class="print-main-question"><h2>Problématique</h2><div class="rich-output">${ch.problematique}</div></section>`:""}
    ${ch.germoir||ch.germoirPdf?`<section class="print-germoir"><h2>Germoir à idées</h2>${ch.germoir?`<div class="rich-output">${ch.germoir}</div>`:""}${linked(ch.germoirPdf,"Ouvrir le PDF du germoir à idées")}</section>`:""}
    ${(ch.seances||[]).map((lesson,n)=>`<section class="print-lesson"><div class="print-lesson-opening"><div class="print-lesson-heading"><span class="print-lesson-number">${String(n+1).padStart(2,"0")}</span><h2>Séance ${n+1} — ${lesson.titre||""}</h2></div>${lesson.problematique?`<div class="print-lesson-question"><strong>Problème de la séance</strong><div class="rich-output">${lesson.problematique}</div></div>`:""}</div>${entries(lesson.activites,"Activité","activity")}${entries(lesson.corrections,"Correction","correction")}${entries(lesson.bilans,"Bilan · À retenir","summary")}${(!lesson.activites?.length&&!lesson.corrections?.length&&!lesson.bilans?.length&&lesson.activite)?`<div class="print-entry"><h3>Activité</h3><div>${esc(lesson.activite)}</div></div>`:""}</section>`).join("")}
    ${ch.schema||ch.schemaPdf||ch.memo||ch.memoPdf||ch.evaluationPdf?`<section class="print-revision"><h2>Pour réviser et se préparer</h2>${ch.schema||ch.schemaPdf?`<div class="print-revision-item"><h3>Schéma-bilan</h3>${ch.schema?`<div class="rich-output">${ch.schema}</div>`:""}${linked(ch.schemaPdf,"Ouvrir le schéma-bilan")}</div>`:""}${ch.memo||ch.memoPdf?`<div class="print-revision-item"><h3>Fiche de mémorisation</h3>${ch.memo?`<div class="rich-output">${ch.memo}</div>`:""}${linked(ch.memoPdf,"Ouvrir la fiche de mémorisation")}</div>`:""}${ch.evaluationPdf?`<div class="print-revision-item"><h3>Évaluation</h3>${linked(ch.evaluationPdf,"Ouvrir l'évaluation")}</div>`:""}</section>`:""}
    </article>`;
}

async function printChapter(i){
  try{
    const x=await loadClass();
    const ch=x.chapitres[i];
    if(!ch||ch.archive===true){alert("Ce chapitre n’est pas disponible dans le cahier élève.");return;}
    const area=document.getElementById("printArea");
    if(!area)throw new Error("Zone d'impression introuvable.");
    area.innerHTML=chapterPrintHtml(ch,i);
    const original=document.title;
    const titreSimple = document.createElement("div");
titreSimple.innerHTML = ch.titre || "";
document.title = `Cahier de SVT - ${
  titreSimple.textContent.trim() || ("Chapitre " + (i + 1))
}`;
    const cleanup=()=>{area.innerHTML="";document.title=original;window.removeEventListener("afterprint",cleanup);};
    window.addEventListener("afterprint",cleanup);
    await printDocumentWithLogo(area);
  }catch(e){alert("Impossible de préparer l'impression : "+e.message)}
}

function printSelectedChapter(){
  const select=document.getElementById("chapterToPrint");
  if(!select||select.value===""){alert("Choisis d'abord le chapitre à imprimer.");return;}
  printChapter(Number(select.value));
}


async function printAllChapters(){
  try{
    const x=await loadClass();
    const activeChapters=x.chapitres.map((ch,i)=>({ch,i})).filter(item=>item.ch.archive!==true);
    if(!activeChapters.length){alert("Aucun chapitre actif à imprimer.");return;}
    const area=document.getElementById("printArea");
    if(!area)throw new Error("Zone d'impression introuvable.");
    area.innerHTML=activeChapters.map(({ch,i})=>`<section class="chapter-print">${chapterPrintHtml(ch,i)}</section>`).join("");
    const original=document.title;
    document.title=`Cahier de SVT - ${classe}`;
    const cleanup=()=>{area.innerHTML="";document.title=original;window.removeEventListener("afterprint",cleanup);};
    window.addEventListener("afterprint",cleanup);
    await printDocumentWithLogo(area);
  }catch(e){alert("Impossible de préparer l'impression : "+e.message);}
}

function errorPage(msg){
  content.innerHTML=`<section class="hero error">
    <h2>⚠️ Impossible de charger le cahier</h2>
    <p class="muted">${esc(msg)}</p>
    <button class="btn" onclick="start()">Réessayer</button>
  </section>`;
}

start();
</script>
