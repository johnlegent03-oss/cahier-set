<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier numérique de SVT</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#4267a9;--accent2:#e8effc;--border:#dfe5ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.header{max-width:1100px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:var(--accent2);display:grid;place-items:center;font-size:23px}.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1100px;margin:auto;padding:0 22px 14px}
button,.link{font:inherit;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;font-weight:650}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:auto;padding:28px 22px 50px}
.hero{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px;margin-bottom:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}.hero h2{font-size:30px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card,.session{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:20px}
.card{cursor:pointer}.card:hover{border-color:#a9bde0}.card h3{margin:9px 0 6px}.muted{color:var(--muted);line-height:1.5;font-size:14px}.tag{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:var(--accent2);color:var(--accent)}
.progress{height:7px;background:#edf0f5;border-radius:10px;margin-top:15px;overflow:hidden}.progress span{display:block;height:100%;background:#6c8fc9;border-radius:10px}
.problem{background:#f0f5ff;border-left:4px solid #6c8fc9;padding:16px;border-radius:10px;margin-top:15px}.section{margin:26px 0 10px}.session{margin-bottom:14px}.date{font-size:12px;color:#718096;font-weight:800}.resources{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.resource{font-size:13px}.back{margin-bottom:15px}
.hidden{display:none!important}
footer{max-width:1100px;margin:auto;padding:0 22px 35px;color:var(--muted);font-size:12px}
@media(max-width:650px){.header{align-items:flex-start}.hero h2{font-size:25px}nav{overflow:auto;flex-wrap:nowrap}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="header">
    <div class="brand">
      <div class="logo">🧪</div>
      <div><h1>Cahier numérique de SVT</h1><p id="classLabel">Choisis ta classe</p></div>
    </div>
    <button id="back" class="back hidden">← Retour</button>
  </div>
  <nav aria-label="Menu principal">
    <button class="active" data-view="home">🏠 Accueil</button>
    <button data-view="chapters">📚 Chapitres</button>
    <button data-view="activities">📎 Activités</button>
    <button data-view="revision">🧠 Révisions</button>
  </nav>
</header>

<main id="content"></main>
<footer>Cahier numérique de SVT · Les contenus et documents peuvent être adaptés à chaque classe.</footer>

<script>
const classes=["3e1","3e3","3e5"];
let currentClass=null;
const data={
"3e1":{chapters:[
 {title:"La diversité génétique",problem:"Comment expliquer les différences entre les individus ?",sessions:[
  ["Séance 1","À la découverte de la diversité","Observation et mise en commun.",""],
  ["Séance 2","Des caractères différents","Étude de documents.",""],
  ["Séance 3","Les mutations","Étude d’un exemple de maladie génétique.",""]
 ]}
]},
"3e3":{chapters:[
 {title:"Pourquoi sommes-nous tous différents ?",problem:"D’où viennent les différences entre les individus ?",sessions:[
  ["Séance 1","La diversité des individus","Observation et comparaison de caractères.",""],
  ["Séance 2","À la recherche des différences","Activité documentaire.",""],
  ["Séance 3","Une origine génétique ?","Mise en relation des documents.",""]
 ]}
]},
"3e5":{chapters:[
 {title:"Des individus différents au sein d’une espèce",problem:"Comment expliquer la diversité observée dans une population ?",sessions:[
  ["Séance 1","Observer la diversité","Activité de lancement.",""],
  ["Séance 2","Comprendre les différences","Étude de documents.",""]
 ]}
]}
};

const content=document.getElementById("content"),label=document.getElementById("classLabel"),back=document.getElementById("back");

function setNav(view){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view))}
function home(){
 currentClass=null; label.textContent="Choisis ta classe"; back.classList.add("hidden"); setNav("home");
 content.innerHTML=`<section class="hero"><span class="eyebrow">Bienvenue</span><h2>Ton cahier de SVT</h2><p>Retrouve ici les chapitres, les activités et les ressources utilisés en classe. Chaque classe possède son propre cahier : les titres, problématiques, bilans et rythme peuvent donc être différents.</p></section>
 <div class="section"><h2>Choisir ma classe</h2><div class="grid">${classes.map(c=>`<article class="card" data-class="${c}"><span class="tag">Classe</span><h3>${c}</h3><p class="muted">Accéder au cahier de la classe →</p></article>`).join("")}</div></div>`;
 document.querySelectorAll("[data-class]").forEach(x=>x.onclick=()=>openClass(x.dataset.class));
}
function openClass(c){currentClass=c;label.textContent=c;back.classList.remove("hidden");showChapters()}
function showChapters(){
 setNav("chapters"); const d=data[currentClass];
 content.innerHTML=`<section class="hero"><span class="eyebrow">${currentClass}</span><h2>Nos chapitres</h2><p>Une organisation qui suit la progression de la classe.</p></section>
 <div class="grid">${d.chapters.map((ch,i)=>`<article class="card" data-chapter="${i}"><span class="tag">Chapitre ${i+1}</span><h3>${ch.title}</h3><p class="muted">${ch.problem}</p><div class="progress"><span style="width:${Math.min(92,35+i*18)}%"></span></div></article>`).join("")}</div>`;
 document.querySelectorAll("[data-chapter]").forEach(x=>x.onclick=()=>showChapter(+x.dataset.chapter));
}
function showChapter(i){
 const ch=data[currentClass].chapters[i]; setNav("chapters");
 content.innerHTML=`<button class="back" id="chapterBack">← Tous les chapitres</button>
 <section class="hero"><span class="eyebrow">Chapitre ${i+1}</span><h2>${ch.title}</h2><div class="problem"><strong>🎯 Notre problématique</strong><br>${ch.problem}</div></section>
 <section class="section"><h2>📖 Séances</h2>${ch.sessions.map((s,n)=>`<article class="session"><div class="date">SÉANCE ${n+1}</div><h3>${s[1]}</h3><p class="muted">${s[2]}</p><div class="resources"><a class="link resource" href="#" onclick="return false">📄 Activité</a><a class="link resource" href="#" onclick="return false">📎 Document</a>${n===1?'<a class="link resource" href="#" onclick="return false">🌐 Activité interactive</a>':""}</div></article>`).join("")}</section>
 <section class="hero"><span class="eyebrow">Bilan</span><h2>🧠 Ce que nous avons compris</h2><p>Le bilan construit avec la classe apparaîtra ici.</p><button class="resource" onclick="return false">🗺️ Voir le schéma-bilan</button></section>`;
 document.getElementById("chapterBack").onclick=showChapters;
}
function activities(){
 if(!currentClass){home();return} setNav("activities");
 content.innerHTML=`<section class="hero"><span class="eyebrow">${currentClass}</span><h2>📎 Activités et documents</h2><p>Les ressources sont regroupées ici pour les retrouver facilement.</p></section>
 <div class="grid">${data[currentClass].chapters.flatMap((ch,ci)=>ch.sessions.map((s,i)=>`<article class="card"><span class="tag">Chapitre ${ci+1} · Séance ${i+1}</span><h3>${s[1]}</h3><p class="muted">📄 Activité · 📎 Documents</p></article>`)).join("")}</div>`;
}
function revision(){
 if(!currentClass){home();return} setNav("revision");
 content.innerHTML=`<section class="hero"><span class="eyebrow">${currentClass}</span><h2>🧠 Révisions</h2><p>Les bilans, schémas et activités pour réviser les chapitres étudiés.</p></section>`;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 const v=b.dataset.view;
 if(v==="home")home(); else if(v==="chapters"){if(currentClass)showChapters();else home()} else if(v==="activities")activities(); else revision();
});
back.onclick=home;
home();
</script>
</body>
</html>
