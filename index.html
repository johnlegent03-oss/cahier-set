<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#1c2930;--muted:#68777a;--accent:#2f6f62;--accent2:#e4f1ec;--blue:#dce9f4;--border:#d8e2df}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 5%,rgba(47,111,98,.09),transparent 28%),radial-gradient(circle at 92% 18%,rgba(87,126,164,.09),transparent 25%),var(--bg);color:var(--text)}
header{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.head{max-width:1100px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--accent2),#eef5f2);display:grid;place-items:center;font-size:24px;box-shadow:0 5px 14px #2f6f621f}.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1100px;margin:auto;padding:0 22px 14px}button,.link{font:inherit;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;font-weight:650}nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px #2f6f6230}
main{max-width:1100px;margin:auto;padding:28px 22px 50px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffffff8,#f7fbf9f8);border:1px solid var(--border);border-radius:24px;padding:30px;margin-bottom:22px;box-shadow:0 10px 30px #1f373a0f}.hero:after{content:"🌿";position:absolute;right:22px;top:18px;font-size:46px;opacity:.12;transform:rotate(-12deg)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:850}.hero h2{font-size:30px;margin:7px 0}.hero p{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card,.session{background:#fffffff7;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 6px 18px #1f373a0a}.card{cursor:pointer;transition:.15s}.card:hover{border-color:#9abdb4;transform:translateY(-2px);box-shadow:0 10px 24px #1f373a14}.card h3{margin:9px 0 6px}.muted{color:var(--muted);line-height:1.5;font-size:14px}.tag{display:inline-block;font-size:12px;font-weight:750;padding:6px 10px;border-radius:999px;background:var(--accent2);color:var(--accent)}.problem{background:linear-gradient(135deg,#edf6f2,#eef4f8);border-left:4px solid var(--accent);padding:17px;border-radius:11px;margin-top:15px}.section{margin:26px 0 10px}.session{margin-bottom:14px}.date{font-size:12px;color:#718096;font-weight:800}.resources{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.resource{font-size:13px}.back{margin-bottom:15px}.hidden{display:none!important}footer{max-width:1100px;margin:auto;padding:0 22px 35px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:650px){.head{align-items:flex-start}.hero h2{font-size:25px}nav{overflow:auto;flex-wrap:nowrap}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="head"><div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p id="label">Choisis ton niveau</p></div></div><button id="back" class="hidden">← Retour</button></div>
<nav><button class="active" data-view="home">🏠 Accueil</button><button data-view="chapters">📚 Chapitres</button><button data-view="activities">📎 Activités</button><button data-view="revision">🧠 Révisions</button></nav>
</header>
<main id="content"></main>
<footer>Cahier numérique de SVT · Les contenus peuvent être personnalisés pour chaque classe.</footer>

<script>
/*
===========================================================
  ZONE À MODIFIER FACILEMENT
  Tu peux modifier les titres, problématiques, séances,
  descriptions, bilans et liens sans changer la structure
  du site.
===========================================================
*/
const cahier={
"6e":{classes:["6e1","6e2","6e3","6e4","6e5"],contenus:{
"6e1":[],"6e2":[],"6e3":[],"6e4":[],"6e5":[]
}},
"5e":{classes:["5e1","5e3","5e5"],contenus:{
"5e1":[],"5e3":[],"5e5":[]
}},
"3e":{classes:["3e2","3e3"],contenus:{
"3e2":[
{titre:"Chapitre 1 — Exemple",problematique:"Notre problématique apparaîtra ici.",seances:[
{titre:"Séance 1 — Exemple",description:"Décris ici ce que vous avez fait.",activite:"",document:""}
],bilan:"Le bilan construit avec la classe apparaîtra ici."}
],
"3e3":[]
}}
};

let niveau=null,classe=null;
const content=document.getElementById("content"),label=document.getElementById("label"),back=document.getElementById("back");

function setNav(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v))}
function home(){
niveau=null;classe=null;label.textContent="Choisis ton niveau";back.classList.add("hidden");setNav("home");
content.innerHTML=`<section class="hero"><span class="eyebrow">Bienvenue</span><h2>Ton cahier de SVT</h2><p>Choisis ton niveau pour retrouver le cahier de ta classe.</p></section>
<div class="grid">${Object.keys(cahier).map(n=>`<article class="card" data-niveau="${n}"><span class="tag">Niveau</span><h3>${n}</h3><p class="muted">${cahier[n].classes.length} classe(s) · Accéder →</p></article>`).join("")}</div>`;
document.querySelectorAll("[data-niveau]").forEach(x=>x.onclick=()=>openNiveau(x.dataset.niveau))
}
function openNiveau(n){
niveau=n;classe=null;label.textContent=n;back.classList.remove("hidden");setNav("chapters");
content.innerHTML=`<section class="hero"><span class="eyebrow">Niveau ${n}</span><h2>Choisir ma classe</h2><p>Chaque classe possède son propre cahier.</p></section>
<div class="grid">${cahier[n].classes.map(c=>`<article class="card" data-classe="${c}"><span class="tag">Classe</span><h3>${c}</h3><p class="muted">Ouvrir le cahier →</p></article>`).join("")}</div>`;
document.querySelectorAll("[data-classe]").forEach(x=>x.onclick=()=>openClasse(x.dataset.classe))
}
function openClasse(c){classe=c;label.textContent=c;showChapters()}
function showChapters(){
setNav("chapters");const list=cahier[niveau].contenus[classe]||[];
content.innerHTML=`<button class="back" id="back2">← ${niveau}</button>
<section class="hero"><span class="eyebrow">${classe}</span><h2>Nos chapitres</h2><p>Les titres, problématiques, séances et bilans peuvent être différents selon la classe.</p></section>
${list.length?`<div class="grid">${list.map((ch,i)=>`<article class="card" data-ch="${i}"><span class="tag">Chapitre ${i+1}</span><h3>${ch.titre}</h3><p class="muted">${ch.problematique||""}</p></article>`).join("")}</div>`:
`<section class="hero"><h3>Le cahier est prêt à être rempli.</h3><p class="muted">Aucun chapitre n’a encore été ajouté pour cette classe.</p></section>`}`;
document.getElementById("back2").onclick=()=>openNiveau(niveau);
document.querySelectorAll("[data-ch]").forEach(x=>x.onclick=()=>showChapter(+x.dataset.ch))
}
function showChapter(i){
const ch=cahier[niveau].contenus[classe][i];
content.innerHTML=`<button class="back" id="back3">← Tous les chapitres</button>
<section class="hero"><span class="eyebrow">Chapitre ${i+1}</span><h2>${ch.titre}</h2><div class="problem"><strong>🎯 Notre problématique</strong><br>${ch.problematique||""}</div></section>
<section class="section"><h2>📖 Séances</h2>${(ch.seances||[]).map((s,n)=>`<article class="session"><div class="date">SÉANCE ${n+1}</div><h3>${s.titre}</h3><p class="muted">${s.description||""}</p><div class="resources">${s.activite?`<a class="link resource" href="${s.activite}" target="_blank">📄 Activité</a>`:""}${s.document?`<a class="link resource" href="${s.document}" target="_blank">📎 Document</a>`:""}</div></article>`).join("")||`<p class="muted">Aucune séance ajoutée pour le moment.</p>`}</section>
<section class="hero"><span class="eyebrow">Bilan</span><h2>🧠 Ce que nous avons compris</h2><p>${ch.bilan||""}</p></section>`;
document.getElementById("back3").onclick=showChapters
}
function simple(v){
if(!classe){home();return}setNav(v);
content.innerHTML=`<section class="hero"><span class="eyebrow">${classe}</span><h2>${v==="activities"?"📎 Activités et documents":"🧠 Révisions"}</h2><p>${v==="activities"?"Retrouve les documents et activités de la classe.":"Retrouve les bilans et schémas utiles pour réviser."}</p></section>`
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==="home")home();else if(v==="chapters"){if(niveau)openNiveau(niveau);else home()}else simple(v)});
back.onclick=home;home();
</script>
</body>
</html>
