<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#203037;--muted:#6b7b7d;--accent:#397466;--accent2:#e4f1ec;--border:#d8e3df}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,#dceee7aa,transparent 28%),radial-gradient(circle at 95% 15%,#e2ebf6aa,transparent 25%),var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.head{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:var(--accent2);display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
nav{max-width:1100px;margin:auto;padding:0 20px 12px;display:flex;gap:7px;flex-wrap:wrap}button,.btn{font:inherit;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:650;text-decoration:none}nav button.active{background:var(--accent);color:white;border-color:var(--accent)}
main{max-width:1100px;margin:auto;padding:26px 20px 50px}.hero{background:#ffffffed;border:1px solid var(--border);border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:0 8px 25px #23413b0d}.hero h2{font-size:29px;margin:7px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card,.session{background:#ffffffed;border:1px solid var(--border);border-radius:17px;padding:19px;box-shadow:0 5px 16px #23413b0b}.card{cursor:pointer}.card:hover{border-color:#9dbdb5}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:11px;font-weight:800}.problem{background:#edf6f2;border-left:4px solid var(--accent);border-radius:10px;padding:15px;margin-top:14px}.session{margin:12px 0}.resources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{font-size:12px;color:var(--muted)}.back{margin-bottom:14px}.editbox{background:#fff;border:1px dashed #a9c5bc;border-radius:16px;padding:16px;margin:12px 0}.editbox label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.editbox input,.editbox textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;font:inherit;margin-bottom:12px}.editbox textarea{min-height:85px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.teacher{background:#fff7e7;border-color:#ead6a8}.danger{background:#fff0ef;border-color:#efc0ba}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
</style>
</head>
<body>
<header>
<div class="head"><div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p id="label">Choisis ton niveau</p></div></div><button id="back" class="hidden">← Retour</button></div>
<nav><button class="active" data-view="home">🏠 Accueil</button><button data-view="chapters">📚 Chapitres</button><button data-view="activities">📎 Activités</button><button data-view="revision">🧠 Révisions</button><button id="teacherBtn">✏️ Mode professeur</button></nav>
</header>
<main id="content"></main>
<footer>Les contenus sont personnalisables pour chaque classe.</footer>

<script>
const KEY="cahierSVT";
const initial={
"6e":{classes:["6e1","6e2","6e3","6e4","6e5"]},
"5e":{classes:["5e1","5e3","5e5"]},
"3e":{classes:["3e2","3e3"]}
};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{};
Object.keys(initial).forEach(n=>{data[n]??={};data[n].classes=initial[n].classes;data[n].contenus??={};data[n].classes.forEach(c=>data[n].contenus[c]??=[]);});
let niveau=null,classe=null,teacher=false;
const $=s=>document.querySelector(s), content=$("#content"), label=$("#label"), back=$("#back");
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function nav(v){document.querySelectorAll("nav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v))}
function home(){
niveau=null;classe=null;label.textContent="Choisis ton niveau";back.classList.add("hidden");
document.querySelectorAll("nav button[data-view]").forEach(b=>b.classList.remove("active"));
document.querySelector("nav").classList.add("hidden");
content.innerHTML=`<section class="hero" style="text-align:center;padding:42px 28px">
<span class="eyebrow">Bienvenue</span>
<h2>🧪 Cahier numérique de SVT</h2>
<p class="muted">Choisis ton niveau pour accéder au cahier de ta classe.</p>
</section>
<div class="grid">${Object.keys(initial).map(n=>`<article class="card" onclick="openNiveau('${n}')"><span class="tag">Niveau</span><h3>${n}</h3><p class="muted">${initial[n].classes.length} classe(s) · Accéder →</p></article>`).join("")}</div>`;
}
function openNiveau(n){
niveau=n;classe=null;label.textContent=n;back.classList.remove("hidden");document.querySelector("nav").classList.add("hidden");
content.innerHTML=`<button class="back" onclick="home()">← Accueil</button><section class="hero"><span class="eyebrow">${n}</span><h2>Choisir ma classe</h2><p class="muted">Chaque classe avance à son rythme.</p></section><div class="grid">${data[n].classes.map(c=>`<article class="card" onclick="openClasse('${c}')"><span class="tag">Classe</span><h3>${c}</h3><p class="muted">${data[n].contenus[c].length} chapitre(s) · Ouvrir →</p></article>`).join("")}</div>`;
}
function openClasse(c){classe=c;label.textContent=c;document.querySelector("nav").classList.remove("hidden");nav("home");showClassHome()}
function showClassHome(){
content.innerHTML=`<button class="back" onclick="openNiveau('${niveau}')">← ${niveau}</button>
<section class="hero"><span class="eyebrow">${classe}</span><h2>Bienvenue dans ton cahier</h2><p class="muted">Retrouve ici tout ce que nous construisons en classe.</p></section>
<div class="grid">
<article class="card" onclick="showChapters()"><span class="tag">Cours</span><h3>📚 Nos chapitres</h3><p class="muted">Retrouver la progression et les séances.</p></article>
<article class="card" onclick="simple('activities')"><span class="tag">Ressources</span><h3>📎 Activités</h3><p class="muted">Documents, activités et liens.</p></article>
<article class="card" onclick="simple('revision')"><span class="tag">Révisions</span><h3>🧠 Réviser</h3><p class="muted">Bilans et schémas utiles.</p></article>
</div>`;
}
function showChapters(){
nav("chapters");const list=data[niveau].contenus[classe];
content.innerHTML=`<button class="back" onclick="openNiveau('${niveau}')">← ${niveau}</button><section class="hero"><span class="eyebrow">${classe}</span><h2>Nos chapitres</h2><p class="muted">Le cahier se construit au fil des séances.</p></section>
<div class="row" style="margin-bottom:14px">${teacher?`<button onclick="addChapter()">➕ Ajouter un chapitre</button><button onclick="exportData()">💾 Exporter le cahier</button>`:""}</div>
${list.length?`<div class="grid">${list.map((ch,i)=>`<article class="card" onclick="showChapter(${i})"><span class="tag">Chapitre ${i+1}</span><h3>${esc(ch.titre||"Nouveau chapitre")}</h3><p class="muted">${esc(ch.problematique||"Problématique à construire")}</p></article>`).join("")}</div>`:`<section class="hero"><h3>Le cahier est vide.</h3><p class="muted">${teacher?"Clique sur « Ajouter un chapitre » pour commencer.":"Les contenus apparaîtront ici au fur et à mesure."}</p></section>`}`;
}
function showChapter(i){
const ch=data[niveau].contenus[classe][i];
content.innerHTML=`<button class="back" onclick="showChapters()">← Tous les chapitres</button>
${teacher?editor(i,ch):reader(i,ch)}`;
}
function reader(i,ch){
return `<section class="hero"><span class="eyebrow">Chapitre ${i+1}</span><h2>${esc(ch.titre||"Nouveau chapitre")}</h2><div class="problem"><strong>🎯 Notre problématique</strong><br>${esc(ch.problematique||"À construire avec la classe.")}</div></section>
<section><h2>📖 Séances</h2>${(ch.seances||[]).map((s,n)=>`<article class="session"><div class="small">SÉANCE ${n+1}</div><h3>${esc(s.titre||"Séance")}</h3><p class="muted">${esc(s.description||"")}</p>${s.document?`<a class="btn" href="${esc(s.document)}" target="_blank">📎 Ouvrir le document</a>`:""}</article>`).join("")||`<p class="muted">Aucune séance pour le moment.</p>`}</section>
<section class="hero"><span class="eyebrow">Bilan</span><h2>🧠 Ce que nous avons compris</h2><p class="muted">${esc(ch.bilan||"Le bilan apparaîtra ici.")}</p></section>`;
}
function editor(i,ch){
return `<section class="hero teacher"><span class="eyebrow">Mode professeur · ${classe}</span><h2>✏️ Modifier le chapitre</h2>
<div class="editbox"><label>Titre du chapitre</label><input id="titre" value="${attr(ch.titre||"")}"><label>Problématique</label><textarea id="prob">${esc(ch.problematique||"")}</textarea><label>Bilan</label><textarea id="bilan">${esc(ch.bilan||"")}</textarea></div>
<h2>📖 Séances</h2><div id="sessions">${(ch.seances||[]).map((s,n)=>sessionEditor(s,n)).join("")}</div>
<div class="row"><button onclick="addSession(${i})">➕ Ajouter une séance</button><button onclick="saveChapter(${i})">💾 Enregistrer</button><button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer</button></div></section>`;
}
function sessionEditor(s,n){return `<div class="editbox"><label>Séance ${n+1} — titre</label><input class="st" value="${attr(s.titre||"")}"><label>Ce que nous avons fait</label><textarea class="sd">${esc(s.description||"")}</textarea><label>Lien vers le document / activité (facultatif)</label><input class="sl" placeholder="https://..." value="${attr(s.document||"")}"></div>`}
function addChapter(){data[niveau].contenus[classe].push({titre:"Nouveau chapitre",problematique:"",seances:[],bilan:""});save();showChapters();showChapter(data[niveau].contenus[classe].length-1)}
function addSession(i){const ch=data[niveau].contenus[classe][i];ch.seances.push({titre:"Nouvelle séance",description:"",document:""});save();showChapter(i)}
function saveChapter(i){
const ch=data[niveau].contenus[classe][i];ch.titre=$("#titre").value;ch.problematique=$("#prob").value;ch.bilan=$("#bilan").value;
ch.seances=[...document.querySelectorAll("#sessions .editbox")].map((box)=>({titre:box.querySelector(".st").value,description:box.querySelector(".sd").value,document:box.querySelector(".sl").value}));
save();showChapter(i);
}
function deleteChapter(i){if(confirm("Supprimer ce chapitre ?")){data[niveau].contenus[classe].splice(i,1);save();showChapters()}}
function exportData(){
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cahier-svt-donnees.json";a.click();
}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function attr(x){return esc(x)}
$("#teacherBtn").onclick=()=>{teacher=!teacher;$("#teacherBtn").textContent=teacher?"👩‍🏫 Quitter le mode professeur":"✏️ Mode professeur";if(classe)showChapters();else home()};
back.onclick=home;home();
</script>
</body>
</html>
