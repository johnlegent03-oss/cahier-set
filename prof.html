<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur professeur — Cahier numérique de SVT</title>
<style>
:root{--bg:#eef6f2;--card:#fff;--text:#213331;--muted:#6f807d;--a:#34796a;--a-dark:#286456;--a2:#dff0e9;--b:#d5e4de;--danger:#fff0ef;--shadow:0 12px 35px rgba(35,65,59,.08);--shadow-hover:0 16px 40px rgba(35,65,59,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 5% 0%,#d8eee5 0,transparent 28%),radial-gradient(circle at 95% 10%,#edf4d9 0,transparent 24%),var(--bg);color:var(--text);min-height:100vh}
#printOverlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.72);overflow:auto;padding:20px}.print-sheet{font-family:Arial,sans-serif;color:#111;background:#fff}.print-sheet .print-page{width:100%;min-height:270mm;padding:2mm;page-break-after:always;box-sizing:border-box}.print-sheet .print-page:last-child{page-break-after:auto}@media print{html,body{margin:0!important;padding:0!important;background:#fff!important}body > *:not(#printOverlay){display:none!important}#printOverlay{display:block!important;position:static!important;inset:auto!important;width:100%!important;background:#fff!important;padding:0!important;overflow:visible!important}.print-preview-toolbar{display:none!important}.print-sheet{display:block!important;width:100%!important;margin:0!important;padding:0!important;font-size:12px!important;line-height:1.34!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print-sheet .print-page{
  min-height:0!important;
  height:auto!important;
  padding:0!important;
  margin:0!important;
  page-break-after:always!important;
  break-after:auto!important;
}
.print-sheet .print-page:last-child{
  page-break-after:auto!important;
  break-after:auto!important;
}
.print-sheet h1{font-size:24px!important;margin:0 0 7px!important}.print-sheet h2{font-size:17px!important;margin:10px 0 6px!important;padding-bottom:3px!important}.print-sheet h3{font-size:15px!important;margin:9px 0 5px!important}.print-sheet h4{font-size:14px!important;margin:0 0 4px!important}.print-sheet th,.print-sheet td{padding:7px!important}.print-sheet .criterion{padding:9px!important;margin:8px 0!important}.print-sheet .criterion li{padding:3px 0!important}.print-sheet .mastery{padding:9px!important;margin-top:8px!important}.print-sheet .footer{display:none!important}.correction-compact{
  font-size:9px!important;
  line-height:1.12!important;
  padding:2mm!important;
}

.correction-compact h1{
  font-size:17px!important;
  margin:0 0 4px!important;
}

.correction-compact h2{
  font-size:12px!important;
  margin:5px 0 3px!important;
}

.correction-compact h3{
  font-size:10px!important;
  margin:3px 0 2px!important;
}

.correction-compact .result{
  padding:4px!important;
  margin:4px 0!important;
  font-size:10px!important;
}

.correction-compact .mastery-summary{
  padding:5px!important;
  margin:5px 0!important;
}

.correction-compact section{
  margin:3px 0!important;
  padding:0!important;
}

.correction-compact .criterion{
  padding:4px!important;
  margin:3px 0!important;
}

.correction-compact .criterion li{
  padding:1px 0!important;
  margin:0!important;
}

.correction-compact .status{
  margin:2px 0!important;
}

.correction-compact .mastery{
  padding:3px!important;
  margin:3px 0!important;
  font-size:9px!important;
}

.correction-compact ul{
  margin:2px 0 2px 14px!important;
  padding:0!important;
}}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(213,228,222,.9);box-shadow:0 4px 18px rgba(30,65,55,.05)}
.head{max-width:1120px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#dff3eb,#cce8dd);display:grid;place-items:center;font-size:23px;box-shadow:inset 0 0 0 1px #c6e1d7}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1120px;margin:auto;padding:28px 20px 55px}
button,.btn{font:inherit;border:1px solid var(--b);background:#fff;color:var(--text);border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:700;text-decoration:none;transition:.18s ease}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,70,60,.08)}
button.primary{background:linear-gradient(135deg,var(--a),#428978);color:#fff;border-color:var(--a);box-shadow:0 7px 18px rgba(52,121,106,.18)}
button.danger{background:var(--danger);border-color:#efc0ba;color:#9d4b45}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.hero,.card,.editbox{background:rgba(255,255,255,.93);border:1px solid var(--b);border-radius:20px;padding:21px;box-shadow:var(--shadow)}
.hero{border-radius:24px;margin-bottom:19px}.hero h2{font-size:29px;line-height:1.15;margin:7px 0 10px;letter-spacing:-.025em}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--a);font-weight:850}
.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card{cursor:pointer;position:relative;overflow:hidden;transition:.2s ease}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#66a995,#34796a);opacity:.8}
.card:hover{transform:translateY(-3px);border-color:#a9cbc0;box-shadow:var(--shadow-hover)}.card h3{margin:11px 0 7px;font-size:20px}
.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--a2);color:var(--a);font-size:11px;font-weight:850}
.editbox{margin:14px 0;border-style:dashed;background:rgba(255,255,255,.72)}
.teacher{background:radial-gradient(circle at 100% 0%,#fff0c5aa,transparent 30%),rgba(255,250,235,.96);border-color:#ead6a8}
.editbox label{display:block;font-size:12px;font-weight:850;margin:10px 0 6px;color:#425552}
input,select{width:100%;border:1px solid var(--b);border-radius:10px;padding:10px 11px;font:inherit;background:#fff;color:var(--text);outline:none;transition:.15s ease}
  .ev-class-check{
  width:auto!important;
  flex:0 0 auto;
}
input:focus,select:focus{border-color:#79ad9d;box-shadow:0 0 0 3px #dff0e988}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}
.error{background:#fff0ef;border:1px solid #efc0ba}.login{max-width:460px;margin:55px auto}.status{font-size:12px;color:var(--muted)}
.save-indicator{display:inline-flex;align-items:center;gap:6px;min-height:20px}.save-indicator.saving{color:#a06b18}.save-indicator.saved{color:var(--a)}.save-indicator.error{color:#9d4b45;background:none;border:0}
.session-box{border:1px solid var(--b);border-radius:17px;padding:17px;margin:14px 0;background:linear-gradient(180deg,#fff,#fbfdfc);box-shadow:0 5px 18px rgba(35,65,59,.05);position:relative}
.session-box:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:5px;background:#72aa9a}
.session-box strong{font-size:15px}
.rich-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px;background:#f6faf8;border:1px solid var(--b);border-radius:10px 10px 0 0}
.rich-toolbar button{padding:6px 9px;min-width:34px;border-radius:8px;font-weight:800}.rich-toolbar select{width:auto;min-width:95px;padding:6px 8px;border-radius:8px}
.rich-editor{min-height:105px;border:1px solid var(--b);border-top:0;border-radius:0 0 10px 10px;padding:11px;background:#fff;line-height:1.55;outline:none;overflow:auto}
.rich-editor:focus{border-color:#79ad9d;box-shadow:0 0 0 3px #dff0e988}.rich-editor:empty:before{content:attr(data-placeholder);color:#9aa3af}
.session-problem{min-height:65px}.entry{border:1px solid #dce8e3;border-radius:13px;padding:13px;margin:12px 0;background:#fbfdfc}
.entry-head{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.entry-date{width:170px}.entry-type{font-size:12px;font-weight:850;color:var(--a);text-transform:uppercase;letter-spacing:.06em}
.entry-actions{display:flex;gap:6px;align-items:center}.entry-actions button{padding:6px 9px}.entry-add{border-style:dashed;color:var(--a);background:#f7fbf9;width:100%;margin-top:5px}
.entry-label{font-size:12px;font-weight:850;margin:10px 0 6px;color:#425552}.entry-text{min-height:110px}
.pdf-box{background:#f4faf7;border:1px solid #cfe4dc;border-radius:12px;padding:11px;margin:9px 0}.pdf-box strong{font-size:12px;color:#42645c}.pdf-box input{margin-top:7px}.pdf-ok{display:inline-flex;margin-top:7px}
.pdf-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.pdf-existing{padding-bottom:8px}.legacy-note{font-size:12px;color:#7a6a49;background:#fff8e8;border:1px solid #ead6a8;border-radius:10px;padding:9px;margin-top:8px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}
.global-home{position:fixed;left:18px;bottom:18px;z-index:1000;display:none;box-shadow:0 8px 22px rgba(30,70,60,.18);background:#fff}.global-home.show{display:inline-flex}.global-home:hover{transform:translateY(-2px)}
.quick-nav{position:fixed;right:18px;bottom:18px;z-index:1000;display:none;min-width:230px;padding:10px 12px;border:1px solid var(--b);border-radius:12px;background:#fff;color:var(--text);box-shadow:0 8px 22px rgba(30,70,60,.18);font:inherit;font-weight:700}.quick-nav.show{display:block}.quick-nav:focus{outline:2px solid #8bc5b5;outline-offset:2px}@media(max-width:650px){.quick-nav{right:12px;bottom:12px;min-width:190px;max-width:calc(100vw - 24px)}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
@media(max-width:650px){main{padding:18px 12px 40px}.head{padding:10px 12px}.brand h1{font-size:16px}.brand p{font-size:11px}.logo{width:41px;height:41px}.hero{padding:17px;border-radius:18px}.hero h2{font-size:24px}.grid{grid-template-columns:1fr}.session-box{padding:14px}.entry-date{width:100%}}

.small-note{font-size:12px;color:var(--muted)}
</style>
<style id="compact-screen-design">

/* Design compact : uniquement à l'écran, sans modifier les PDF. */
@media screen {
  :root{--muted:#586e65;--shadow:0 4px 18px rgba(35,65,59,.045);--shadow-hover:0 8px 24px rgba(35,65,59,.08)}
  body{background:linear-gradient(160deg,#f3f8f5,#edf5f0);font-size:15px;line-height:1.45}
  .head{max-width:1200px;padding:9px 20px;gap:10px}
  .brand{gap:10px;min-width:0}
  .logo{width:38px;height:38px;border-radius:11px;font-size:20px;flex:0 0 auto}
  .brand h1{font-size:17px;line-height:1.25}
  .brand p{margin:2px 0 0;font-size:12px}
  main{max-width:1200px;padding:20px 20px 72px}
  button,.btn{padding:8px 12px;border-radius:9px;font-size:14px;line-height:1.35;min-height:40px}
  button:hover,.btn:hover{transform:none}
  button.primary{background:var(--a);box-shadow:0 3px 9px rgba(52,121,106,.12)}
  button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #71a892;outline-offset:3px}
  .hero,.card,.editbox{border-radius:15px;padding:16px}
  .hero{margin-bottom:14px}
  .hero h2{font-size:24px;line-height:1.25;margin:5px 0 8px}
  .hero h3{font-size:18px}
  .hero p{margin-top:7px;margin-bottom:9px}
  .eyebrow{font-size:10px;letter-spacing:.1em}
  .muted{line-height:1.45}
  .grid{gap:12px}
  .row{gap:8px;margin:10px 0}
  .entry-head{gap:10px}
  .editbox{margin:12px 0}
  .eval-card{padding:14px;border-radius:13px;margin:9px 0}
  .eval-toolbar{margin:10px 0;gap:8px}
  .criteria-box{padding:12px;border-radius:12px;margin:10px 0}
  .tracking-filters{gap:10px;margin-top:12px}
  .tracking-summary{gap:10px}
  .tracking-stat{padding:12px;border-radius:12px}
  .tracking-stat strong{font-size:23px}
  input:not([type=checkbox]):not([type=radio]),select{padding:9px 11px;font-size:15px;min-height:40px}
  .mastery-table th,.mastery-table td{padding:9px 10px;line-height:1.4}
  .mastery-table th{background:#f2f7f4;color:#425b50}
  .mastery-table tbody tr:hover{background:#f7faf8}
  .section-heading{margin-top:20px}
  .tag{font-size:10px;padding:4px 8px}
  .card h3{font-size:18px;margin:9px 0 6px}
  .card:hover{transform:translateY(-1px)}
  .global-home{left:14px;bottom:14px;padding:9px 13px}
  footer{padding-bottom:24px}
  /* Accueil : les regroupements restent inchangés. */
  .home-intro{padding:20px 24px !important;text-align:left !important;background:linear-gradient(110deg,#fff,#f0f8f3);border-left:4px solid #34796a}
  .home-intro h2{font-size:27px;margin:5px 0 7px}
  .home-intro p{margin:0;max-width:680px}
  #content > section[aria-labelledby^="home"]{margin-top:20px !important}
  #content > section[aria-labelledby^="home"] > h2{font-size:17px;margin:0 0 10px;line-height:1.3;letter-spacing:-.01em}
  #content > section[aria-labelledby^="home"] .card{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:15px;cursor:default}
  #content > section[aria-labelledby^="home"] .card p{font-size:13px;line-height:1.45;margin:0 0 12px;flex:1}
  #content > section[aria-labelledby^="home"] .card h3{font-size:17px;line-height:1.3;margin:8px 0 6px}
  #content > section[aria-labelledby^="home"] .card button{margin-top:auto;align-self:flex-start;min-height:40px;padding:8px 15px}
  #content > section[aria-labelledby="homeEvaluate"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #content > section[aria-labelledby="homeFollow"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  #content > section[aria-labelledby="homeManage"] .grid{grid-template-columns:minmax(0,560px)}
  #pendingDashboard{margin-top:20px !important;padding:16px}
  #pendingDashboard h2{font-size:23px}
  #pendingDashboard .pending-row{padding:12px;border-radius:11px}
}
@media screen and (max-width:1000px){
  #content > section[aria-labelledby="homeFollow"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:650px){
  .head{padding:9px 12px}.brand h1{font-size:15px}.logo{width:34px;height:34px;font-size:18px}
  #logoutBtn{font-size:12px;padding:7px 9px;flex:0 0 auto}
  main{padding:14px 12px 74px}
  .hero,.card,.editbox{padding:14px;border-radius:13px}
  .hero h2{font-size:22px}
  .home-intro{padding:17px !important}.home-intro h2{font-size:23px}
  #content > section[aria-labelledby="homeEvaluate"] .grid,
  #content > section[aria-labelledby="homeFollow"] .grid,
  #content > section[aria-labelledby="homeManage"] .grid{grid-template-columns:minmax(0,1fr)}
  #content > section[aria-labelledby^="home"] .card{padding:14px}
  .tracking-filters{grid-template-columns:minmax(0,1fr)}
  .grid{gap:10px}
  .global-home{left:12px;bottom:12px}
}
@media screen and (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}button,.btn,.card{transition:none}.card:hover{transform:none}
}
</style>
<style id="naturalist-theme">

/* Identité naturaliste — écran uniquement. */
@media screen {
 :root{--bg:#f5f4eb;--card:#fffef9;--text:#24372a;--muted:#58644e;--a:#314c36;--a-dark:#243a28;--a2:#e9eddd;--b:#d9ddce;--danger:#fff1eb;--shadow:0 5px 20px rgba(47,61,35,.045);--shadow-hover:0 10px 28px rgba(47,61,35,.09)}
 body{background:radial-gradient(ellipse at 0 0,#e8ecdc 0,transparent 45%),radial-gradient(ellipse at 100% 65%,#ececdb 0,transparent 45%),#f6f5ef}
 header{background:rgba(255,254,248,.96);border-bottom:1px solid #d6dccb;box-shadow:none}
 .brand .logo{width:48px;height:48px;border-radius:50%;padding:3px;background:#fff;box-shadow:0 0 0 1px #d8ddcc;overflow:hidden}
 .brand .logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
 .brand h1{color:#2a402e;font-weight:700;letter-spacing:-.02em}
 .brand p{color:#667057}
 .hero,.card,.editbox,.eval-card{background:#fffef9;border-color:#d9ddce}
 .hero h2{font-family:Georgia,'Times New Roman',serif;font-weight:500;color:#2c432d;letter-spacing:-.025em}
 button,.btn{border-color:#cfd6c1;background:#fffef9;color:#30452f}
 button.primary{background:#344e37;border-color:#344e37;color:#fff;box-shadow:0 3px 9px #314c3614}
 button.primary:hover{background:#263f2c;border-color:#263f2c}
 button.danger{background:#fff0e8;color:#934a34;border-color:#e4c7b7}
 button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline-color:#8b9b60}
 .tag{background:#eceddf;color:#59673b;border:1px solid #dde1cc;letter-spacing:.025em}
 .eyebrow{color:#687746}
 input:not([type=checkbox]):not([type=radio]),select,textarea{background:#fffefb;border-color:#d2d9c6}
 input:focus,select:focus{border-color:#7c9069;box-shadow:0 0 0 3px #e8eddd}
 .criteria-box,.tracking-stat{background:#f5f6ed;border-color:#dbe0cc}
 .mastery-table th{background:#ecf0e1;color:#43543b}
 .mastery-table tbody tr:hover{background:#f5f7ee}

const safe=v=>v==null?"":String(v);
function sanitizeRichHtml(value){
  const html=safe(value);
  if(!html)return "";
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const root=doc.body.firstElementChild;
  if(!root)return "";
  const allowedTags=new Set(["B","I","U","BR","P","DIV","SPAN","STRONG","EM","MARK","SMALL","SUB","SUP","UL","OL","LI","H1","H2","H3","H4","H5","H6","TABLE","THEAD","TBODY","TR","TH","TD","A","FONT"]);
  const allowedStyle=new Set(["color","background-color","font-family","font-size","font-weight","font-style","text-decoration","text-align"]);
  [...root.querySelectorAll("*")].forEach(el=>{
    if(!allowedTags.has(el.tagName)){el.replaceWith(...[...el.childNodes]);return;}
    if(el.tagName==="FONT" && el.getAttribute("color")){
  const color=el.getAttribute("color");
  el.style.color=color;
  el.removeAttribute("color");
}
    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      if(name==="style"){
        const clean=attr.value.split(";").map(x=>x.trim()).filter(Boolean).filter(part=>{
          const i=part.indexOf(":"); if(i<1)return false;
          const prop=part.slice(0,i).trim().toLowerCase();
          const val=part.slice(i+1).trim().toLowerCase();
          return allowedStyle.has(prop)&&!(/[<>]|url\s*\(|javascript:|expression\s*\(/i.test(val));
        }).join("; ");
        if(clean)el.setAttribute("style",clean);else el.removeAttribute("style");
      }else if(name==="href"&&el.tagName==="A"){
        try{
          const u=new URL(attr.value,location.href);
          if(!/^https?:$/i.test(u.protocol)&&u.origin!==location.origin)throw new Error("unsafe");
          el.setAttribute("href",u.href);
          el.setAttribute("target","_blank");
          el.setAttribute("rel","noopener noreferrer");
        }catch(e){el.removeAttribute("href");}
      }else{el.removeAttribute(attr.name);}
    });
  });
  return root.innerHTML;
}
function jsArg(v){

function legacyEntries(text,pdf){

async function clearPdf(button){
  const box=button.closest(".pdf-box");
  if(!box)return;

  const oldUrl=
    box.dataset.currentUrl ||
    box.querySelector('input[type=file]')?.dataset?.url ||
    "";

  if(!oldUrl){
    box.dataset.currentUrl="";
    button.closest(".pdf-existing")?.remove();
    scheduleAutosave();
    return;
  }

  if(!confirm("Supprimer définitivement ce PDF ?"))return;

  try{
    const marker="/storage/v1/object/public/documents/";
    const pos=oldUrl.indexOf(marker);

    if(pos===-1){
      throw new Error("Impossible de déterminer le fichier PDF à supprimer.");
    }

    const path=decodeURIComponent(
      oldUrl.slice(pos+marker.length)
    );

    const {error}=await sb.storage
      .from("documents")
      .remove([path]);

    if(error)throw new Error(error.message);

    box.dataset.currentUrl="";

    const input=box.querySelector('input[type=file]');
    if(input){
      input.value="";
      delete input.dataset.url;
    }

    button.closest(".pdf-existing")?.remove();

    clearTimeout(autosaveTimer);
    await runAutosave();

  }catch(e){
    alert("Suppression du PDF impossible : "+e.message);
  }
}

  targets=targets.filter(el=>!targets.some(parent=>parent!==el&&parent.contains(el)));

async function init(){
  buildQuickNav();

  /*
    On installe le listener AUTH AVANT de vérifier
    la session existante.
    
    Ainsi, il fonctionne aussi lorsque l'utilisateur
    arrive sur la page sans être encore connecté.
  */
  sb.auth.onAuthStateChange(async(event,session)=>{
    console.log("AUTH EVENT :",event);

    user=session?.user ?? null;

    if(event==="SIGNED_OUT" || !user){
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    /*
      L'utilisateur vient de se connecter.
      On affiche immédiatement l'espace professeur.
    */
    logoutBtn.classList.remove("hidden");
    globalHome?.classList.add("show");

    if(event==="SIGNED_IN"){
      setTimeout(()=>{
        restoreLastPosition().catch(e=>{
          console.error(
            "Restauration après connexion impossible :",
            e
          );
        });
      },0);
    }
  });

  /*
    Vérification de la session déjà existante.
  */
  try{
    const {data,error}=await sb.auth.getSession();

    if(error){
      console.error(
        "Erreur de session :",
        error
      );

      user=null;
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    user=data?.session?.user ?? null;

    if(!user){
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    /*
      Session déjà présente :
      on ouvre directement l'espace professeur.
    */
    logoutBtn.classList.remove("hidden");
    globalHome?.classList.add("show");

    await restoreLastPosition();

  }catch(error){

    console.error(
      "Initialisation impossible :",
      error
    );

    user=null;
    logoutBtn.classList.add("hidden");
    globalHome?.classList.remove("show");
    login();
  }
}
function login(){
  label.textContent="Éditeur professeur";
  content.innerHTML=`<section class="hero login"><span class="eyebrow">Espace sécurisé</span><h2>👨‍🏫 Éditeur professeur</h2><p class="muted">Connecte-toi pour modifier les cahiers de tes classes.</p><div class="editbox"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="ton adresse e-mail"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="primary" style="width:100%;margin-top:5px" onclick="doLogin()">Se connecter</button><div id="loginStatus" class="status" style="margin-top:10px"></div></div></section>`;
}
async function doLogin(){

  const email=
    document.getElementById("email")?.value.trim() || "";

  const password=
    document.getElementById("password")?.value || "";

  const status=
    document.getElementById("loginStatus");

  const button=
    document.querySelector(".login button.primary");

  if(!email || !password){
    if(status){
      status.textContent=
        "Renseigne l'adresse e-mail et le mot de passe.";
    }
    return;
  }

  if(status){
    status.textContent="Connexion…";
  }

  if(button){
    button.disabled=true;
  }

  try{

    const {data,error}=
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      throw new Error(error.message);
    }

    /*
      Sécurité supplémentaire :
      même si l'événement SIGNED_IN tarde à être traité,
      on ouvre l'espace professeur directement.
    */
    user=data?.user ?? null;

    if(!user){
      throw new Error(
        "Connexion réussie mais utilisateur non récupéré."
      );
    }

    if(status){
      status.textContent="Connexion réussie ✓";
    }

    logoutBtn?.classList.remove("hidden");
    globalHome?.classList.add("show");

    await restoreLastPosition();

  }catch(e){

    console.error(
      "Erreur de connexion :",
      e
    );

    if(status){
      status.textContent=
        "Connexion impossible : " +
        e.message;
    }

  }finally{

    if(button){
      button.disabled=false;
    }
  }
}

async function openNiveau(n){
  if(await flushPendingAutosave()===false)return;
  clearTimeout(autosaveTimer);niveau=n;classe=null;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${n}`;updateQuickNav();
  content.innerHTML=`<button onclick="home()">← Accueil</button><section class="hero" style="margin-top:14px"><span class="eyebrow">${n}</span><h2>Choisir une classe</h2><p class="muted">Sélectionne la classe dont tu veux modifier le cahier.</p></section><div id="classes" class="grid"><p class="muted">Chargement…</p></div>`;
  try{
    const arr=await Promise.all(CLASSES[n].map(async c=>{try{const d=await loadClass(c);return{c,count:d.contenu.chapitres.length}}catch(e){return{c,count:0}}}));
    const target=document.getElementById("classes");if(!target)return;target.innerHTML=arr.map(o=>`<article class="card" onclick="openClasse('${o.c}')"><span class="tag">Classe</span><h3>${o.c}</h3><p class="muted">${o.count} chapitre(s) · Modifier →</p></article>`).join("");
  }catch(e){showError(e.message)}
}
async function openClasse(c){
  if(await flushPendingAutosave()===false)return;clearTimeout(autosaveTimer);classe=c;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${c}`;updateQuickNav();await chapters()}
async function chapters(){
  if(await flushPendingAutosave()===false)return;
  if(!classe)return;
  try{
    currentClassData=await loadClass(classe);currentChapterIndex=-1;saveNav();const x=currentClassData.contenu;
    content.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div class="row"><button type="button" onclick="openNiveau('${niveau}')">← ${niveau}</button><button type="button" onclick="home()">🏠 Accueil</button></div></div><section class="hero" style="margin-top:14px"><span class="eyebrow">${classe}</span><h2>📚 Mes chapitres</h2><p class="muted">Ajoute et complète les chapitres directement ici.</p><div class="row"><button class="primary" onclick="newChapter()">＋ Ajouter un chapitre</button><button type="button" onclick="exportCahierPDF()">📚 Imprimer / PDF le cahier</button></div></section><div class="grid">${x.chapitres.map((ch,i)=>`<article class="card" onclick="editChapter(${i})"><span class="tag">Chapitre ${i+1}</span><div class="rich-output"><h3>${ch.titre||"Nouveau chapitre"}</h3></div><p class="muted">${stripHtml(ch.problematique)||"Aucune problématique renseignée"}</p><p class="small">${ch.seances.length} séance(s)</p></article>`).join("")||`<section class="hero"><h3>Aucun chapitre</h3><p class="muted">Clique sur « Ajouter un chapitre » pour commencer.</p></section>`}</div>`;
  }catch(e){showError(e.message)}
}
function stripHtml(v){const d=document.createElement("div");d.innerHTML=safe(v);return d.textContent||d.innerText||""}

function exportCahierText(v){
  const d=document.createElement("div");
  d.innerHTML=safe(v||"");
  return d.textContent||d.innerText||"";
}
function exportCahierHtml(v){
  const d=document.createElement("div");
  d.innerHTML=safe(v||"");
  d.querySelectorAll("script,style").forEach(x=>x.remove());
  return d.innerHTML;
}
function exportPdfLink(labelText,url){
  if(!url)return "";
  return `<div class="cahier-pdf"><strong>📄 ${esc(labelText)}</strong><br><a href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le PDF associé</a></div>`;
}
function exportCahierPDF(){
  try{
    if(!currentClassData?.contenu?.chapitres?.length){
      alert("Aucun chapitre à exporter pour cette classe.");
      return;
    }
    const chapters=normalizeCahier(currentClassData.contenu).chapitres;
    let pages="";
    chapters.forEach((ch,ci)=>{
      let body=`<div class="print-page cahier-page">
        <div class="cahier-kicker">Cahier numérique de SVT · ${esc(classe||"")}</div>
        <h1>Chapitre ${ci+1} — ${esc(exportCahierText(ch.titre)||"Sans titre")}</h1>
        ${ch.germoir||ch.germoirPdf?`<section><h2>🌱 Germoir à idées</h2>${ch.germoir?`<div class="rich-content">${exportCahierHtml(ch.germoir)}</div>`:""}${exportPdfLink("Germoir à idées",ch.germoirPdf)}</section>`:""}
        ${ch.problematique?`<section><h2>🎯 Problématique</h2><div class="problem">${exportCahierHtml(ch.problematique)}</div></section>`:""}`;
      (ch.seances||[]).forEach((seance,si)=>{
        const x=normalizeSession(seance);
        body+=`<section class="session-print"><h2>📖 Séance ${si+1} — ${esc(exportCahierText(x.titre)||"Séance")}</h2>${x.problematique?`<h3>🎯 Problème de la séance</h3><div class="rich-content">${exportCahierHtml(x.problematique)}</div>`:""}`;
        const acts=x.activites||[];
        if(acts.length){body+=`<h3>🧪 Activité</h3>`;acts.forEach((e)=>{body+=`<div class="entry-print">${e.date?`<div class="date-print">${esc(e.date)}</div>`:""}${e.texte?`<div class="rich-content">${exportCahierHtml(e.texte)}</div>`:""}${exportPdfLink("PDF de l'activité",e.pdf)}</div>`})}
        const cors=x.corrections||[];
        if(cors.length){body+=`<h3>📄 Correction</h3>`;cors.forEach(e=>{body+=`<div class="entry-print">${e.date?`<div class="date-print">${esc(e.date)}</div>`:""}${exportPdfLink("PDF de correction",e.pdf)}</div>`})}
        const bils=x.bilans||[];
        if(bils.length){body+=`<h3>🧠 Bilan</h3>`;bils.forEach(e=>{body+=`<div class="entry-print">${e.date?`<div class="date-print">${esc(e.date)}</div>`:""}${e.texte?`<div class="rich-content">${exportCahierHtml(e.texte)}</div>`:""}${exportPdfLink("PDF du bilan",e.pdf)}</div>`})}
        body+=`</section>`;
      });
      if(ch.schema||ch.schemaPdf)body+=`<section><h2>🧠 Schéma-bilan</h2>${ch.schema?`<div class="rich-content">${exportCahierHtml(ch.schema)}</div>`:""}${exportPdfLink("Schéma-bilan",ch.schemaPdf)}</section>`;
      if(ch.memo||ch.memoPdf)body+=`<section><h2>📝 Fiche de mémorisation</h2>${ch.memo?`<div class="rich-content">${exportCahierHtml(ch.memo)}</div>`:""}${exportPdfLink("Fiche de mémorisation",ch.memoPdf)}</section>`;
      if(ch.evaluationPdf)body+=`<section><h2>✅ Évaluation de fin de chapitre</h2>${exportPdfLink("Évaluation de fin de chapitre",ch.evaluationPdf)}</section>`;
      body+=`<div class="cahier-footer">Cahier numérique de SVT · ${esc(classe||"")} · Chapitre ${ci+1}</div></div>`;
      pages+=body;
    });
    const intro=`<div class="print-page cahier-cover"><div class="cahier-kicker">Cahier numérique de SVT</div><h1>${esc(classe||"Classe")}</h1><p class="subtitle">Contenu du cahier exporté pour impression</p><p class="small-note">Les contenus textuels, activités, bilans et informations de séances sont regroupés dans l'ordre du cahier. Les PDF associés sont indiqués comme documents à ouvrir/imprimer séparément.</p></div>`;
    printHtmlInCurrentWindow(`Cahier de SVT — ${classe||"Classe"}`,intro+pages,`\n      .cahier-cover{display:flex;flex-direction:column;justify-content:center;min-height:260mm;text-align:center}\n      .cahier-cover h1{font-size:34px!important;margin:15px 0!important}\n      .cahier-cover .subtitle{font-size:18px;margin:0 0 20px}\n      .cahier-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#34796a;font-weight:800;margin-bottom:8px}\n      .cahier-page h1{font-size:25px!important;border-bottom:2px solid #333;padding-bottom:8px}\n      .cahier-page section{margin:12px 0 18px}\n      .cahier-page h2{font-size:17px!important;margin:13px 0 7px!important}\n      .cahier-page h3{font-size:14px!important;margin:10px 0 5px!important}\n      .rich-content{line-height:1.55}\n      .problem{border-left:4px solid #34796a;background:#f4faf7;padding:10px 12px}\n      .session-print{border:1px solid #d8e2de;border-radius:8px;padding:10px;margin:12px 0}\n      .entry-print{border-top:1px solid #e5ebe8;padding:7px 0}\n      .date-print{font-size:10px;color:#666;margin-bottom:4px}\n      .cahier-pdf{margin-top:7px;padding:7px 9px;border:1px dashed #9fbab0;background:#f7fbf9;font-size:10px}\n      .cahier-pdf a{color:#286456;text-decoration:underline}\n      .cahier-footer{margin-top:18px;padding-top:7px;border-top:1px solid #ccc;font-size:9px;color:#666}\n    `);
  }catch(e){alert("Export du cahier impossible : "+e.message);}
}
async function newChapter(){
  try{if(!currentClassData)currentClassData=await loadClass(classe);currentClassData.contenu.chapitres.push(normalizeChapter({titre:"Nouveau chapitre",problematique:"",germoir:"",seances:[]}));currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);const i=currentClassData.contenu.chapitres.length-1;currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible d'ajouter le chapitre : "+e.message)}
}
function editChapter(i){
  try{
    if(!currentClassData||!Array.isArray(currentClassData.contenu?.chapitres)){showError("Le cahier n'est pas chargé.");return}
    if(i<0||i>=currentClassData.contenu.chapitres.length){showError("Ce chapitre est introuvable.");return}
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);currentClassData.contenu.chapitres[i]=ch;currentChapterIndex=i;saveNav();
    content.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div class="row"><button type="button" onclick="chapters()">← Tous les chapitres</button><button type="button" onclick="openNiveau('${niveau}')">← ${niveau}</button><button type="button" onclick="home()">🏠 Accueil</button></div></div><section class="hero teacher" style="margin-top:14px"><span class="eyebrow">Chapitre ${i+1}</span><h2>✏️ Modifier le chapitre</h2>
      <div class="editbox"><label>🌱 Germoir à idées</label>${richToolbar("chGermoir")}<div id="chGermoir" class="rich-editor" contenteditable="true" data-placeholder="Écris ici les idées à faire émerger…">${ch.germoir||""}</div>${pdfField("le Germoir à idées","germoirPdf",i,ch.germoirPdf)}
      <label>Titre du chapitre</label>${richToolbar("chTitre")}<div id="chTitre" class="rich-editor" contenteditable="true" data-placeholder="Titre du chapitre">${ch.titre||""}</div>
      <label>Problématique du chapitre</label>${richToolbar("chProb")}<div id="chProb" class="rich-editor" contenteditable="true" data-placeholder="Problématique du chapitre…">${ch.problematique||""}</div></div>
      <div class="section-heading"><h2>📖 Séances</h2><span class="status">Une séance peut s'étaler sur plusieurs jours.</span></div>
      <div id="sessions">${ch.seances.map((s,n)=>sessionEditor(s,n)).join("")}</div><button type="button" class="entry-add" onclick="addSession(${i})">＋ Ajouter une séance</button>
      <div class="editbox"><label>🧠 Schéma-bilan du chapitre</label>${pdfField("le schéma-bilan","schemaPdf",i,ch.schemaPdf)}<label>📝 Fiche de mémorisation</label>${pdfField("la fiche de mémorisation","memoPdf",i,ch.memoPdf)}<label>✅ Évaluation de fin de chapitre</label>${pdfField("l'évaluation de fin de chapitre","evaluationPdf",i,ch.evaluationPdf)}</div>
      <div class="row"><button class="primary" onclick="saveChapter(${i})">💾 Enregistrer</button><button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer le chapitre</button><span id="saveStatus" class="status save-indicator"></span></div></section>`;
  }catch(e){showError(e.message)}
}
async function addSession(i){
  try{
    if(!currentClassData)currentClassData=await loadClass(classe);
    const saved=await saveChapter(i);if(saved!==true)return;
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.push(normalizeSession({titre:`Séance ${ch.seances.length+1}`,problematique:"",activites:[],corrections:[],bilans:[]}));currentClassData.contenu.chapitres[i]=ch;
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i);
  }catch(e){alert("Impossible d'ajouter la séance : "+e.message)}
}
async function removeSession(n){
  const i=currentChapterIndex;if(i<0||!currentClassData)return;if(!confirm("Supprimer définitivement cette séance ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.splice(n,1);currentClassData.contenu.chapitres[i]=ch;currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible de supprimer la séance : "+e.message)}
}
async function deleteChapter(i){
  if(!confirm("Supprimer définitivement ce chapitre ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;currentClassData.contenu.chapitres.splice(i,1);currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=-1;saveNav();await chapters()}
  catch(e){alert("Suppression impossible : "+e.message)}
}
async function uploadPdf(input,kind,id){
  const file=input.files?.[0];if(!file)return;if(file.type!=="application/pdf"){alert("Choisis un fichier PDF.");input.value="";return}
  const box=input.closest(".pdf-box"),status=box?.querySelector(".status");if(status)status.textContent="Envoi du PDF…";
  const path=`${classe}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  try{
    const{error}=await sb.storage.from("documents").upload(path,file,{contentType:"application/pdf",upsert:false});if(error)throw new Error(error.message);
    const{data}=sb.storage.from("documents").getPublicUrl(path);input.dataset.url=data.publicUrl;if(box)box.dataset.currentUrl=data.publicUrl;if(status)status.textContent="PDF ajouté ✓";
    if(currentChapterIndex>=0){clearTimeout(autosaveTimer);await runAutosave()}
  }catch(e){if(status)status.textContent="Erreur : "+e.message;alert("Envoi du PDF impossible : "+e.message)}
}
async function restoreLastPosition(){
  const n=loadNav();if(!n?.niveau){home();return}niveau=n.niveau;if(!CLASSES[niveau]){home();return}
  if(n.classe&&CLASSES[niveau].includes(n.classe)){classe=n.classe;label.textContent=`Éditeur · ${classe}`;try{currentClassData=await loadClass(classe);const ci=Number.isInteger(n.currentChapterIndex)?n.currentChapterIndex:-1;if(n.view==="chapter"&&ci>=0&&ci<currentClassData.contenu.chapitres.length){currentChapterIndex=ci;editChapter(ci);return}await chapters();return}catch(e){showError(e.message);return}}
  await openNiveau(niveau);
}
init();
</script>
</body>
</html>
