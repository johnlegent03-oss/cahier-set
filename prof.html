<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur professeur — Cahier numérique de SVT</title>
<style>
:root{--bg:#eef6f2;--card:#fff;--text:#213331;--muted:#6f807d;--a:#34796a;--a-dark:#286456;--a2:#dff0e9;--b:#d5e4de;--danger:#fff0ef;--shadow:0 12px 35px rgba(35,65,59,.08);--shadow-hover:0 16px 40px rgba(35,65,59,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 5% 0%,#d8eee5 0,transparent 28%),radial-gradient(circle at 95% 10%,#edf4d9 0,transparent 24%),var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(213,228,222,.9);box-shadow:0 4px 18px rgba(30,65,55,.05)}
.head{max-width:1120px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#dff3eb,#cce8dd);display:grid;place-items:center;font-size:23px;box-shadow:inset 0 0 0 1px #c6e1d7}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1120px;margin:auto;padding:28px 20px 55px}
button,.btn{font:inherit;border:1px solid var(--b);background:#fff;color:var(--text);border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:700;text-decoration:none;transition:.18s ease}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,70,60,.08)}
button.primary{background:linear-gradient(135deg,var(--a),#428978);color:#fff;border-color:var(--a);box-shadow:0 7px 18px rgba(52,121,106,.18)}
button.danger{background:var(--danger);border-color:#efc0ba;color:#9d4b45}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.hero,.card,.editbox{background:rgba(255,255,255,.93);border:1px solid var(--b);border-radius:20px;padding:21px;box-shadow:var(--shadow)}
.hero{border-radius:24px;margin-bottom:19px}.hero h2{font-size:29px;line-height:1.15;margin:7px 0 10px;letter-spacing:-.025em}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--a);font-weight:850}
.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card{cursor:pointer;position:relative;overflow:hidden;transition:.2s ease}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#66a995,#34796a);opacity:.8}
.card:hover{transform:translateY(-3px);border-color:#a9cbc0;box-shadow:var(--shadow-hover)}.card h3{margin:11px 0 7px;font-size:20px}
.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--a2);color:var(--a);font-size:11px;font-weight:850}
.editbox{margin:14px 0;border-style:dashed;background:rgba(255,255,255,.72)}
.teacher{background:radial-gradient(circle at 100% 0%,#fff0c5aa,transparent 30%),rgba(255,250,235,.96);border-color:#ead6a8}
.editbox label{display:block;font-size:12px;font-weight:850;margin:10px 0 6px;color:#425552}
input,select{width:100%;border:1px solid var(--b);border-radius:10px;padding:10px 11px;font:inherit;background:#fff;color:var(--text);outline:none;transition:.15s ease}
input:focus,select:focus{border-color:#79ad9d;box-shadow:0 0 0 3px #dff0e988}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}
.error{background:#fff0ef;border:1px solid #efc0ba}.login{max-width:460px;margin:55px auto}.status{font-size:12px;color:var(--muted)}
.save-indicator{display:inline-flex;align-items:center;gap:6px;min-height:20px}.save-indicator.saving{color:#a06b18}.save-indicator.saved{color:var(--a)}.save-indicator.error{color:#9d4b45;background:none;border:0}
.session-box{border:1px solid var(--b);border-radius:17px;padding:17px;margin:14px 0;background:linear-gradient(180deg,#fff,#fbfdfc);box-shadow:0 5px 18px rgba(35,65,59,.05);position:relative}
.session-box:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:5px;background:#72aa9a}
.session-box strong{font-size:15px}
.rich-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px;background:#f6faf8;border:1px solid var(--b);border-radius:10px 10px 0 0}
.rich-toolbar button{padding:6px 9px;min-width:34px;border-radius:8px;font-weight:800}.rich-toolbar select{width:auto;min-width:95px;padding:6px 8px;border-radius:8px}
.rich-editor{min-height:105px;border:1px solid var(--b);border-top:0;border-radius:0 0 10px 10px;padding:11px;background:#fff;line-height:1.55;outline:none;overflow:auto}
.rich-editor:focus{border-color:#79ad9d;box-shadow:0 0 0 3px #dff0e988}.rich-editor:empty:before{content:attr(data-placeholder);color:#9aa3af}
.session-problem{min-height:65px}.entry{border:1px solid #dce8e3;border-radius:13px;padding:13px;margin:12px 0;background:#fbfdfc}
.entry-head{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.entry-date{width:170px}.entry-type{font-size:12px;font-weight:850;color:var(--a);text-transform:uppercase;letter-spacing:.06em}
.entry-actions{display:flex;gap:6px;align-items:center}.entry-actions button{padding:6px 9px}.entry-add{border-style:dashed;color:var(--a);background:#f7fbf9;width:100%;margin-top:5px}
.entry-label{font-size:12px;font-weight:850;margin:10px 0 6px;color:#425552}.entry-text{min-height:110px}
.pdf-box{background:#f4faf7;border:1px solid #cfe4dc;border-radius:12px;padding:11px;margin:9px 0}.pdf-box strong{font-size:12px;color:#42645c}.pdf-box input{margin-top:7px}.pdf-ok{display:inline-flex;margin-top:7px}
.pdf-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.pdf-existing{padding-bottom:8px}.legacy-note{font-size:12px;color:#7a6a49;background:#fff8e8;border:1px solid #ead6a8;border-radius:10px;padding:9px;margin-top:8px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
@media(max-width:650px){main{padding:18px 12px 40px}.head{padding:10px 12px}.brand h1{font-size:16px}.brand p{font-size:11px}.logo{width:41px;height:41px}.hero{padding:17px;border-radius:18px}.hero h2{font-size:24px}.grid{grid-template-columns:1fr}.session-box{padding:14px}.entry-date{width:100%}}

/* ===== Module évaluations / corrections ===== */
.eval-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.eval-card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 6px 18px rgba(35,65,59,.05)}
.eval-card h3{margin:0 0 6px}
.eval-grid{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.eval-grid input,.eval-grid select{width:100%}
.criteria-box{background:#f7fbf9;border:1px solid #dceae4;border-radius:14px;padding:13px;margin:12px 0}
.criterion-editor{cursor:default;background:#fbfdfc}
.criterion-editor:hover{transform:none}
.indicator-row{cursor:default;background:#fff;border:1px solid #e1ebe7}
.indicator-row:hover{transform:none}
.small-note{font-size:12px;color:var(--muted)}
.eval-grid{display:grid;grid-template-columns:minmax(0,1fr) 110px 42px;gap:8px;align-items:center}
.check-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #e6efeb}
.check-row label{margin:0;display:flex;gap:9px;align-items:flex-start;font-weight:600;line-height:1.4}
.check-row input[type=checkbox]{width:19px;height:19px;margin-top:1px;accent-color:#34796a}
.criteria-box{background:#f7fbf9;border:1px solid #dceae4;border-radius:14px;padding:13px;margin:12px 0;overflow:auto}
.mastery-table{width:100%;border-collapse:collapse;margin-top:9px;min-width:560px}
.mastery-table th,.mastery-table td{padding:9px;border-bottom:1px solid #dce8e3;text-align:left}
.mastery-table th{font-size:12px;color:#526762}
@media(max-width:650px){.eval-grid{grid-template-columns:1fr 85px 42px}}
.check-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #e6efeb}
.check-row:last-child{border-bottom:0}
.check-row label{display:flex;gap:9px;align-items:center;font-weight:650}
.check-row input[type=checkbox]{width:18px;height:18px}
.score-pill{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;background:var(--a2);color:var(--a);font-weight:850}
.eval-nav{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.mastery-table{width:100%;border-collapse:collapse;margin-top:10px}
.mastery-table th,.mastery-table td{padding:9px;border-bottom:1px solid #e4ece8;text-align:left}
.mastery-table th{font-size:12px;color:var(--muted)}
.small-note{font-size:12px;color:var(--muted)}
@media(max-width:650px){.eval-grid{grid-template-columns:1fr}.mastery-table{font-size:13px}}

.mastery-result{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--b);border-radius:12px;padding:9px 12px;background:#fff;font-weight:850}.mastery-result.tbm{background:#e7f6ee;border-color:#a9d9bf}.mastery-result.ms{background:#eef7ea;border-color:#c4dfb5}.mastery-result.mf{background:#fff6df;border-color:#ead39a}.mastery-result.mi{background:#fff0ef;border-color:#efc0ba}

.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bank-list{max-height:420px;overflow:auto}.bank-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #dce8e3;border-radius:11px;background:#fff;margin:7px 0}.bank-item-main{min-width:0}.bank-item-main strong{display:block}.bank-item-main span{font-size:12px;color:var(--muted)}.competency-picker{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:#f7fbf9;border:1px dashed #cfe2da;border-radius:12px;padding:11px;margin-bottom:12px}.student-picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}.student-choice{text-align:left;padding:14px;background:#fff;border:1px solid var(--b);border-radius:13px}.student-choice:hover{border-color:#9fc6b8;background:#f8fcfa}.bank-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.bank-grid{grid-template-columns:1fr}.competency-picker{grid-template-columns:1fr}}
.tracking-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.tracking-filters>div{display:flex;flex-direction:column;gap:6px}.tracking-filters select{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;font:inherit}.tracking-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}.tracking-stat{border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center;background:#fff}.tracking-stat strong{display:block;font-size:22px}.tracking-stat span{font-size:12px;color:var(--muted)}.tracking-competency{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #e4ece8}.tracking-competency:last-child{border-bottom:0}@media(max-width:700px){.tracking-filters{grid-template-columns:1fr}.tracking-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.tracking-summary .tracking-stat:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="head">
  <div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p id="label">Éditeur professeur</p></div></div>
  <button id="logoutBtn" class="hidden" onclick="logout()">Se déconnecter</button>
</div></header>
<main id="content"></main>
<footer>Éditeur professeur · les modifications sont enregistrées dans Supabase.</footer>

<script src="config.js"></script>
<script>
function getMasteryFromValidatedCriteria(validatedCount){
  const n=Number(validatedCount)||0;
  if(n>=4)return {code:"TBM",label:"Très bonne maîtrise",cls:"tbm"};
  if(n===3)return {code:"MS",label:"Maîtrise satisfaisante",cls:"ms"};
  if(n===2)return {code:"MF",label:"Maîtrise fragile",cls:"mf"};
  return {code:"MI",label:"Maîtrise insuffisante",cls:"mi"};
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const CLASSES={"6e":["6e1","6e2","6e3","6e4","6e5"],"5e":["5e1","5e3","5e5"],"3e":["3e2","3e3"]};
const content=document.getElementById("content"),label=document.getElementById("label"),logoutBtn=document.getElementById("logoutBtn");
let niveau=null,classe=null,user=null,currentClassData=null,currentChapterIndex=-1;
let autosaveTimer=null,autosaveRunning=false,autosaveAgain=false;
let currentCorrectionEvaluation=null;
const richRanges={};
const NAV_KEY="cahierSVT.prof.navigation.v2";
const EVAL_NAV_KEY="cahierSVT.prof.evaluations.navigation.v1";

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const safe=v=>v==null?"":String(v);
function empty(){return{chapitres:[]}}

function normalizeEntry(e){
  const x=e&&typeof e==="object"?e:{};
  return{date:safe(x.date||x.jour||x.datee),texte:safe(x.texte||x.text||x.contenu||x.html),pdf:safe(x.pdf||x.pdfUrl||x.document)};
}
function legacyEntries(text,pdf){
  const t=safe(text),p=safe(pdf);
  return t||p?[{date:"",texte:t,pdf:p}]:[];
}
function normalizeSession(s){
  const x=s&&typeof s==="object"?s:{};
  const activites=Array.isArray(x.activites)?x.activites.map(normalizeEntry).filter(e=>e.date||e.texte||e.pdf):legacyEntries(x.activite||x.activity,x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document);
  const corrections=Array.isArray(x.corrections)?x.corrections.map(normalizeEntry).filter(e=>e.date||e.pdf):legacyEntries("",x.pdfCorrection||x.pdf_correction||x.correctionPdf);
  const bilans=Array.isArray(x.bilans)?x.bilans.map(normalizeEntry).filter(e=>e.date||e.texte||e.pdf):legacyEntries(x.bilan,"");
  return{titre:safe(x.titre||x.title||"Séance"),problematique:safe(x.problematique||x.probleme||x.problem),activites,corrections,bilans,activite:safe(x.activite||x.activity),correction:safe(x.correction),bilan:safe(x.bilan),pdfActivite:safe(x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document),pdfCorrection:safe(x.pdfCorrection||x.pdf_correction||x.correctionPdf)};
}
function normalizeChapter(ch){
  const x=ch&&typeof ch==="object"?ch:{},raw=Array.isArray(x.seances)?x.seances:(Array.isArray(x.sessions)?x.sessions:[]);
  return{titre:safe(x.titre||x.title||"Nouveau chapitre"),germoir:safe(x.germoir||x.germoirIdees),germoirPdf:safe(x.germoirPdf||x.germoir_pdf),problematique:safe(x.problematique||x.probleme||x.problem),seances:raw.filter(Boolean).map(normalizeSession),schema:safe(x.schema||x.schemaBilan||x.schema_bilan),schemaPdf:safe(x.schemaPdf||x.schema_pdf),memo:safe(x.memo||x.memorisation||x.ficheMemo),memoPdf:safe(x.memoPdf||x.memo_pdf),evaluationPdf:safe(x.evaluationPdf||x.evaluation_pdf||x.evalPdf||x.pdfEvaluation)};
}
function normalizeCahier(raw){
  let x=raw;if(!x||typeof x!=="object")x={};if(Array.isArray(x))x={chapitres:x};if(!Array.isArray(x.chapitres))x.chapitres=[];x.chapitres=x.chapitres.map(normalizeChapter);return x;
}

async function loadClass(c){
  const{data,error}=await sb.from("Cahier").select("id,classe,contenu").eq("classe",c).maybeSingle();
  if(error)throw new Error(error.message);return{id:data?.id||null,contenu:normalizeCahier(data?.contenu)};
}
async function saveClass(c,contenu,id){
  let r;
  if(id){r=await sb.from("Cahier").update({contenu}).eq("id",id);if(r.error)throw new Error(r.error.message);return id;}
  r=await sb.from("Cahier").insert({classe:c,contenu}).select("id").maybeSingle();if(r.error)throw new Error(r.error.message);return r.data?.id||null;
}

function saveNav(){
  try{localStorage.setItem(NAV_KEY,JSON.stringify({niveau,classe,currentChapterIndex,view:currentChapterIndex>=0?"chapter":(classe?"chapters":(niveau?"classes":"home"))}))}catch(e){}
}
function loadNav(){try{return JSON.parse(localStorage.getItem(NAV_KEY)||"null")}catch(e){return null}}
function clearNav(){try{localStorage.removeItem(NAV_KEY)}catch(e){}}

function showError(msg){content.innerHTML='<section class="hero error"><h2>⚠️ Une erreur est survenue</h2><p>'+esc(msg)+'</p><button onclick="restoreLastPosition()">Retour</button></section>'}
function setSaveStatus(state,msg){
  const el=document.getElementById("saveStatus");if(!el)return;
  el.className="status save-indicator "+(state||"");el.textContent=msg||"";
}

function richToolbar(id){
  return`<div class="rich-toolbar">
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','bold')" title="Gras"><b>G</b></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','italic')" title="Italique"><i>I</i></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','underline')" title="Souligné"><u>S</u></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','foreColor','#c0392b')" title="Rouge">🔴</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','foreColor','#2980b9')" title="Bleu">🔵</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','foreColor','#27ae60')" title="Vert">🟢</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="richCmd('${id}','foreColor','#000000')" title="Noir">⚫</button>
    <select onchange="richCmd('${id}','fontName',this.value);this.selectedIndex=0" title="Police"><option value="">Police</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Trebuchet MS">Trebuchet</option><option value="Courier New">Courier New</option></select>
    <select onchange="richCmd('${id}','fontSize',this.value);this.selectedIndex=0" title="Taille"><option value="">Taille</option><option value="2">Petit</option><option value="3">Normal</option><option value="5">Grand</option><option value="7">Très grand</option></select>
  </div>`;
}
function rememberSelection(id){
  const el=document.getElementById(id);if(!el)return;
  const sel=window.getSelection();if(sel&&sel.rangeCount&&el.contains(sel.anchorNode))richRanges[id]=sel.getRangeAt(0).cloneRange();
}
function restoreSelection(id){
  const r=richRanges[id];if(!r)return false;const sel=window.getSelection();
  try{sel.removeAllRanges();sel.addRange(r);return true}catch(e){return false}
}
function richCmd(id,cmd,value=null){
  const el=document.getElementById(id);if(!el)return;restoreSelection(id);el.focus();document.execCommand(cmd,false,value);rememberSelection(id);scheduleAutosave();
}
document.addEventListener("selectionchange",()=>{const a=document.activeElement;if(a?.classList?.contains("rich-editor"))rememberSelection(a.id)});

function existingPdf(url,labelText){
  if(!url)return"";
  return`<div class="pdf-existing"><strong>📄 ${esc(labelText)} déjà enregistré</strong><div class="pdf-actions"><a class="btn pdf-ok" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le PDF</a><button type="button" class="danger" onclick="clearPdf(this)">Retirer le PDF</button></div></div>`;
}
function pdfField(labelText,kind,id,url){
  return`<div class="pdf-box" data-current-url="${esc(url)}">${existingPdf(url,labelText)}<label>${url?"Remplacer le PDF de "+labelText.toLowerCase():"PDF de "+labelText+" (facultatif)"}</label><input class="${esc(kind)}" type="file" accept="application/pdf" onchange="uploadPdf(this,'${esc(kind)}','${esc(id)}')"><span class="status"></span></div>`;
}
function clearPdf(button){
  const box=button.closest(".pdf-box");if(!box)return;
  box.dataset.currentUrl="";
  const input=box.querySelector('input[type=file]');if(input){input.value="";delete input.dataset.url;}
  button.closest(".pdf-existing")?.remove();
  scheduleAutosave();
}

function entryEditor(type,entry,sessionIndex,entryIndex){
  const x=normalizeEntry(entry),id=`${type}-${sessionIndex}-${entryIndex}-${Math.random().toString(36).slice(2,7)}`,labelText={activite:"🧪 Activité",correction:"📄 Correction",bilan:"🧠 Bilan"}[type],isCorrection=type==="correction";
  return`<div class="entry" data-entry-type="${type}" data-pdf="${esc(x.pdf)}">
    <div class="entry-head"><span class="entry-type">${labelText}</span><div class="entry-actions"><label style="margin:0;font-size:12px;font-weight:700">📅 <input class="entry-date" type="date" value="${esc(x.date)}" aria-label="Date"></label><button type="button" class="danger" onclick="removeEntry(this)">Supprimer</button></div></div>
    ${isCorrection
      ?`${x.pdf?existingPdf(x.pdf,"PDF de correction"):""}<div class="pdf-box" data-current-url="${esc(x.pdf)}"><label>${x.pdf?"Remplacer le PDF de correction":"PDF de correction (facultatif)"}</label><input class="entry-pdf" type="file" accept="application/pdf" onchange="uploadPdf(this,'entry','${id}')"><span class="status"></span></div>`

/* =========================================================
   MODULE ÉVALUATIONS / CORRECTIONS — V1
   Les données de correction utilisent des tables Supabase
   séparées du cahier. L'interface reste uniquement dans
   prof.html : aucune donnée n'est exposée à l'interface élève.
   ========================================================= */

let evaluationsCache=[];

function isHistoricalEvaluation(e){
  return !!(e && Array.isArray(e.exercices) && e.exercices.some(x=>x&&x.historique===true));
}
function historicalMeta(e){
  const x=(Array.isArray(e?.exercices)?e.exercices:[]).find(v=>v&&v.historique===true)||{};
  return {
    date:x.date||e?.created_at||null,
    competence:safe(x.competence||"Compétence non renseignée")
  };
}

function evalNormalize(e){
  const x=e&&typeof e==="object"?e:{};
  return {
    id:x.id||null,
    titre:safe(x.titre||"Nouvelle évaluation"),
    classe:safe(x.classe||""),
    total:Number(x.total||0),
    competences:Array.isArray(x.competences)?x.competences:[],
    criteres:Array.isArray(x.criteres)?x.criteres:[],
    exercices:Array.isArray(x.exercices)?x.exercices:[],
    created_at:x.created_at||null
  };
}

function criterionDefaults(){
  return [
    {id:"c1",nom:"Choix adaptés",indicateurs:[]},
    {id:"c2",nom:"Qualité du travail",indicateurs:[]},
    {id:"c3",nom:"Travail complet",indicateurs:[]},
    {id:"c4",nom:"Respect des consignes",indicateurs:[]}
  ];
}

function normalizeCriteria(ev){
  let crits=Array.isArray(ev.criteres)?ev.criteres:[];
  if(!crits.length) crits=criterionDefaults();
  return crits.map((c,i)=>({
    id:safe(c.id)||`c${i+1}`,
    nom:safe(c.nom)||`Critère ${i+1}`,
    competenceId:safe(c.competenceId||"comp1"),
    competenceNom:safe(c.competenceNom||""),
    indicateurs:Array.isArray(c.indicateurs)?c.indicateurs:[]
  }));
}

function criteriaFromLegacy(ev){
  // Migration douce de la V1 : les anciens éléments/exercices sont convertis
  // en indicateurs rattachés à leur critère quand leur identifiant est connu.
  const crits=normalizeCriteria(ev);
  if(crits.some(c=>c.indicateurs.length)) return crits;
  const oldMap={choix:0,qualite:1,completude:2,consignes:3};
  const legacy=Array.isArray(ev.exercices)?ev.exercices:[];
  legacy.forEach(ex=>{
    (Array.isArray(ex.items)?ex.items:[]).forEach(it=>{
      const ids=Array.isArray(it.criteres)?it.criteres:[];
      const target=ids.map(id=>oldMap[id]).filter(i=>Number.isInteger(i));
      const indices=target.length?target:[0];
      indices.forEach((ci)=>{
        if(crits[ci]) crits[ci].indicateurs.push({nom:safe(it.nom),points:Number(it.points||0)});
      });
    });
  });
  return crits;
}

function flattenIndicators(ev){
  const crits=criteriaFromLegacy(ev),items=[];
  crits.forEach((c,ci)=>{
    (c.indicateurs||[]).forEach((it,ii)=>items.push({criterionId:c.id,ci,ii,nom:safe(it.nom),points:Number(it.points||0)}));
  });
  return {crits,items};
}

async function loadEvaluations(){
  const {data,error}=await sb.from("Evaluations")
    .select("id,titre,classe,total,criteres,exercices,created_at")
    .order("created_at",{ascending:false});
  if(error)throw new Error(error.message);
  return (data||[]).map(evalNormalize);
}

async function saveEvaluationObject(ev){
  const flatCriteres=(ev.competences&&ev.competences.length)
    ? ev.competences.flatMap(comp=>(comp.criteres||[]).map(cr=>({...cr,competenceId:comp.id,competenceNom:comp.nom})))
    : (ev.criteres||[]);
  const payload={
    titre:ev.titre,classe:ev.classe,total:Number(ev.total||0),
    criteres:flatCriteres,exercices:Array.isArray(ev.exercices)?ev.exercices:[]
  };
  if(ev.id){
    const {data,error}=await sb.from("Evaluations").update(payload).eq("id",ev.id).select().maybeSingle();
    if(error)throw new Error(error.message);
    return evalNormalize(data);
  }
  const {data,error}=await sb.from("Evaluations").insert(payload).select().maybeSingle();
  if(error)throw new Error(error.message);
  return evalNormalize(data);
}

function trackingPeriodLabel(period){
  return period==="t1"?"Trimestre 1":period==="t2"?"Trimestre 2":period==="t3"?"Trimestre 3":"Année";
}
function trackingRecordDate(c){
  return isHistoricalEvaluation(c?.evaluation)?historicalMeta(c.evaluation).date:(c?.created_at||null);
}
function normalizeTrackingDate(dateValue){
  if(!dateValue)return null;
  const s=String(dateValue).trim();
  const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(m){
    const dd=String(m[1]).padStart(2,"0"),mm=String(m[2]).padStart(2,"0"),yyyy=m[3];
    return `${yyyy}-${mm}-${dd}T12:00:00`;
  }
  return s;
}
function trackingPeriodMatch(dateValue,period){
  if(period==="year")return true;
  if(!dateValue)return false;
  const d=new Date(normalizeTrackingDate(dateValue));
  if(Number.isNaN(d.getTime()))return false;
  const m=d.getMonth()+1;
  if(period==="t1")return m>=9&&m<=12;
  if(period==="t2")return m>=1&&m<=3;
  if(period==="t3")return m>=4&&m<=7;
  return true;
}
function trackingDate(dateValue){
  if(!dateValue)return "Date non renseignée";
  const d=new Date(normalizeTrackingDate(dateValue));
  if(Number.isNaN(d.getTime()))return "Date non renseignée";
  return d.toLocaleDateString("fr-FR");
}
function trackingRows(){
  return studentTrackingCache.filter(c=>{
    const cls=c.evaluation?.classe||"";
    const date=trackingRecordDate(c);
    return (!studentTrackingClass||cls===studentTrackingClass)
      &&(!studentTrackingStudent||c.eleve===studentTrackingStudent)
      &&trackingPeriodMatch(date,studentTrackingPeriod);
  }).sort((a,b)=>{
    const ad=trackingRecordDate(a),bd=trackingRecordDate(b);
    const da=ad?new Date(ad).getTime():0,db=bd?new Date(bd).getTime():0;
    return da-db;
  });
}
function trackingStudents(){
  const names=[...new Set(studentTrackingCache.filter(c=>!studentTrackingClass||c.evaluation?.classe===studentTrackingClass).map(c=>c.eleve))];
  return names.sort((a,b)=>a.localeCompare(b,"fr"));
}
function trackingCompetencyRows(rows){
  const out=[];
  rows.forEach(c=>{
    const ev=c.evaluation, stats=c.resultat?.criteriaStats||{};
    if(isHistoricalEvaluation(ev)){
      const meta=historicalMeta(ev);
      const masteryCode=c.resultat?.masteryCode||"";
      const mastery=masteryCode?getMasteryByCode(masteryCode):null;
      if(mastery){
        out.push({date:meta.date,evaluation:ev.titre,competence:meta.competence||"Compétence non renseignée",validated:null,total:null,mastery});
      }
      return;
    }
    const crits=criteriaFromLegacy(ev), groups={};
    crits.forEach(cr=>{
      const gid=cr.competenceId||"comp1";
      if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",total:0,validated:0};
      groups[gid].total++;
      if(stats[cr.id]?.validated)groups[gid].validated++;
    });
    Object.values(groups).forEach(g=>{
      const mastery=getMasteryFromValidatedCriteria(g.validated);
      out.push({date:c.created_at,evaluation:ev.titre,competence:g.nom,validated:g.validated,total:g.total,mastery});
    });
  });
  return out;
}
function trackingSummary(rows){
  const total=rows.length;
  const competencies=trackingCompetencyRows(rows);
  const counts={TBM:0,MS:0,MF:0,MI:0};
  competencies.forEach(x=>counts[x.mastery.code]=(counts[x.mastery.code]||0)+1);
  const latestByComp={};
  competencies.forEach(x=>{latestByComp[x.competence]=x});
  return {total,competencies,counts,latestByComp};
}

  content.innerHTML=`<button onclick="openEvaluations()">← Mes évaluations</button>
    <section class="hero" style="margin-top:14px">
      <span class="eyebrow">Suivi des acquis</span><h2>📊 Suivi des élèves</h2>
      <p class="muted">Chaque correction enregistrée alimente automatiquement l'historique de l'élève. Les niveaux de maîtrise reprennent exactement les règles de tes évaluations.</p>
      <div class="tracking-filters">
        <div><label>Classe</label><select id="trackingClass" onchange="studentTrackingClass=this.value;studentTrackingStudent='';renderStudentTracking()"><option value="">Toutes les classes</option>${classes.map(c=>`<option value="${esc(c)}" ${c===studentTrackingClass?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
        <div><label>Élève</label><select id="trackingStudent" onchange="studentTrackingStudent=this.value;renderStudentTracking()"><option value="">${students.length?"Sélectionner un élève":"Aucun élève corrigé"}</option>${students.map(n=>`<option value="${esc(n)}" ${n===studentTrackingStudent?"selected":""}>${esc(n)}</option>`).join("")}</select></div>

      </div>
    </section>
    ${studentTrackingStudent?`<section class="hero" style="margin-top:14px"><div class="entry-head"><div><span class="eyebrow">${esc(studentTrackingClass||"Toutes les classes")}</span><h2>👤 ${esc(studentTrackingStudent)}</h2><p class="muted">${trackingPeriodLabel(studentTrackingPeriod)} · ${summary.total} évaluation(s) enregistrée(s)</p></div></div>
      <div class="tracking-summary"><div class="tracking-stat"><strong>${summary.total}</strong><span>évaluation(s)</span></div><div class="tracking-stat"><strong>${summary.counts.TBM}</strong><span>TBM</span></div><div class="tracking-stat"><strong>${summary.counts.MS}</strong><span>MS</span></div><div class="tracking-stat"><strong>${summary.counts.MF}</strong><span>MF</span></div><div class="tracking-stat"><strong>${summary.counts.MI}</strong><span>MI</span></div></div>

    </section>`:`<section class="hero" style="margin-top:14px"><h3>👤 Sélectionne un élève</h3><p class="muted">Les élèves apparaissent automatiquement dès qu'une correction est enregistrée.</p></section>`}`;
}

function classTrackingRows(){
  const rows=studentTrackingCache.filter(c=>{
    const cls=c.evaluation?.classe||"";
    const date=trackingRecordDate(c);
    return (!classTrackingClass||cls===classTrackingClass)
      &&trackingPeriodMatch(date,classTrackingPeriod);
  });
  const byStudent={};
  rows.forEach(c=>{
    const name=c.eleve||"Élève";
    if(!byStudent[name])byStudent[name]={name,evaluations:[],competencies:[]};
    byStudent[name].evaluations.push(c);
    const stats=c.resultat?.criteriaStats||{};
    if(isHistoricalEvaluation(c.evaluation)){
      const meta=historicalMeta(c.evaluation);
      const mastery=getMasteryByCode(c.resultat?.masteryCode||"");
      if(mastery){
        byStudent[name].competencies.push({competence:meta.competence||"Compétence non renseignée",validated:null,total:null,mastery});
      }
    }else{
      const crits=criteriaFromLegacy(c.evaluation),groups={};
      crits.forEach(cr=>{
        const gid=cr.competenceId||"comp1";
        if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",total:0,validated:0};
        groups[gid].total++;
        if(stats[cr.id]?.validated)groups[gid].validated++;
      });
      Object.values(groups).forEach(g=>{
        byStudent[name].competencies.push({
          competence:g.nom,
          validated:g.validated,
          total:g.total,
          mastery:getMasteryFromValidatedCriteria(g.validated)
        });
      });
    }
  });
  return Object.values(byStudent).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
}

function renderClassTracking(){
  const classes=[...new Set(studentTrackingCache.map(c=>c.evaluation?.classe).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"fr"));
  if(classTrackingClass && !classes.includes(classTrackingClass))classTrackingClass=classes[0]||"";
  const rows=classTrackingRows();

  const allCompetencies=[...new Set(rows.flatMap(s=>s.competencies.map(x=>x.competence)))]
    .sort((a,b)=>a.localeCompare(b,"fr"));

  let totalEvaluations=0;
  const distribution={TBM:0,MS:0,MF:0,MI:0};
  rows.forEach(s=>{
    totalEvaluations+=s.evaluations.length;
    s.competencies.forEach(x=>distribution[x.mastery.code]=(distribution[x.mastery.code]||0)+1);
  });

  const studentRows=rows.map(s=>{
    const counts={TBM:0,MS:0,MF:0,MI:0};
    s.competencies.forEach(x=>counts[x.mastery.code]=(counts[x.mastery.code]||0)+1);
    const latest={};
    s.competencies.forEach(x=>{latest[x.competence]=x});
    const compHtml=allCompetencies.map(name=>{
      const x=latest[name];
      return x
        ? `<span class="mastery-result ${x.mastery.cls}" style="margin:2px 4px 2px 0;display:inline-block">${x.mastery.code}</span>`
        : `<span class="small-note" style="margin-right:6px">—</span>`;
    }).join("");
    const last=s.evaluations.slice().sort((a,b)=>{
      const da=a.created_at?new Date(a.created_at).getTime():0;
      const db=b.created_at?new Date(b.created_at).getTime():0;
      return db-da;
    })[0];
    return `<tr>
      <td><strong>${esc(s.name)}</strong></td>
      <td>${s.evaluations.length}</td>
      <td>${counts.TBM}</td><td>${counts.MS}</td><td>${counts.MF}</td><td>${counts.MI}</td>
      <td>${last?esc(last.evaluation?.titre||""):"—"}</td>
      <td>${compHtml||"—"}</td>
    </tr>`;
  }).join("");

  const competencyLegend=allCompetencies.length
    ? `<div class="criteria-box" style="margin-top:16px"><h3 style="margin-top:0">🎯 Compétences suivies</h3><div class="small-note">${allCompetencies.map(x=>`<strong style="display:inline-block;margin:3px 12px 3px 0">${esc(x)}</strong>`).join("")}</div></div>`
    : "";

  content.innerHTML=`<button onclick="openEvaluations()">← Mes évaluations</button>
    <section class="hero" style="margin-top:14px">
      <span class="eyebrow">Suivi des acquis</span><h2>🏫 Suivi de classe</h2>
      <p class="muted">Une vue d'ensemble de la classe à partir des corrections enregistrées. Les niveaux sont calculés selon les règles de tes évaluations.</p>
      <div class="tracking-filters">
        <div><label>Classe</label><select onchange="classTrackingClass=this.value;renderClassTracking()"><option value="">Toutes les classes</option>${classes.map(c=>`<option value="${esc(c)}" ${c===classTrackingClass?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
        <div><label>Période</label><select onchange="classTrackingPeriod=this.value;renderClassTracking()"><option value="year" ${classTrackingPeriod==="year"?"selected":""}>Année</option><option value="t1" ${classTrackingPeriod==="t1"?"selected":""}>Trimestre 1</option><option value="t2" ${classTrackingPeriod==="t2"?"selected":""}>Trimestre 2</option><option value="t3" ${classTrackingPeriod==="t3"?"selected":""}>Trimestre 3</option></select></div>
      </div>
    </section>

    <section class="hero" style="margin-top:14px">
      <div class="tracking-summary">
        <div class="tracking-stat"><strong>${rows.length}</strong><span>élève(s)</span></div>
        <div class="tracking-stat"><strong>${totalEvaluations}</strong><span>correction(s)</span></div>
        <div class="tracking-stat"><strong>${distribution.TBM}</strong><span>TBM</span></div>
        <div class="tracking-stat"><strong>${distribution.MS}</strong><span>MS</span></div>
        <div class="tracking-stat"><strong>${distribution.MF}</strong><span>MF</span></div>
        <div class="tracking-stat"><strong>${distribution.MI}</strong><span>MI</span></div>
      </div>
    </section>

    <section class="hero" style="margin-top:14px">
      <h3>📋 Vue de la classe</h3>
      ${rows.length
        ? `<div style="overflow:auto"><table class="mastery-table">
            <thead><tr><th>Élève</th><th>Évaluations</th><th>TBM</th><th>MS</th><th>MF</th><th>MI</th><th>Dernière évaluation</th><th>Dernière maîtrise par compétence</th></tr></thead>
            <tbody>${studentRows}</tbody>
          </table></div>`
        : `<p class="muted">Aucune correction enregistrée pour cette sélection.</p>`}
    </section>
    ${competencyLegend}`;
}

async function loadBanks(){
  const [st,co]=await Promise.all([
    sb.from("ProfessorStudents").select("id,classe,nom,created_at").order("classe").order("nom"),
    sb.from("ProfessorCompetencies").select("id,niveau,nom,created_at").order("niveau").order("nom")
  ]);
  if(st.error)throw new Error(st.error.message);
  if(co.error)throw new Error(co.error.message);
  studentsCache=st.data||[];competenciesCache=co.data||[];
}

function renderStudentBank(){
  const groups={};studentsCache.forEach(s=>(groups[s.classe]??=[]).push(s));
  const classes=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr"));
  if(!classes.length)return `<p class="muted">Aucun élève enregistré.</p>`;
  return classes.map(cls=>`<div class="criteria-box"><strong>${esc(cls)}</strong>${groups[cls].map(s=>`<div class="bank-item"><div class="bank-item-main"><strong>${esc(s.nom)}</strong></div><div class="bank-actions"><button onclick="editStudent('${esc(s.id)}')">✏️</button><button class="danger" onclick="deleteStudent('${esc(s.id)}','${esc(s.nom)}')">🗑️</button></div></div>`).join("")}</div>`).join("");
}
function renderCompetencyBank(){
  const groups={};competenciesCache.forEach(c=>(groups[c.niveau||"Tous niveaux"]??=[]).push(c));
  const levels=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr"));
  if(!levels.length)return `<p class="muted">Aucune compétence enregistrée.</p>`;
  return levels.map(level=>`<div class="criteria-box"><strong>${esc(level)}</strong>${groups[level].map(c=>`<div class="bank-item"><div class="bank-item-main"><strong>${esc(c.nom)}</strong></div><div class="bank-actions"><button onclick="editCompetency('${esc(c.id)}')">✏️</button><button class="danger" onclick="deleteCompetency('${esc(c.id)}','${esc(c.nom)}')">🗑️</button></div></div>`).join("")}</div>`).join("");
}
async function addStudent(existing){

  if(q.error){alert("Enregistrement impossible : "+q.error.message);return} await openBanks();
}

async function deleteStudent(id,nom){if(!confirm(`Retirer « ${nom} » de la banque d'élèves ?\n\nLes anciennes corrections seront conservées.`))return;const q=await sb.from("ProfessorStudents").delete().eq("id",id);if(q.error){alert("Suppression impossible : "+q.error.message);return}await openBanks()}

function evaluationCard(e){

function newHistoricalEvaluation(){
  const titre=prompt("Titre de l'évaluation antérieure :");
  if(titre===null||!titre.trim())return;
  const classe=prompt("Classe :", "");
  if(classe===null||!classe.trim())return;
  const date=prompt("Date de l'évaluation (JJ/MM/AAAA) :", "");
  if(date===null)return;
  const competence=prompt("Compétence évaluée (facultatif) :", "");
  if(competence===null)return;
  createHistoricalEvaluation({
    titre:titre.trim(),
    classe:classe.trim(),
    date:date.trim(),
    competence:competence.trim()||"Compétence non renseignée"
  });
}
async function createHistoricalEvaluation(meta){
  try{
    const payload={
      titre:meta.titre,
      classe:meta.classe,
      total:0,
      competences:[],
      criteres:[],
      exercices:[{historique:true,date:meta.date,competence:meta.competence}]
    };
    const saved=await saveEvaluationObject(payload);
    evaluationsCache.unshift(saved);
    await openHistoricalCorrection(saved.id);
  }catch(e){alert("Création impossible : "+e.message)}
}

  editEvaluationObject({
    id:null,titre:"Nouvelle évaluation",classe:"",total:0,

  });
}

async function deleteEvaluation(id){
  const ev=evaluationsCache.find(x=>String(x.id)===String(id));
  if(!ev)return;
  if(!confirm(`Supprimer l'évaluation « ${ev.titre||"Sans titre"} » ?\n\nLes corrections associées seront également supprimées.`))return;
  try{
    const {error:corrError}=await sb.from("EvaluationCorrections").delete().eq("evaluation_id",id);
    if(corrError)throw new Error(corrError.message);
    const {error:evalError}=await sb.from("Evaluations").delete().eq("id",id);
    if(evalError)throw new Error(evalError.message);
    evaluationsCache=evaluationsCache.filter(x=>String(x.id)!==String(id));
    await openEvaluations();
  }catch(e){
    alert("Suppression impossible : "+e.message);
  }
}

async function duplicateEvaluation(id){
  try{
    const cached=evaluationsCache.find(x=>String(x.id)===String(id));
    let ev=cached;
    if(!ev){
      const q=await sb.from("Evaluations").select("*").eq("id",id).maybeSingle();
      if(q.error)throw new Error(q.error.message);
      if(!q.data)throw new Error("Évaluation introuvable.");
      ev=evalNormalize(q.data);
    }

    const defaultTitle=(ev.titre||"Nouvelle évaluation")+" — Sujet 2";
    const title=prompt("Nom de la nouvelle évaluation / du sujet :",defaultTitle);
    if(title===null)return;
    const titre=title.trim()||defaultTitle;

    const copy={
      titre,
      classe:ev.classe||"",
      total:Number(ev.total||0),
      competences:Array.isArray(ev.competences)?JSON.parse(JSON.stringify(ev.competences)):[],
      criteres:Array.isArray(ev.criteres)?JSON.parse(JSON.stringify(ev.criteres)):[],
      exercices:Array.isArray(ev.exercices)?JSON.parse(JSON.stringify(ev.exercices)):[]
    };

    // New IDs are generated so the copy is an independent evaluation.
    delete copy.id;
    const saved=await saveEvaluationObject(copy);
    evaluationsCache.unshift(saved);

    alert("Évaluation dupliquée ✓\n\nLa structure, les compétences, les critères, les indicateurs et les points ont été copiés.\nLes corrections des élèves n'ont pas été copiées.");
    await openEvaluations();
  }catch(e){
    alert("Duplication impossible : "+e.message);
  }
}

async function editEvaluation(id){
  try{
    const cached=evaluationsCache.find(x=>String(x.id)===String(id));
    if(cached){editEvaluationObject(cached);return;}
    const {data,error}=await sb.from("Evaluations").select("*").eq("id",id).maybeSingle();
    if(error)throw new Error(error.message);
    if(!data)throw new Error("Évaluation introuvable.");
    editEvaluationObject(evalNormalize(data));
  }catch(e){alert("Impossible d'ouvrir l'évaluation : "+e.message)}
}

function editEvaluationObject(ev){
  const e=evalNormalize(ev);
  try{localStorage.setItem(EVAL_NAV_KEY,JSON.stringify({view:"editor",id:e.id||null,draft:e}))}catch(err){}
  let comps=Array.isArray(e.competences)&&e.competences.length?e.competences:null;
  if(!comps){
    const crits=criteriaFromLegacy(e);
    const groups={};
    crits.forEach((cr,i)=>{const id=cr.competenceId||"comp1";if(!groups[id])groups[id]={id,nom:cr.competenceNom||e.competence||"",criteres:[]};groups[id].criteres.push(cr);});

    if(!comps.length)comps=[{id:"comp1",nom:e.competence||"",criteres:criterionDefaults()}];
  }
  const totalAuto=comps.reduce((sum,co)=>sum+(co.criteres||[]).reduce((a,c)=>a+(c.indicateurs||[]).reduce((b,it)=>b+Number(it.points||0),0),0),0);
  content.innerHTML=`<button onclick="openEvaluations()">← Mes évaluations</button>
  <section class="hero teacher" style="margin-top:14px">
    <span class="eyebrow">Paramétrage</span><h2>📝 ${e.id?"Modifier":"Créer"} une évaluation</h2>
    <div class="editbox">
      <label>Titre</label><input id="evTitre" value="${esc(e.titre)}">
      <label>Classe</label><input id="evClasse" value="${esc(e.classe)}" placeholder="Ex. 6e3">
      <label>Barème total</label><input id="evTotal" type="number" min="0" step="0.5" value="${esc(e.total||totalAuto)}"><p class="small-note">Le total est propre à chaque évaluation. Si tu le laisses égal au total des indicateurs, il est calculé automatiquement.</p>
    </div>
    <div class="section-heading"><h2>🎯 Compétences évaluées</h2><span class="status">Une évaluation peut porter sur plusieurs compétences.</span></div>
    <div class="competency-picker"><div><label>Ajouter depuis la banque</label><select id="bankCompetencySelect"><option value="">Choisir une compétence…</option></select></div><button type="button" onclick="addBankCompetency()">＋ Ajouter</button></div>

async function saveHistoricalResults(evalId){
  const btn=document.getElementById("saveHistoricalBtn");
  const status=document.getElementById("historicalSaveStatus");
  try{
    if(btn){btn.disabled=true;btn.textContent="⏳ Enregistrement…";}
    if(status)status.textContent="";

    const ev=evaluationsCache.find(x=>String(x.id)===String(evalId))||null;
    const q=ev?{data:ev,error:null}:await sb.from("Evaluations").select("*").eq("id",evalId).maybeSingle();
    if(q.error)throw new Error(q.error.message);
    if(!q.data)throw new Error("Évaluation introuvable.");
    const e=evalNormalize(q.data);

    await loadBanks();
    const students=studentsCache.filter(s=>!e.classe||s.classe===e.classe);
    const existing=await sb.from("EvaluationCorrections").select("id,eleve,eleve_id,resultat").eq("evaluation_id",evalId);
    if(existing.error)throw new Error(existing.error.message);
    const byId=new Map((existing.data||[]).filter(x=>x.eleve_id).map(x=>[String(x.eleve_id),x]));

    let savedCount=0;
    for(const s of students){
      const noteEl=document.getElementById(`histNote_${s.id}`);
      const masteryEl=document.getElementById(`histMastery_${s.id}`);
      const commentEl=document.getElementById(`histComment_${s.id}`);
      const noteRaw=noteEl?.value??"";
      const masteryCode=masteryEl?.value||"";
      const comment=commentEl?.value||"";
      if(noteRaw==="" && !masteryCode && !comment.trim())continue;

      const payload={
        evaluation_id:evalId,
        eleve:s.nom,
        eleve_id:s.id,
        resultat:{
          historique:true,
          note:Number(noteRaw||0),
          points:{},
          criteriaStats:{},
          masteryCode,
          commentaire:comment
        }
      };

      const old=byId.get(String(s.id));
      const r=old
        ? await sb.from("EvaluationCorrections").update(payload).eq("id",old.id)
        : await sb.from("EvaluationCorrections").insert(payload);
      if(r.error)throw new Error(`${s.nom} : ${r.error.message}`);
      savedCount++;
    }

    if(status){
      status.textContent=`✓ ${savedCount} résultat(s) enregistré(s) dans Supabase`;
      status.style.color="var(--ok,#1b7f4b)";
    }
    if(btn){btn.disabled=false;btn.textContent="💾 Enregistrer les résultats";}
  }catch(e){
    if(status){
      status.textContent="⚠️ Enregistrement impossible : "+e.message;
      status.style.color="var(--danger,#b42318)";
    }
    if(btn){btn.disabled=false;btn.textContent="💾 Enregistrer les résultats";}
  }
}

    TBM:{code:"TBM",label:"Très bonne maîtrise",cls:"mastery-tbm"},

  };
  return map[code]||null;

function masteryLabelFromCount(validatedCount){
  return getMasteryFromValidatedCriteria(validatedCount);
}

function computeCorrection(ev){
  const checks=[...document.querySelectorAll(".correction-check")];
  let score=0;const points={};const criteriaStats={};
  checks.forEach(ch=>{
    const key=ch.dataset.key,p=Number(ch.dataset.points||0),cid=ch.dataset.criterion;
    if(ch.checked){score+=p;points[key]=true}
    if(cid){
      if(!criteriaStats[cid])criteriaStats[cid]={got:0,total:0,checked:0,validated:false};
      criteriaStats[cid].count=(criteriaStats[cid].count||0)+1;
      if(ch.checked){criteriaStats[cid].checked+=1;criteriaStats[cid].got+=p;}
    }
  });
  Object.values(criteriaStats).forEach(st=>{
    st.percent=st.count?Math.round(st.checked/st.count*100):0;
    // Rule: a criterion is validated when at least 2/3 of its indicators are checked.
    st.validated=st.count>0 && (st.checked/st.count)>=(2/3);
  });
  return {score,points,criteriaStats};
}

  const compRows=Object.values(groups).map(comp=>{

  }).join("");
  const box=document.getElementById("masteryPreview");
  if(box)box.innerHTML=`<div class="criteria-box"><strong>📊 Maîtrise par compétence</strong><p class="small-note">La maîtrise est calculée séparément pour chaque compétence, selon le nombre de critères validés.</p><table class="mastery-table"><thead><tr><th>Compétence</th><th>Critères validés</th><th>Maîtrise</th></tr></thead><tbody>${compRows}</tbody></table></div>`;

  });
}

      <div class="result">Résultat : <strong>${c.score} / ${total}</strong> &nbsp; (${pct} %)</div>
      ${compHtml}
      <h2>Appréciation / remarque</h2><div class="comment">${escPrint(comment)||"Aucune remarque."}</div>
      <div class="footer">Document généré depuis le Cahier numérique de SVT.</div>
      <script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250));<\/script></body></html>`);
    w.document.close();w.focus();
  }catch(e){alert("Création du PDF impossible : "+e.message)}
}

async function saveCorrection(evalId,correctionId,eleve,eleveId){
  try{
    const {data,error}=await sb.from("Evaluations").select("*").eq("id",evalId).maybeSingle();
    if(error)throw new Error(error.message);
    if(!data)throw new Error("Évaluation introuvable.");
    const ev=evalNormalize(data),c=computeCorrection(ev);
    const resultat={note:c.score,points:c.points,criteriaStats:c.criteriaStats,commentaire:document.getElementById("corrComment")?.value||""};
    const payload={evaluation_id:evalId,eleve,eleve_id:eleveId||null,resultat};
    if(correctionId){
      const r=await sb.from("EvaluationCorrections").update(payload).eq("id",correctionId);
      if(r.error)throw new Error(r.error.message);
    }else{
      const r=await sb.from("EvaluationCorrections").insert(payload);
      if(r.error)throw new Error(r.error.message);
    }
    await openCorrection(evalId);
  }catch(e){alert("Enregistrement impossible : "+e.message)}
}

async function init(){
  const{data}=await sb.auth.getSession();user=data?.session?.user||null;
  if(user){logoutBtn.classList.remove("hidden");await restoreLastPosition()}else login();
  sb.auth.onAuthStateChange(async(event,s)=>{
  user=s?.user||null;
  if(event === "SIGNED_OUT"){ logoutBtn.classList.add("hidden"); clearNav(); login(); return; }
  // Ne pas reconstruire l'interface lors des événements TOKEN_REFRESHED / USER_UPDATED.
  // Sinon, quand l'enseignant revient sur l'onglet après être allé ailleurs,
  // Supabase peut rafraîchir la session et la saisie en cours est perdue.
  if(user) logoutBtn.classList.remove("hidden");
});
}
function login(){
  label.textContent="Éditeur professeur";content.innerHTML=`<section class="hero login"><span class="eyebrow">Espace sécurisé</span><h2>👨‍🏫 Éditeur professeur</h2><p class="muted">Connecte-toi pour modifier les cahiers de tes classes.</p><div class="editbox"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="ton adresse e-mail"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="primary" style="width:100%;margin-top:5px" onclick="doLogin()">Se connecter</button><div id="loginStatus" class="status" style="margin-top:10px"></div></div></section>`;
}
async function doLogin(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,status=document.getElementById("loginStatus");status.textContent="Connexion…";const{error}=await sb.auth.signInWithPassword({email,password});if(error)status.textContent="Connexion impossible : "+error.message}
async function logout(){clearTimeout(autosaveTimer);await sb.auth.signOut()}

function home(){
  clearTimeout(autosaveTimer);try{localStorage.removeItem(EVAL_NAV_KEY)}catch(e){}niveau=null;classe=null;currentClassData=null;currentChapterIndex=-1;clearNav();label.textContent="Éditeur professeur";
  content.innerHTML=`<section class="hero" style="text-align:center;padding:40px 25px"><span class="eyebrow">Espace professeur</span><h2>🧪 Cahier numérique de SVT</h2><p class="muted">Gère tes cahiers et tes évaluations depuis un espace professeur sécurisé.</p></section>
  <div class="grid">
    <article class="card" onclick="openEvaluations()"><span class="tag">📝 Correction</span><h3>Mes évaluations</h3><p class="muted">Créer des barèmes, corriger les élèves et générer automatiquement les grilles.</p></article>
    ${Object.keys(CLASSES).map(n=>`<article class="card" onclick="openNiveau('${n}')"><span class="tag">🧪 Niveau</span><h3>${n}</h3><p class="muted">Choisir une classe →</p></article>`).join("")}
  </div>`;
}
async function openNiveau(n){
  clearTimeout(autosaveTimer);niveau=n;classe=null;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${n}`;
  content.innerHTML=`<button onclick="home()">← Accueil</button><section class="hero" style="margin-top:14px"><span class="eyebrow">${n}</span><h2>Choisir une classe</h2><p class="muted">Sélectionne la classe dont tu veux modifier le cahier.</p></section><div id="classes" class="grid"><p class="muted">Chargement…</p></div>`;
  try{
    const arr=await Promise.all(CLASSES[n].map(async c=>{try{const d=await loadClass(c);return{c,count:d.contenu.chapitres.length}}catch(e){return{c,count:0}}}));
    const target=document.getElementById("classes");if(!target)return;target.innerHTML=arr.map(o=>`<article class="card" onclick="openClasse('${o.c}')"><span class="tag">Classe</span><h3>${o.c}</h3><p class="muted">${o.count} chapitre(s) · Modifier →</p></article>`).join("");
  }catch(e){showError(e.message)}
}
async function openClasse(c){clearTimeout(autosaveTimer);classe=c;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${c}`;await chapters()}
async function chapters(){
  if(!classe)return;
  try{
    currentClassData=await loadClass(classe);currentChapterIndex=-1;saveNav();const x=currentClassData.contenu;
    content.innerHTML=`<button onclick="openNiveau('${niveau}')">← ${niveau}</button><section class="hero" style="margin-top:14px"><span class="eyebrow">${classe}</span><h2>📚 Mes chapitres</h2><p class="muted">Ajoute et complète les chapitres directement ici.</p><button class="primary" onclick="newChapter()">＋ Ajouter un chapitre</button></section><div class="grid">${x.chapitres.map((ch,i)=>`<article class="card" onclick="editChapter(${i})"><span class="tag">Chapitre ${i+1}</span><div class="rich-output"><h3>${ch.titre||"Nouveau chapitre"}</h3></div><p class="muted">${stripHtml(ch.problematique)||"Aucune problématique renseignée"}</p><p class="small">${ch.seances.length} séance(s)</p></article>`).join("")||`<section class="hero"><h3>Aucun chapitre</h3><p class="muted">Clique sur « Ajouter un chapitre » pour commencer.</p></section>`}</div>`;
  }catch(e){showError(e.message)}
}
function stripHtml(v){const d=document.createElement("div");d.innerHTML=safe(v);return d.textContent||d.innerText||""}
async function newChapter(){
  try{if(!currentClassData)currentClassData=await loadClass(classe);currentClassData.contenu.chapitres.push(normalizeChapter({titre:"Nouveau chapitre",problematique:"",germoir:"",seances:[]}));currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);const i=currentClassData.contenu.chapitres.length-1;currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible d'ajouter le chapitre : "+e.message)}
}
function editChapter(i){
  try{
    if(!currentClassData||!Array.isArray(currentClassData.contenu?.chapitres)){showError("Le cahier n'est pas chargé.");return}
    if(i<0||i>=currentClassData.contenu.chapitres.length){showError("Ce chapitre est introuvable.");return}
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);currentClassData.contenu.chapitres[i]=ch;currentChapterIndex=i;saveNav();
    content.innerHTML=`<button onclick="chapters()">← Tous les chapitres</button><section class="hero teacher" style="margin-top:14px"><span class="eyebrow">Chapitre ${i+1}</span><h2>✏️ Modifier le chapitre</h2>
      <div class="editbox"><label>🌱 Germoir à idées</label>${richToolbar("chGermoir")}<div id="chGermoir" class="rich-editor" contenteditable="true" data-placeholder="Écris ici les idées à faire émerger…">${ch.germoir||""}</div>${pdfField("le Germoir à idées","germoirPdf",i,ch.germoirPdf)}
      <label>Titre du chapitre</label>${richToolbar("chTitre")}<div id="chTitre" class="rich-editor" contenteditable="true" data-placeholder="Titre du chapitre">${ch.titre||""}</div>
      <label>Problématique du chapitre</label>${richToolbar("chProb")}<div id="chProb" class="rich-editor" contenteditable="true" data-placeholder="Problématique du chapitre…">${ch.problematique||""}</div></div>
      <div class="section-heading"><h2>📖 Séances</h2><span class="status">Une séance peut s'étaler sur plusieurs jours.</span></div>
      <div id="sessions">${ch.seances.map((s,n)=>sessionEditor(s,n)).join("")}</div><button type="button" class="entry-add" onclick="addSession(${i})">＋ Ajouter une séance</button>
      <div class="editbox"><label>🧠 Schéma-bilan du chapitre</label>${pdfField("le schéma-bilan","schemaPdf",i,ch.schemaPdf)}<label>📝 Fiche de mémorisation</label>${pdfField("la fiche de mémorisation","memoPdf",i,ch.memoPdf)}<label>✅ Évaluation de fin de chapitre</label>${pdfField("l'évaluation de fin de chapitre","evaluationPdf",i,ch.evaluationPdf)}</div>
      <div class="row"><button class="primary" onclick="saveChapter(${i})">💾 Enregistrer</button><button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer le chapitre</button><span id="saveStatus" class="status save-indicator"></span></div></section>`;
  }catch(e){showError(e.message)}
}
async function addSession(i){
  try{
    if(!currentClassData)currentClassData=await loadClass(classe);
    const saved=await saveChapter(i);if(saved!==true)return;
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.push(normalizeSession({titre:`Séance ${ch.seances.length+1}`,problematique:"",activites:[],corrections:[],bilans:[]}));currentClassData.contenu.chapitres[i]=ch;
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i);
  }catch(e){alert("Impossible d'ajouter la séance : "+e.message)}
}
async function removeSession(n){
  const i=currentChapterIndex;if(i<0||!currentClassData)return;if(!confirm("Supprimer définitivement cette séance ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.splice(n,1);currentClassData.contenu.chapitres[i]=ch;currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible de supprimer la séance : "+e.message)}
}
async function deleteChapter(i){
  if(!confirm("Supprimer définitivement ce chapitre ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;currentClassData.contenu.chapitres.splice(i,1);currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=-1;saveNav();await chapters()}
  catch(e){alert("Suppression impossible : "+e.message)}
}
async function uploadPdf(input,kind,id){
  const file=input.files?.[0];if(!file)return;if(file.type!=="application/pdf"){alert("Choisis un fichier PDF.");input.value="";return}
  const box=input.closest(".pdf-box"),status=box?.querySelector(".status");if(status)status.textContent="Envoi du PDF…";
  const path=`${classe}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  try{
    const{error}=await sb.storage.from("documents").upload(path,file,{contentType:"application/pdf",upsert:false});if(error)throw new Error(error.message);
    const{data}=sb.storage.from("documents").getPublicUrl(path);input.dataset.url=data.publicUrl;if(box)box.dataset.currentUrl=data.publicUrl;if(status)status.textContent="PDF ajouté ✓";
    if(currentChapterIndex>=0){clearTimeout(autosaveTimer);await runAutosave()}
  }catch(e){if(status)status.textContent="Erreur : "+e.message;alert("Envoi du PDF impossible : "+e.message)}
}
async function restoreLastPosition(){
  try{
    const en=JSON.parse(localStorage.getItem(EVAL_NAV_KEY)||"null");
    if(en?.view){
      if(en.view==="list"){await openEvaluations();return;}
      if(en.view==="editor"){
        if(en.id){const all=await loadEvaluations();const ev=all.find(x=>x.id===en.id);if(ev){editEvaluationObject(ev);return;}}
        if(en.draft){editEvaluationObject(en.draft);return;}
      }
      if(en.view==="correction"&&en.id){await openCorrection(en.id);return;}
      if(en.view==="studentCorrection"&&en.evalId){await renderCorrectionEditor(en.evalId,en.correctionId||null,{eleve:en.eleve||"Élève",resultat:en.resultat||{points:{},note:0,commentaire:"",criteriaStats:{}}});return;}
      if(en.view==="tracking"){studentTrackingClass=en.classe||"";studentTrackingStudent=en.student||"";studentTrackingPeriod=en.period||"year";await openStudentTracking();return;}
      if(en.view==="classTracking"){classTrackingClass=en.classe||"";classTrackingPeriod=en.period||"year";await openClassTracking();return;}
    }
  }catch(e){}
  const n=loadNav();if(!n?.niveau){home();return}niveau=n.niveau;if(!CLASSES[niveau]){home();return}
  if(n.classe&&CLASSES[niveau].includes(n.classe)){classe=n.classe;label.textContent=`Éditeur · ${classe}`;try{currentClassData=await loadClass(classe);const ci=Number.isInteger(n.currentChapterIndex)?n.currentChapterIndex:-1;if(n.view==="chapter"&&ci>=0&&ci<currentClassData.contenu.chapitres.length){currentChapterIndex=ci;editChapter(ci);return}await chapters();return}catch(e){showError(e.message);return}}
  await openNiveau(niveau);
}
init();
</script>
</body>
</html>
