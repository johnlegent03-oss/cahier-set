<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur professeur — Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#203037;--muted:#6b7b7d;--a:#397466;--a2:#e4f1ec;--b:#d8e3df;--prof:#fff7e7;--danger:#fff0ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,#dceee7aa,transparent 28%),var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
.head{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:var(--a2);display:grid;place-items:center;font-size:23px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1100px;margin:auto;padding:26px 20px 50px}
button,.btn{font:inherit;border:1px solid var(--b);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:650;text-decoration:none}
button.primary{background:var(--a);color:#fff;border-color:var(--a)}
button.danger{background:var(--danger);border-color:#efc0ba}
.hero,.card,.editbox{background:#ffffffed;border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 6px 20px #23413b0b}
.hero{border-radius:22px;margin-bottom:18px}.hero h2{font-size:29px;margin:7px 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:800}.muted{color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{cursor:pointer}.card:hover{border-color:#9dbdb5}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--a2);color:var(--a);font-size:11px;font-weight:800}
.editbox{margin:12px 0;border-style:dashed}.teacher{background:var(--prof);border-color:#ead6a8}
.editbox label{display:block;font-size:12px;font-weight:800;margin:8px 0 6px}
input,textarea,select{width:100%;border:1px solid var(--b);border-radius:9px;padding:10px;font:inherit;background:#fff}
textarea{min-height:85px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}
.notice{padding:12px;border-radius:10px;background:#eef4ff;margin:10px 0}.error{background:#fff0ef;border:1px solid #efc0ba}
.login{max-width:460px;margin:45px auto}.status{font-size:12px;color:var(--muted)}
.session-box{border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0;background:#fff}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
hr{border:0;border-top:1px solid var(--b);margin:18px 0}
</style>
</head>
<body>
<header><div class="head">
  <div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p id="label">Éditeur professeur</p></div></div>
  <button id="logoutBtn" class="hidden" onclick="logout()">Se déconnecter</button>
</div></header>
<main id="content"></main>
<footer>Éditeur professeur · les modifications sont enregistrées dans Supabase.</footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth:{persistSession:true,autoRefreshToken:true}
});

const CLASSES = {
  "6e":["6e1","6e2","6e3","6e4","6e5"],
  "5e":["5e1","5e3","5e5"],
  "4e":["4e1","4e2","4e3","4e4"],
  "3e":["3e1","3e2","3e3","3e4"]
};

let niveau=null, classe=null, user=null;
const content=document.getElementById("content");
const label=document.getElementById("label");
const logoutBtn=document.getElementById("logoutBtn");

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const safe=v=>v==null?"":String(v);

function normalizeSession(s){
  const x=s&&typeof s==="object"?s:{};
  return {
    titre:safe(x.titre||x.title||"Séance"),
    activite:safe(x.activite||x.activity),
    correction:safe(x.correction),
    bilan:safe(x.bilan),
    pdf:safe(x.pdf||x.document_pdf||x.document)
  };
}
function normalizeChapter(ch){
  const x=ch&&typeof ch==="object"?ch:{};
  const seances=Array.isArray(x.seances)?x.seances:(Array.isArray(x.sessions)?x.sessions:[]);
  return {
    titre:safe(x.titre||x.title||"Nouveau chapitre"),
    problematique:safe(x.problematique||x.probleme||x.problem),
    seances:seances.filter(Boolean).map(normalizeSession),
    schema:safe(x.schema||x.schemaBilan||x.schema_bilan),
    schemaPdf:safe(x.schemaPdf||x.schema_pdf),
    memo:safe(x.memo||x.memorisation||x.ficheMemo),
    memoPdf:safe(x.memoPdf||x.memo_pdf)
  };
}
function normalizeCahier(raw){
  let x=raw;
  if(!x||typeof x!=="object") x={};
  if(Array.isArray(x)) x={chapitres:x};
  if(!Array.isArray(x.chapitres)) x.chapitres=[];
  x.chapitres=x.chapitres.map(normalizeChapter);
  return x;
}

async function loadClass(c){
  const {data,error}=await sb.from("Cahier").select("id,classe,contenu").eq("classe",c).maybeSingle();
  if(error){console.error(error);throw new Error(error.message)}
  return {id:data?.id||null, contenu:normalizeCahier(data?.contenu)};
}
async function saveClass(c, contenu, existingId){
  let res;
  if(existingId) res=await sb.from("Cahier").update({contenu}).eq("id",existingId);
  else res=await sb.from("Cahier").insert({classe:c,contenu});
  if(res.error) throw new Error(res.error.message);
}

function showError(msg){
  content.innerHTML=`<section class="hero error"><h2>⚠️ Une erreur est survenue</h2><p>${esc(msg)}</p><button onclick="home()">Retour</button></section>`;
}

async function init(){
  const {data}=await sb.auth.getSession();
  user=data?.session?.user||null;
  if(user){logoutBtn.classList.remove("hidden");home();}
  else login();
  sb.auth.onAuthStateChange((_e,s)=>{
    user=s?.user||null;
    if(user) {logoutBtn.classList.remove("hidden");home();}
    else {logoutBtn.classList.add("hidden");login();}
  });
}

function login(){
  label.textContent="Éditeur professeur";
  content.innerHTML=`<section class="hero login">
    <span class="eyebrow">Espace sécurisé</span>
    <h2>👨‍🏫 Éditeur professeur</h2>
    <p class="muted">Connecte-toi pour modifier les cahiers de tes classes.</p>
    <div class="editbox">
      <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="ton adresse e-mail">
      <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe">
      <button class="primary" style="width:100%;margin-top:5px" onclick="doLogin()">Se connecter</button>
      <div id="loginStatus" class="status" style="margin-top:10px"></div>
    </div>
  </section>`;
}
async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const status=document.getElementById("loginStatus");
  status.textContent="Connexion…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) status.textContent="Connexion impossible : "+error.message;
}
async function logout(){await sb.auth.signOut();}

function home(){
  niveau=null;classe=null;label.textContent="Éditeur professeur";
  content.innerHTML=`<section class="hero" style="text-align:center;padding:40px 25px">
    <span class="eyebrow">Espace professeur</span><h2>🧪 Cahier numérique de SVT</h2>
    <p class="muted">Choisis un niveau puis une classe pour modifier son cahier.</p>
  </section>
  <div class="grid">${Object.keys(CLASSES).map(n=>`<article class="card" onclick="openNiveau('${n}')">
    <span class="tag">Niveau</span><h3>${n}</h3><p class="muted">Choisir une classe →</p></article>`).join("")}</div>`;
}

async function openNiveau(n){
  niveau=n;classe=null;label.textContent=`Éditeur · ${n}`;
  content.innerHTML=`<button onclick="home()">← Accueil</button><section class="hero" style="margin-top:14px">
    <span class="eyebrow">${n}</span><h2>Choisir une classe</h2>
    <p class="muted">Sélectionne la classe dont tu veux modifier le cahier.</p></section>
    <div id="classes" class="grid"><p class="muted">Chargement…</p></div>`;
  try{
    const arr=await Promise.all(CLASSES[n].map(async c=>{
      try{const d=await loadClass(c);return {c,count:d.contenu.chapitres.length}}
      catch(e){return {c,count:0}}
    }));
    document.getElementById("classes").innerHTML=arr.map(o=>`<article class="card" onclick="openClasse('${o.c}')">
      <span class="tag">Classe</span><h3>${o.c}</h3><p class="muted">${o.count} chapitre(s) · Modifier →</p></article>`).join("");
  }catch(e){showError(e.message)}
}

async function openClasse(c){
  classe=c;label.textContent=`Éditeur · ${c}`;
  await chapters();
}

async function chapters(){
  try{
    const d=await loadClass(classe), x=d.contenu;
    content.innerHTML=`<button onclick="openNiveau('${niveau}')">← ${niveau}</button>
    <section class="hero" style="margin-top:14px"><span class="eyebrow">${classe}</span>
      <h2>📚 Mes chapitres</h2><p class="muted">Ajoute et complète les chapitres directement ici.</p>
      <button class="primary" onclick="newChapter()">＋ Ajouter un chapitre</button>
    </section>
    <div class="grid">${x.chapitres.map((ch,i)=>`<article class="card" onclick="editChapter(${i})">
      <span class="tag">Chapitre ${i+1}</span>
      <h3>${esc(ch.titre||"Nouveau chapitre")}</h3>
      <p class="muted">${esc(ch.problematique||"Aucune problématique renseignée")}</p>
      <p class="small">${ch.seances.length} séance(s)</p>
    </article>`).join("") || `<section class="hero"><h3>Aucun chapitre</h3><p class="muted">Clique sur « Ajouter un chapitre » pour commencer.</p></section>`}</div>`;
  }catch(e){showError(e.message)}
}

async function newChapter(){
  try{
    const d=await loadClass(classe);
    d.contenu.chapitres.push(normalizeChapter({titre:"Nouveau chapitre",problematique:"",seances:[]}));
    await saveClass(classe,d.contenu,d.id);
    await chapters();
    editChapter(d.contenu.chapitres.length-1);
  }catch(e){alert("Impossible d'ajouter le chapitre : "+e.message)}
}

async function editChapter(i){
  try{
    const d=await loadClass(classe);
    const ch=normalizeChapter(d.contenu.chapitres[i]);
    d.contenu.chapitres[i]=ch;
    content.innerHTML=`<button onclick="chapters()">← Tous les chapitres</button>
    <section class="hero teacher" style="margin-top:14px">
      <span class="eyebrow">Chapitre ${i+1}</span>
      <h2>✏️ Modifier le chapitre</h2>
      <div class="editbox">
        <label>Titre</label><input id="chTitre" value="${esc(ch.titre)}">
        <label>Problématique</label><textarea id="chProb">${esc(ch.problematique)}</textarea>
      </div>
      <h2>📖 Séances</h2>
      <div id="sessions">${ch.seances.map((s,n)=>sessionEditor(s,n)).join("")}</div>
      <button onclick="addSession(${i})">＋ Ajouter une séance</button>
      <div class="editbox">
        <label>Schéma-bilan du chapitre</label><textarea id="schema">${esc(ch.schema)}</textarea>
        <label>PDF du schéma-bilan</label><input id="schemaPdf" value="${esc(ch.schemaPdf)}" placeholder="Lien PDF">
        <label>Fiche de mémorisation</label><textarea id="memo">${esc(ch.memo)}</textarea>
        <label>PDF de la fiche de mémorisation</label><input id="memoPdf" value="${esc(ch.memoPdf)}" placeholder="Lien PDF">
      </div>
      <div class="row">
        <button class="primary" onclick="saveChapter(${i})">💾 Enregistrer</button>
        <button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer le chapitre</button>
      </div>
      <div id="saveStatus" class="status"></div>
    </section>`;
  }catch(e){showError(e.message)}
}

function sessionEditor(s,n){
  const x=normalizeSession(s);
  return `<div class="session-box">
    <div class="row" style="justify-content:space-between"><strong>Séance ${n+1}</strong>
      <button class="danger" onclick="removeSession(${n})">Supprimer</button></div>
    <label>Titre de la séance</label><input class="st" value="${esc(x.titre)}">
    <label>Activité</label><textarea class="sa">${esc(x.activite)}</textarea>
    <label>Correction</label><textarea class="sc">${esc(x.correction)}</textarea>
    <label>Bilan</label><textarea class="sb">${esc(x.bilan)}</textarea>
    <label>Document PDF</label><input class="sf" type="file" accept="application/pdf" onchange="uploadPdf(this,${n})">
    <input class="su" value="${esc(x.pdf)}" placeholder="Lien du PDF">
    <span id="uploadStatus${n}" class="status"></span>
  </div>`;
}

async function addSession(i){
  try{
    const d=await loadClass(classe);
    d.contenu.chapitres[i].seances.push(normalizeSession({titre:`Séance ${d.contenu.chapitres[i].seances.length+1}`}));
    await saveClass(classe,d.contenu,d.id);
    await editChapter(i);
  }catch(e){alert("Impossible d'ajouter la séance : "+e.message)}
}

async function removeSession(n){
  const i=getCurrentChapterIndex();
  if(i<0)return;
  try{
    const d=await loadClass(classe);
    d.contenu.chapitres[i].seances.splice(n,1);
    await saveClass(classe,d.contenu,d.id);
    await editChapter(i);
  }catch(e){alert("Impossible de supprimer la séance : "+e.message)}
}

function getCurrentChapterIndex(){
  const text=content.querySelector(".eyebrow")?.textContent||"";
  const m=text.match(/(\d+)/);
  return m?parseInt(m[1],10)-1:-1;
}

async function saveChapter(i){
  const status=document.getElementById("saveStatus");
  if(status)status.textContent="Enregistrement…";
  try{
    const d=await loadClass(classe), old=normalizeChapter(d.contenu.chapitres[i]);
    const ses=[...document.querySelectorAll("#sessions .session-box")].map((box,n)=>normalizeSession({
      titre:box.querySelector(".st")?.value,
      activite:box.querySelector(".sa")?.value,
      correction:box.querySelector(".sc")?.value,
      bilan:box.querySelector(".sb")?.value,
      pdf:box.querySelector(".su")?.value
    }));
    d.contenu.chapitres[i]=normalizeChapter({
      ...old,
      titre:document.getElementById("chTitre").value,
      problematique:document.getElementById("chProb").value,
      seances:ses,
      schema:document.getElementById("schema").value,
      schemaPdf:document.getElementById("schemaPdf").value,
      memo:document.getElementById("memo").value,
      memoPdf:document.getElementById("memoPdf").value
    });
    await saveClass(classe,d.contenu,d.id);
    if(status)status.textContent="Enregistré ✓";
    setTimeout(()=>{if(status)status.textContent=""},2500);
  }catch(e){
    if(status)status.textContent="Erreur : "+e.message;
    alert("Enregistrement impossible : "+e.message);
  }
}

async function deleteChapter(i){
  if(!confirm("Supprimer définitivement ce chapitre ?"))return;
  try{
    const d=await loadClass(classe);
    d.contenu.chapitres.splice(i,1);
    await saveClass(classe,d.contenu,d.id);
    await chapters();
  }catch(e){alert("Suppression impossible : "+e.message)}
}

async function uploadPdf(input,n){
  const file=input.files?.[0];if(!file)return;
  if(file.type!=="application/pdf"){alert("Choisis un fichier PDF.");input.value="";return}
  const status=document.getElementById("uploadStatus"+n);
  if(status)status.textContent="Envoi du PDF…";
  const path=`${classe}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  const {error}=await sb.storage.from("documents").upload(path,file,{contentType:"application/pdf",upsert:false});
  if(error){if(status)status.textContent="Erreur : "+error.message;return}
  const {data}=sb.storage.from("documents").getPublicUrl(path);
  input.parentElement.querySelector(".su").value=data.publicUrl;
  if(status)status.textContent="PDF ajouté ✓";
}

init();
</script>
</body>
</html>
