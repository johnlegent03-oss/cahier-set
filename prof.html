<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur professeur · Cahier numérique de SVT</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#203037;--muted:#6b7b7d;--a:#397466;--a2:#e4f1ec;--b:#d8e3df;--prof:#fff7e7;--danger:#fff0ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#ffffffed;border-bottom:1px solid var(--b)}
.head{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:var(--a2);display:grid;place-items:center;font-size:23px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}
main{max-width:1100px;margin:auto;padding:26px 20px 50px}
button,.btn{font:inherit;border:1px solid var(--b);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:650;text-decoration:none}
.primary{background:var(--a);color:#fff;border-color:var(--a)}.danger{background:var(--danger);border-color:#efc0ba}
.hero,.card,.editbox{background:#ffffffed;border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 6px 20px #23413b0b}
.hero{border-radius:22px;margin-bottom:18px}.hero h2{font-size:29px;margin:7px 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:800}.muted{color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{cursor:pointer}.card:hover{border-color:#9dbdb5}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--a2);color:var(--a);font-size:11px;font-weight:800}
.editbox{margin:12px 0;border-style:dashed;background:var(--prof)}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}
.editbox input,.editbox textarea,.login input{width:100%;border:1px solid var(--b);border-radius:9px;padding:10px;font:inherit;margin-bottom:8px;background:#fff}
.editbox textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small,.status{font-size:12px;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#eef4ff;margin:10px 0}
.login{max-width:460px;margin:45px auto}.hidden{display:none!important}.pdfrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pdfrow input[type=file]{flex:1}.sep{height:1px;background:var(--b);margin:20px 0}.sessionbox{margin:12px 0}.back{margin-bottom:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 35px}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p>Éditeur professeur</p></div></div><button id="logout" class="hidden" onclick="logout()">Se déconnecter</button></div></header>
<main id="app"></main>
<footer>Éditeur professeur · les modifications sont enregistrées dans Supabase.</footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const CLASSES={"6e":["6e1","6e2","6e3","6e4","6e5"],"5e":["5e1","5e3","5e5"],"3e":["3e2","3e3"]};
const app=document.getElementById("app"),logoutBtn=document.getElementById("logout");
let user=null,niveau=null,classe=null;

const esc=x=>String(x??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const val=x=>esc(x).replace(/\n/g,"&#10;");

function empty(){return {chapitres:[]}}

function normalizeChapter(ch){
 if(!ch || typeof ch!=="object") ch={};
 return {
  titre:String(ch.titre??"Nouveau chapitre"),
  problematique:String(ch.problematique??""),
  seances:Array.isArray(ch.seances)?ch.seances.map(s=>s&&typeof s==="object"?s:{}):[],
  schema:String(ch.schema??""), schemaPdf:String(ch.schemaPdf??""),
  memo:String(ch.memo??""), memoPdf:String(ch.memoPdf??"")
 };
}

async function loadClass(c){
 const {data,error}=await sb.from("Cahier").select("id,classe,contenu").eq("classe",c).maybeSingle();
 if(error)throw error;
 let x=data?.contenu||empty();
 if(Array.isArray(x))x={chapitres:x};
 if(!Array.isArray(x.chapitres))x.chapitres=[];
 x.chapitres=x.chapitres.map(normalizeChapter);
 return {row:data,x};
}

async function saveClass(c,x){
 const {row}=await loadClass(c);
 const r=row?.id
  ?await sb.from("Cahier").update({contenu:x}).eq("id",row.id)
  :await sb.from("Cahier").insert({classe:c,contenu:x});
 if(r.error)throw r.error;
 return true;
}

function showError(e){alert("Erreur : "+(e?.message||e));console.error(e)}

function loginView(msg=""){
 app.innerHTML=`<section class="hero login">
 <span class="eyebrow">Espace sécurisé</span>
 <h2>👨‍🏫 Éditeur professeur</h2>
 <p class="muted">Connecte-toi pour modifier les cahiers de tes classes.</p>
 ${msg?`<div class="notice">${esc(msg)}</div>`:""}
 <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="ton adresse e-mail">
 <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe">
 <button class="primary" style="width:100%;margin-top:6px" onclick="login()">Se connecter</button>
 <p class="small" style="margin-top:12px">Cette page n'est pas accessible depuis l'interface élève.</p>
 </section>`;
 logoutBtn.classList.add("hidden");
}

async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password)return alert("Renseigne ton e-mail et ton mot de passe.");
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error)return loginView(error.message);
 user=data.user;logoutBtn.classList.remove("hidden");home();
}

async function logout(){await sb.auth.signOut();user=null;logoutBtn.classList.add("hidden");loginView()}

async function init(){
 const {data}=await sb.auth.getSession();
 user=data.session?.user||null;
 if(user){logoutBtn.classList.remove("hidden");home()}else loginView();
}
sb.auth.onAuthStateChange((_event,session)=>{
 user=session?.user||null;
 if(user)logoutBtn.classList.remove("hidden");else logoutBtn.classList.add("hidden")
});

function home(){
 app.innerHTML=`<section class="hero">
 <span class="eyebrow">Espace professeur</span>
 <h2>🧪 Gérer mes cahiers</h2>
 <p class="muted">Choisis un niveau puis une classe. Tu peux ensuite compléter les chapitres au fur et à mesure.</p>
 </section>
 <div class="grid">${Object.keys(CLASSES).map(n=>`
 <article class="card" onclick="openNiveau('${n}')">
 <span class="tag">Niveau</span><h3>${n}</h3>
 <p class="muted">${CLASSES[n].length} classe(s) · Ouvrir →</p>
 </article>`).join("")}</div>`;
}

async function openNiveau(n){
 niveau=n;
 app.innerHTML=`<button class="back" onclick="home()">← Accueil</button>
 <section class="hero"><span class="eyebrow">${n}</span><h2>Choisir une classe</h2></section>
 <div id="classes" class="grid"><p class="muted">Chargement…</p></div>`;
 const box=document.getElementById("classes");let out="";
 for(const c of CLASSES[n]){
  try{
   const {x}=await loadClass(c);
   out+=`<article class="card" onclick="openClasse('${c}')"><span class="tag">Classe</span><h3>${c}</h3><p class="muted">${x.chapitres.length} chapitre(s) · Ouvrir →</p></article>`;
  }catch(e){
   out+=`<article class="card"><span class="tag">Classe</span><h3>${c}</h3><p class="muted">Erreur de lecture</p></article>`;
  }
 }
 box.innerHTML=out;
}

async function openClasse(c){classe=c;await chapters()}

async function chapters(){
 try{
  const {x}=await loadClass(classe);
  app.innerHTML=`<button onclick="openNiveau('${niveau}')">← ${niveau}</button>
  <section class="hero">
   <span class="eyebrow">${classe}</span>
   <h2>📚 Mes chapitres</h2>
   <p class="muted">Ajoute et complète les chapitres directement ici.</p>
   <button class="primary" onclick="newChapter()">➕ Ajouter un chapitre</button>
  </section>
  <div class="grid">
   ${x.chapitres.map((ch,i)=>`
   <article class="card" onclick="editChapter(${i})">
    <span class="tag">Chapitre ${i+1}</span>
    <h3>${esc(ch?.titre||"Nouveau chapitre")}</h3>
    <p class="muted">${esc(ch?.problematique||"Problématique à compléter")}</p>
   </article>`).join("") ||
   '<section class="hero"><h3>Aucun chapitre.</h3><p class="muted">Clique sur « Ajouter un chapitre » pour commencer.</p></section>'}
  </div>`;
 }catch(e){showError(e)}
}

function sessionEditor(s,n){
 s=s||{};
 return `<div class="editbox sessionbox">
 <label>Séance ${n+1} · titre</label><input class="st" value="${val(s.titre)}">
 <label>Activité</label><textarea class="sa">${esc(s.activite)}</textarea>
 <label>Correction</label><textarea class="sc">${esc(s.correction)}</textarea>
 <label>Bilan</label><textarea class="sb">${esc(s.bilan)}</textarea>
 <label>Document PDF</label>
 <div class="pdfrow"><input class="sf" type="file" accept="application/pdf" onchange="uploadPdf(this,'session')">
 <input class="su" value="${val(s.pdf)}" placeholder="Le lien apparaîtra ici"></div>
 <div class="status up">Aucun nouveau fichier</div>
 <button class="danger" onclick="this.closest('.sessionbox').remove()">Supprimer cette séance</button>
 </div>`;
}

function editChapter(i){
 loadClass(classe).then(({x})=>{
  const ch=x.chapitres?.[i];
  if(!ch)throw new Error("Chapitre introuvable. Retourne à la liste et ouvre-le à nouveau.");
  app.innerHTML=`<button onclick="chapters()">← Mes chapitres</button>
  <section class="hero">
   <span class="eyebrow">Chapitre ${i+1} · ${classe}</span>
   <h2>✏️ Modifier le chapitre</h2>
   <div class="editbox">
    <label>Titre</label><input id="titre" value="${val(ch.titre)}">
    <label>Problématique</label><textarea id="prob">${esc(ch.problematique)}</textarea>
   </div>
   <h2>📖 Séances</h2>
   <div id="sessions">${(ch.seances||[]).map((s,n)=>sessionEditor(s,n)).join("")}</div>
   <button onclick="addSession()">➕ Ajouter une séance</button>
   <div class="sep"></div>
   <div class="editbox">
    <label>🧠 Schéma-bilan du chapitre</label>
    <textarea id="schema">${esc(ch.schema)}</textarea>
    <label>PDF du schéma-bilan</label>
    <div class="pdfrow">
     <input id="schemaFile" type="file" accept="application/pdf" onchange="uploadPdf(this,'schema')">
     <input id="schemaPdf" value="${val(ch.schemaPdf)}" placeholder="Le lien apparaîtra ici">
    </div>
    <div id="schemaStatus" class="status">Aucun nouveau fichier</div>
    <label>📝 Fiche de mémorisation</label>
    <textarea id="memo">${esc(ch.memo)}</textarea>
    <label>PDF de la fiche de mémorisation</label>
    <div class="pdfrow">
     <input id="memoFile" type="file" accept="application/pdf" onchange="uploadPdf(this,'memo')">
     <input id="memoPdf" value="${val(ch.memoPdf)}" placeholder="Le lien apparaîtra ici">
    </div>
    <div id="memoStatus" class="status">Aucun nouveau fichier</div>
   </div>
   <div class="row">
    <button class="primary" onclick="saveChapter(${i})">💾 Enregistrer</button>
    <button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer le chapitre</button>
   </div>
  </section>`;
 }).catch(showError);
}

function addSession(){
 const n=document.querySelectorAll(".sessionbox").length;
 document.getElementById("sessions").insertAdjacentHTML("beforeend",
 sessionEditor({titre:"",activite:"",correction:"",bilan:"",pdf:""},n));
}

async function uploadPdf(input,type){
 const f=input.files?.[0];if(!f)return;
 if(f.type!=="application/pdf"){alert("Choisis un fichier PDF.");input.value="";return}
 const status=type==="schema"?document.getElementById("schemaStatus"):
 type==="memo"?document.getElementById("memoStatus"):
 input.closest(".sessionbox").querySelector(".up");
 status.textContent="Envoi du PDF…";
 const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=`${classe}/${Date.now()}-${safe}`;
 const {error}=await sb.storage.from("documents").upload(path,f,{contentType:"application/pdf",upsert:false});
 if(error){status.textContent="Erreur : "+error.message;return}
 const {data}=sb.storage.from("documents").getPublicUrl(path);
 if(type==="schema")document.getElementById("schemaPdf").value=data.publicUrl;
 else if(type==="memo")document.getElementById("memoPdf").value=data.publicUrl;
 else input.closest(".sessionbox").querySelector(".su").value=data.publicUrl;
 status.textContent="PDF ajouté ✓";
}

async function saveChapter(i){
 try{
  const {x}=await loadClass(classe),ch=x.chapitres?.[i];
  if(!ch)throw new Error("Chapitre introuvable");
  ch.titre=document.getElementById("titre").value;
  ch.problematique=document.getElementById("prob").value;
  ch.seances=[...document.querySelectorAll(".sessionbox")].map(box=>({
   titre:box.querySelector(".st").value,
   activite:box.querySelector(".sa").value,
   correction:box.querySelector(".sc").value,
   bilan:box.querySelector(".sb").value,
   pdf:box.querySelector(".su").value
  }));
  ch.schema=document.getElementById("schema").value;
  ch.schemaPdf=document.getElementById("schemaPdf").value;
  ch.memo=document.getElementById("memo").value;
  ch.memoPdf=document.getElementById("memoPdf").value;
  await saveClass(classe,x);
  alert("Chapitre enregistré ✓");
  await chapters();
 }catch(e){showError(e)}
}

async function newChapter(){
 try{
  const {x}=await loadClass(classe);
  if(!Array.isArray(x.chapitres))x.chapitres=[];
  x.chapitres.push(normalizeChapter({
   titre:"Nouveau chapitre",
   problematique:"",
   seances:[],
   schema:"",
   schemaPdf:"",
   memo:"",
   memoPdf:""
  }));
  await saveClass(classe,x);
  await chapters();
 }catch(e){showError(e)}
}

async function deleteChapter(i){
 if(!confirm("Supprimer ce chapitre ?"))return;
 try{
  const {x}=await loadClass(classe);
  x.chapitres.splice(i,1);
  await saveClass(classe,x);
  await chapters();
 }catch(e){showError(e)}
}

init();
</script>
</body>
</html>
