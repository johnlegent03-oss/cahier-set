let niveau=null,classe=null,user=null,currentClassData=null,currentChapterIndex=-1,showArchivedChapters=false;
let autosaveTimer=null,autosaveRunning=false,autosaveAgain=false,hasUnsavedChanges=false;
function localBackupKey(classeName,index){return `svt-chapter-backup:${encodeURIComponent(classeName||"")}:${index}`;}
function storeLocalChapterBackup(index){
  try{
    if(!classe||!currentClassData||index<0)return false;
    const chapter=normalizeChapter(readEditorChapter(index));
    localStorage.setItem(localBackupKey(classe,index),JSON.stringify({classe,index,savedAt:Date.now(),chapter}));
    return true;
  }catch(e){console.warn("Sauvegarde locale impossible :",e);return false;}
}
function clearLocalChapterBackup(index){try{if(classe&&index>=0)localStorage.removeItem(localBackupKey(classe,index));}catch(e){console.warn("Suppression de la copie locale impossible :",e);}}
function recoverLocalChapterBackup(index){
  try{
    if(!classe||!currentClassData||index<0)return;
    const key=localBackupKey(classe,index),raw=localStorage.getItem(key);if(!raw)return;
    const backup=JSON.parse(raw);if(backup.classe!==classe||backup.index!==index||!backup.chapter)return;
    const online=normalizeChapter(currentClassData.contenu.chapitres[index]);
    const local=normalizeChapter(backup.chapter);
    if(JSON.stringify(online)===JSON.stringify(local)){localStorage.removeItem(key);return;}
    const when=backup.savedAt?new Date(backup.savedAt).toLocaleString("fr-FR"):"date inconnue";
    if(confirm(`Une copie locale de ce chapitre, datée du ${when}, diffère de la version en ligne.\n\nVeux-tu restaurer cette copie locale ?\n\nChoisis « Annuler » pour conserver la version en ligne et supprimer la copie locale.`)){
      currentClassData.contenu.chapitres[index]=local;localStorage.removeItem(key);
    }else localStorage.removeItem(key);
  }catch(e){console.warn("Récupération de la copie locale impossible :",e);}
}

function sanitizeRichHtml(value){
  const html=safe(value);
  if(!html)return "";
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");

  const allowedTags=new Set(["B","I","U","BR","P","DIV","SPAN","STRONG","EM","MARK","SMALL","SUB","SUP","UL","OL","LI","H1","H2","H3","H4","H5","H6","TABLE","THEAD","TBODY","TR","TH","TD","A","FONT","IMG"]);
  const allowedStyle=new Set(["color","background-color","font-family","font-size","font-weight","font-style","text-decoration","text-align"]);
  [...root.querySelectorAll("*")].forEach(el=>{
    if(!allowedTags.has(el.tagName)){el.replaceWith(...[...el.childNodes]);return;}
    if(el.tagName==="FONT" && el.getAttribute("color")){
  const color=el.getAttribute("color");
  el.style.color=color;
  el.removeAttribute("color");

    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      if(name==="style"){
        const clean=attr.value.split(";").map(x=>x.trim()).filter(Boolean).filter(part=>{
          const i=part.indexOf(":"); if(i<1)return false;
          const prop=part.slice(0,i).trim().toLowerCase();
          const val=part.slice(i+1).trim().toLowerCase();

          el.setAttribute("target","_blank");
          el.setAttribute("rel","noopener noreferrer");
        }catch(e){el.removeAttribute("href");}
      }else if(name==="src"&&el.tagName==="IMG"){
        try{
          const u=new URL(attr.value,location.href);
          if(u.protocol!=="https:")throw new Error("unsafe");
          el.setAttribute("src",u.href);
        }catch(e){el.removeAttribute("src");}
      }else if(name==="alt"&&el.tagName==="IMG"){
        el.setAttribute("alt",String(attr.value||"").slice(0,300));
      }else if(name==="style"&&el.tagName==="IMG"){
        el.setAttribute("style","max-width:100%;height:auto");
      }else{el.removeAttribute(attr.name);}
    });
  });
  return root.innerHTML;
}

// Gestion des images dans l’éditeur : sélection, déplacement, redimensionnement et rognage.
let selectedRichImage = null;
let movingRichImage = null;
let richImageStartX = 0;
let richImageStartY = 0;
let richImageStartLeft = 0;
let richImageStartTop = 0;
let richImageEditor = null;

function observeRichImage(img){
  if(!img)return;
  img.draggable=false;
  img.tabIndex=0;
  // Convertir les anciennes images déplacées en position absolue :
  // elles sortaient du flux et pouvaient apparaître hors du chapitre.
  if(img.style.position==="absolute"){
    img.style.position="relative";
    img.style.left="";
    img.style.top="";
    img.style.zIndex="";
  }
  if(img.dataset.resizeObserved==="1")return;
  img.dataset.resizeObserved="1";
  if("ResizeObserver" in window){
    let initialized=false;
    const ro=new ResizeObserver(entries=>{
      const rect=entries[0]?.contentRect;
      if(!rect||rect.width<2||rect.height<2)return;
      if(!initialized){initialized=true;return;}
      img.style.width=Math.round(rect.width)+"px";
      img.style.height=Math.round(rect.height)+"px";
      scheduleAutosave();
    });
    ro.observe(img);
  }
}

document.addEventListener("pointerdown",e=>{

  const imgRect=img.getBoundingClientRect();
  // Laisser le navigateur gérer sa poignée native de redimensionnement.
  const handleSize=20;
  const nearResizeHandle=e.clientX>=imgRect.right-handleSize && e.clientY>=imgRect.bottom-handleSize;
  if(nearResizeHandle)return;
  const editorRect=editor.getBoundingClientRect();
  richImageStartX=e.clientX;
  richImageStartY=e.clientY;
  // Déplacement en position relative : l’image reste dans le flux du chapitre.
  richImageStartLeft=parseFloat(img.style.left)||0;
  richImageStartTop=parseFloat(img.style.top)||0;
  richImageEditor=editor;
  movingRichImage=img;
  img.style.position="relative";
  img.style.left=richImageStartLeft+"px";
  img.style.top=richImageStartTop+"px";
  img.style.zIndex="1";
  img.style.cursor="grabbing";
  try{img.setPointerCapture(e.pointerId);}catch(_){}

});

});

  canvas.addEventListener("pointermove",e=>{if(!start)return;const p=point(e);rect={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};redraw();});
  canvas.addEventListener("pointerup",()=>{start=null;});
  cancel.onclick=()=>overlay.remove();
  confirm.onclick=async()=>{
    if(!rect||rect.w<8||rect.h<8){alert("Sélectionne d’abord une zone suffisamment grande.");return;}
    confirm.disabled=true;confirm.textContent="Enregistrement…";
    try{
      const out=document.createElement("canvas");out.width=Math.round(rect.w/scale);out.height=Math.round(rect.h/scale);
      out.getContext("2d").drawImage(source,Math.round(rect.x/scale),Math.round(rect.y/scale),out.width,out.height,0,0,out.width,out.height);
      const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error("Création de l’image rognée impossible.")),"image/png"));
      if(!classe)throw new Error("Aucune classe n’est sélectionnée.");
      const path=`${classe}/images/${Date.now()}-rognee.png`;
      const{error}=await sb.storage.from("documents").upload(path,blob,{contentType:"image/png",upsert:false});
      if(error)throw new Error(error.message);
      const{data}=sb.storage.from("documents").getPublicUrl(path);
      if(!data?.publicUrl)throw new Error("URL publique de l’image indisponible.");
      img.src=data.publicUrl;img.style.width=out.width+"px";img.style.height=out.height+"px";selectedRichImage=img;
      scheduleAutosave();overlay.remove();

function existingPdf(url,labelText){
  if(!url)return"";
  return`<div class="pdf-existing"><strong>📄 ${esc(labelText)} déjà enregistré</strong><div class="pdf-actions"><a class="btn pdf-ok" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le PDF</a><button type="button" class="danger" onclick="clearPdf(this)">Retirer le PDF</button></div></div>`;
}
function pdfField(labelText,kind,id,url){
  return`<div class="pdf-box" data-current-url="${esc(url)}">${existingPdf(url,labelText)}<label>${url?"Remplacer le PDF de "+labelText.toLowerCase():"PDF de "+labelText+" (facultatif)"}</label><input class="${esc(kind)}" type="file" accept="application/pdf" onchange="uploadPdf(this,'${esc(kind)}','${esc(id)}')"><span class="status"></span></div>`;

async function clearPdf(button){
  const box=button.closest(".pdf-box");
  if(!box)return;

  const oldUrl=
    box.dataset.currentUrl ||
    box.querySelector('input[type=file]')?.dataset?.url ||
    "";

  if(!oldUrl){
    box.dataset.currentUrl="";
    button.closest(".pdf-existing")?.remove();
    scheduleAutosave();
    return;
  }

  if(!confirm("Supprimer définitivement ce PDF ?"))return;

  try{
    const marker="/storage/v1/object/public/documents/";
    const pos=oldUrl.indexOf(marker);

    if(pos===-1){
      throw new Error("Impossible de déterminer le fichier PDF à supprimer.");
    }

    const path=decodeURIComponent(
      oldUrl.slice(pos+marker.length)
    );

    const {error}=await sb.storage
      .from("documents")
      .remove([path]);

    if(error)throw new Error(error.message);

    box.dataset.currentUrl="";

    const input=box.querySelector('input[type=file]');
    if(input){
      input.value="";
      delete input.dataset.url;
    }

    button.closest(".pdf-existing")?.remove();

    clearTimeout(autosaveTimer);
    await runAutosave();

  }catch(e){
    alert("Suppression du PDF impossible : "+e.message);
  }
}

async function init(){
  buildQuickNav();

  /*
    On installe le listener AUTH AVANT de vérifier
    la session existante.
    
    Ainsi, il fonctionne aussi lorsque l'utilisateur
    arrive sur la page sans être encore connecté.
  */
  sb.auth.onAuthStateChange(async(event,session)=>{
    console.log("AUTH EVENT :",event);

    user=session?.user ?? null;

    if(event==="SIGNED_OUT" || !user){
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    /*
      L'utilisateur vient de se connecter.
      On affiche immédiatement l'espace professeur.
    */
    logoutBtn.classList.remove("hidden");
    globalHome?.classList.add("show");

    if(event==="SIGNED_IN"){
      setTimeout(()=>{
        restoreLastPosition().catch(e=>{
          console.error(
            "Restauration après connexion impossible :",
            e
          );
        });
      },0);
    }
  });

  /*
    Vérification de la session déjà existante.
  */
  try{
    const {data,error}=await sb.auth.getSession();

    if(error){
      console.error(
        "Erreur de session :",
        error
      );

      user=null;
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    user=data?.session?.user ?? null;

    if(!user){
      logoutBtn.classList.add("hidden");
      globalHome?.classList.remove("show");
      login();
      return;
    }

    /*
      Session déjà présente :
      on ouvre directement l'espace professeur.
    */
    logoutBtn.classList.remove("hidden");
    globalHome?.classList.add("show");

    await restoreLastPosition();

  }catch(error){

    console.error(
      "Initialisation impossible :",
      error
    );

    user=null;
    logoutBtn.classList.add("hidden");
    globalHome?.classList.remove("show");
    login();
  }
}

async function doLogin(){

      await sb.auth.signInWithPassword({

    /*
      Sécurité supplémentaire :
      même si l'événement SIGNED_IN tarde à être traité,
      on ouvre l'espace professeur directement.
    */
    user=data?.user ?? null;

    if(!user){
      throw new Error(
        "Connexion réussie mais utilisateur non récupéré."
      );
    }

    if(status){
      status.textContent="Connexion réussie ✓";
    }

    logoutBtn?.classList.remove("hidden");
    globalHome?.classList.add("show");

    await restoreLastPosition();

  }catch(e){

    console.error(
      "Erreur de connexion :",
      e
    );

    if(status){
      status.textContent=
        "Connexion impossible : " +
        e.message;
    }

  }finally{

    if(button){
      button.disabled=false;
    }
  }
}

async function deleteChapterFromList(index){
  try{
    if(await flushPendingAutosave()===false)return;
    if(!currentClassData?.contenu?.chapitres)throw new Error("Le cahier n'est pas chargé.");
    const chapter=currentClassData.contenu.chapitres[index];
    if(!chapter)return;
    const title=stripHtml(chapter.titre||`Chapitre ${index+1}`);
    if(!confirm(`Supprimer définitivement « ${title} » et tout son contenu ? Cette action est irréversible.`))return;
    currentClassData.contenu.chapitres.splice(index,1);
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
    currentChapterIndex=-1;saveNav();await chapters();
  }catch(e){alert("Impossible de supprimer le chapitre : "+e.message)}
}

async function moveChapter(index,direction){
  try{
    if(await flushPendingAutosave()===false)return;
    if(!currentClassData?.contenu?.chapitres)throw new Error("Le cahier n'est pas chargé.");
    const chapters=currentClassData.contenu.chapitres;
    const target=index+direction;
    if(index<0||index>=chapters.length||target<0||target>=chapters.length)return;
    [chapters[index],chapters[target]]=[chapters[target],chapters[index]];
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
    await chaptersViewRefresh();
  }catch(e){alert("Impossible de déplacer le chapitre : "+e.message)}
}

async function duplicateChapter(i){
  try{
    if(!currentClassData)throw new Error("Le cahier n'est pas chargé.");
    // Si le chapitre est ouvert, enregistrer d'abord son état réel dans l'éditeur.
    if(currentChapterIndex===i && document.getElementById("chTitre")){
      const saved=await saveChapter(i);
      if(saved!==true)return;
    }
    const original=currentClassData.contenu.chapitres[i];
    if(!original)throw new Error("Ce chapitre est introuvable.");
    const copy=JSON.parse(JSON.stringify(normalizeChapter(original)));
    copy.titre=(copy.titre||"Nouveau chapitre")+" (copie)";
    currentClassData.contenu.chapitres.splice(i+1,0,normalizeChapter(copy));
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
    currentChapterIndex=i+1;saveNav();editChapter(i+1);
  }catch(e){alert("Duplication du chapitre impossible : "+e.message)}
}
async function duplicateSession(n){
  const i=currentChapterIndex;
  if(i<0||!currentClassData)return;
  try{
    const saved=await saveChapter(i);if(saved!==true)return;
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);
    if(!ch.seances[n])throw new Error("Cette séance est introuvable.");
    const copy=JSON.parse(JSON.stringify(normalizeSession(ch.seances[n])));
    copy.titre=(copy.titre||`Séance ${n+1}`)+" (copie)";
    ch.seances.splice(n+1,0,normalizeSession(copy));
    currentClassData.contenu.chapitres[i]=ch;
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
    currentChapterIndex=i;saveNav();editChapter(i);
  }catch(e){alert("Duplication de la séance impossible : "+e.message)}
}
async function duplicateEntry(button){
  const entry=button.closest(".entry"),sessionBox=button.closest(".session-box");
  const type=entry?.dataset?.entryType;
  const i=currentChapterIndex;
  if(!entry||!sessionBox||i<0||!currentClassData)return;
  try{
    const sessionIndex=[...document.querySelectorAll("#sessions .session-box")].indexOf(sessionBox);
    const entryIndex=[...entry.parentElement.querySelectorAll(":scope > .entry")].indexOf(entry);
    if(sessionIndex<0||entryIndex<0)throw new Error("L'entrée à dupliquer est introuvable.");
    const saved=await saveChapter(i);if(saved!==true)return;
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);
    const s=ch.seances[sessionIndex];
    const key=({activite:"activites",correction:"corrections",bilan:"bilans"})[type];
    if(!key||!s?.[key]?.[entryIndex])throw new Error("Les données de cette entrée sont introuvables.");
    const copy=JSON.parse(JSON.stringify(normalizeEntry(s[key][entryIndex])));
    s[key].splice(entryIndex+1,0,copy);
    currentClassData.contenu.chapitres[i]=ch;
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
    currentChapterIndex=i;saveNav();editChapter(i);
  }catch(e){alert("Duplication de l'entrée impossible : "+e.message)}
}

async function moveSession(n,direction){
  const i=currentChapterIndex;

    const saved=await saveChapter(i);

    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);

async function uploadSchemaImage(chapterIndex){
  const picker=document.createElement("input");picker.type="file";picker.accept="image/png,image/jpeg,image/webp";picker.style.display="none";document.body.appendChild(picker);
  picker.onchange=async()=>{
    const file=picker.files?.[0];if(!file){picker.remove();return;}
    if(!["image/png","image/jpeg","image/webp"].includes(file.type)){alert("Choisis une image PNG, JPG ou WEBP.");picker.remove();return;}
    if(file.size>5*1024*1024){alert("L’image ne doit pas dépasser 5 Mo.");picker.remove();return;}
    const status=document.getElementById("schemaImageStatus");if(status)status.textContent="Envoi de l’image…";
    try{
      if(!classe||!currentClassData)throw new Error("Aucune classe n’est sélectionnée.");
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-100)||"schema-bilan";
      const path=`${classe}/schemas/${Date.now()}-${safeName}`;
      const{error}=await sb.storage.from("documents").upload(path,file,{contentType:file.type,upsert:false});if(error)throw new Error(error.message);
      const{data}=sb.storage.from("documents").getPublicUrl(path);if(!data?.publicUrl)throw new Error("URL publique de l’image indisponible.");
      const alt=prompt("Description du schéma (facultatif) :", "Schéma-bilan du chapitre")||"Schéma-bilan du chapitre";
      const ch=normalizeChapter(currentClassData.contenu.chapitres[chapterIndex]);
      ch.schema=`<p><img src="${esc(data.publicUrl)}" alt="${esc(alt.slice(0,300))}" style="max-width:100%;height:auto"></p>`;
      currentClassData.contenu.chapitres[chapterIndex]=ch;
      currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);
      if(status)status.textContent="Image enregistrée ✓";
      editChapter(chapterIndex);
    }catch(e){if(status)status.textContent="Erreur : "+e.message;alert("Importation de l’image impossible : "+e.message)}
    finally{picker.remove();}
  };
  picker.click();
}
async function removeSchemaImage(chapterIndex){

 for(const item of recent){const r=results.find(x=>x.c===item.c&&x.data);const resolved=r&&svtResolveRecent(item,r.data);if(resolved)entries.push(resolved);if(entries.length===5)break}
 const warning=results.some(x=>x.error)?'<p class="svt-note">Certains cahiers n’ont pas pu être chargés. L’historique affiché peut être incomplet.</p>':'';
 list.innerHTML=warning+(entries.length?entries.map((o,k)=>`<button type="button" class="svt-session" data-recent-index="${k}"><img class="svt-thumb" src="${esc(svtRecentThumbnail(o.se))}" alt="" loading="lazy"><span class="svt-recent-copy">${esc(o.t||'Séance')}<small>${esc(o.c)} · ${esc(o.ch)}</small><time datetime="${new Date(o.at).toISOString()}">Consultée le ${new Date(o.at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</time></span><span aria-hidden="true">›</span></button>`).join(''):'<div class="svt-empty">Aucune séance consultée pour le moment.<br>Ouvre un chapitre et clique dans une séance : elle apparaîtra ici.</div>');
 list.querySelectorAll('[data-recent-index]').forEach(button=>button.addEventListener('click',()=>svtOpenRecent(entries[Number(button.dataset.recentIndex)])));
 list.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.src=svtBotanicalImage()},{once:true}));
}
async function svtOpenRecent(item){
 if(!requireTeacher()||!item)return;
 if(await flushPendingAutosave()===false)return;
 try{
 const data=await loadClass(item.c);const resolved=svtResolveRecent(item,data);
 if(!resolved){alert('Cette séance a été renommée, déplacée dans un autre chapitre ou supprimée. Retrouve-la depuis son cahier.');return}
 niveau=Object.keys(CLASSES).find(n=>CLASSES[n].includes(item.c));if(!niveau)return;
 classe=item.c;currentClassData=data;currentChapterIndex=-1;label.textContent='Éditeur · '+classe;updateQuickNav();editChapter(resolved.i);
 const box=document.querySelectorAll('#sessions > .session-box')[resolved.j];
 if(box){svtRecordSession(box);box.classList.add('svt-session-target');box.tabIndex=-1;requestAnimationFrame(()=>{box.focus({preventScroll:true});box.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});setTimeout(()=>box.classList.remove('svt-session-target'),2500)}
 }catch(e){alert('Ouverture de la séance impossible : '+e.message)}
}
['pointerdown','focusin','input'].forEach(type=>document.addEventListener(type,e=>{
 const box=e.target.closest?.('#sessions > .session-box');if(!box)return;
 if(type==='pointerdown'&&e.target.closest('button'))return;
 svtRecordSession(box);
}));
function svtIcon(kind){
 const paths={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',book:'<path d="M12 5v15M3 4q5-1 9 2 4-3 9-2v15q-5-1-9 2-4-3-9-2Z"/>',chart:'<path d="M4 3v17h17M9 16V9m5 7V5m5 11v-5"/>',leaf:'<path d="M4 20C2 7 11 3 21 3c0 12-6 18-17 17Zm0 0L17 7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 6"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
 return '<svg class="svt-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(paths[kind]||paths.book)+'</svg>';
}
function svtDecorateDashboard(d){
 const kinds=['home','book','chart','leaf','users'];d.querySelectorAll('.svt-side button').forEach((b,i)=>{const text=b.textContent.replace(/^[^A-Za-zÀ-ÿ]+/,'');b.innerHTML=svtIcon(kinds[i])+'<span>'+esc(text)+'</span>'});
 d.querySelectorAll('.svt-actions button').forEach((b,i)=>{const text=b.textContent.replace(/^[^A-Za-zÀ-ÿ]+/,'');b.innerHTML=svtIcon(['book','plus','chart','leaf'][i])+'<span>'+esc(text)+'</span>'});
}
const svtHeaderObserver=new ResizeObserver(()=>{document.documentElement.style.setProperty('--svt-header-height',document.querySelector('header').getBoundingClientRect().height+'px')});svtHeaderObserver.observe(document.querySelector('header'));

init();
</script>
