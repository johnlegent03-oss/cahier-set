<style>

.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bank-list{max-height:420px;overflow:auto}.bank-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #dce8e3;border-radius:11px;background:#fff;margin:7px 0}.bank-item-main{min-width:0}.bank-item-main strong{display:block}.bank-item-main span{font-size:12px;color:var(--muted)}.competency-picker{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:#f7fbf9;border:1px dashed #cfe2da;border-radius:12px;padding:11px;margin-bottom:12px}.student-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}.student-choice{text-align:left;padding:14px;background:#fff;border:1px solid var(--b);border-radius:13px;display:flex;flex-direction:column;align-items:stretch;min-width:0;width:100%;box-sizing:border-box;overflow:hidden}.student-choice label{display:block!important;width:100%!important;min-width:0!important;box-sizing:border-box}.student-choice strong{display:block!important;width:100%!important;min-width:0!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.3}.student-choice .small-note{display:block;width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere}.student-choice button{max-width:100%;white-space:normal}.student-choice:hover{border-color:#9fc6b8;background:#f8fcfa}@media(max-width:900px){.student-picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.student-picker-grid{grid-template-columns:1fr}}.bank-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.bank-grid{grid-template-columns:1fr}.competency-picker{grid-template-columns:1fr}}

<body>
<div id="printOverlay" aria-hidden="true"></div>
<header><div class="head">
  <div class="brand"><div class="logo">🧪</div><div><h1>Cahier numérique de SVT</h1><p id="label">Éditeur professeur</p></div></div>
  <button id="logoutBtn" class="hidden" onclick="logout()">Se déconnecter</button>
</div></header>
<button id="globalHome" class="global-home" type="button" onclick="home()">🏠 Accueil</button>
<select id="quickNav" class="quick-nav" aria-label="Accès rapide" onchange="quickNavigate(this.value)"><option value="home">🏠 Accueil</option></select>
<main id="content"></main>
<footer>Éditeur professeur · les modifications sont enregistrées dans Supabase.</footer>

<script src="config.js"></script>
<script>
function getMasteryFromValidatedCriteria(validatedCount){
  const n=Number(validatedCount)||0;
  if(n>=4)return {code:"TBM",label:"Très bonne maîtrise",cls:"tbm"};
  if(n===3)return {code:"MS",label:"Maîtrise satisfaisante",cls:"ms"};
  if(n===2)return {code:"MF",label:"Maîtrise fragile",cls:"mf"};
  return {code:"MI",label:"Maîtrise insuffisante",cls:"mi"};
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const CLASSES={"6e":["6e1","6e2","6e3","6e4","6e5"],"5e":["5e1","5e3","5e5"],"3e":["3e2","3e3"]};
const content=document.getElementById("content"),label=document.getElementById("label"),logoutBtn=document.getElementById("logoutBtn"),globalHome=document.getElementById("globalHome");
let niveau=null,classe=null,user=null,currentClassData=null,currentChapterIndex=-1;
let autosaveTimer=null,autosaveRunning=false,autosaveAgain=false;
let currentCorrectionEvaluation=null;
const richRanges={};
const NAV_KEY="cahierSVT.prof.navigation.v2";
const EVAL_NAV_KEY="cahierSVT.prof.evaluations.navigation.v1";

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const safe=v=>v==null?"":String(v);
function empty(){return{chapitres:[]}}

function normalizeEntry(e){
  const x=e&&typeof e==="object"?e:{};
  return{date:safe(x.date||x.jour||x.datee),texte:safe(x.texte||x.text||x.contenu||x.html),pdf:safe(x.pdf||x.pdfUrl||x.document)};
}
function legacyEntries(text,pdf){
  const t=safe(text),p=safe(pdf);
  return t||p?[{date:"",texte:t,pdf:p}]:[];
}
function normalizeSession(s){
  const x=s&&typeof s==="object"?s:{};
  const activites=Array.isArray(x.activites)?x.activites.map(normalizeEntry).filter(e=>e.date||e.texte||e.pdf):legacyEntries(x.activite||x.activity,x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document);
  const corrections=Array.isArray(x.corrections)?x.corrections.map(normalizeEntry).filter(e=>e.date||e.pdf):legacyEntries("",x.pdfCorrection||x.pdf_correction||x.correctionPdf);
  const bilans=Array.isArray(x.bilans)?x.bilans.map(normalizeEntry).filter(e=>e.date||e.texte||e.pdf):legacyEntries(x.bilan,"");
  return{titre:safe(x.titre||x.title||"Séance"),problematique:safe(x.problematique||x.probleme||x.problem),activites,corrections,bilans,activite:safe(x.activite||x.activity),correction:safe(x.correction),bilan:safe(x.bilan),pdfActivite:safe(x.pdfActivite||x.pdf_activite||x.activityPdf||x.pdf||x.document),pdfCorrection:safe(x.pdfCorrection||x.pdf_correction||x.correctionPdf)};
}
function normalizeChapter(ch){
  const x=ch&&typeof ch==="object"?ch:{},raw=Array.isArray(x.seances)?x.seances:(Array.isArray(x.sessions)?x.sessions:[]);
  return{titre:safe(x.titre||x.title||"Nouveau chapitre"),germoir:safe(x.germoir||x.germoirIdees),germoirPdf:safe(x.germoirPdf||x.germoir_pdf),problematique:safe(x.problematique||x.probleme||x.problem),seances:raw.filter(Boolean).map(normalizeSession),schema:safe(x.schema||x.schemaBilan||x.schema_bilan),schemaPdf:safe(x.schemaPdf||x.schema_pdf),memo:safe(x.memo||x.memorisation||x.ficheMemo),memoPdf:safe(x.memoPdf||x.memo_pdf),evaluationPdf:safe(x.evaluationPdf||x.evaluation_pdf||x.evalPdf||x.pdfEvaluation)};
}
function normalizeCahier(raw){
  let x=raw;if(!x||typeof x!=="object")x={};if(Array.isArray(x))x={chapitres:x};if(!Array.isArray(x.chapitres))x.chapitres=[];x.chapitres=x.chapitres.map(normalizeChapter);return x;
}

async function loadClass(c){
  const{data,error}=await sb.from("Cahier").select("id,classe,contenu").eq("classe",c).maybeSingle();
  if(error)throw new Error(error.message);return{id:data?.id||null,contenu:normalizeCahier(data?.contenu)};
}
async function saveClass(c,contenu,id){
  let r;
  if(id){r=await sb.from("Cahier").update({contenu}).eq("id",id);if(r.error)throw new Error(r.error.message);return id;}
  r=await sb.from("Cahier").insert({classe:c,contenu}).select("id").maybeSingle();if(r.error)throw new Error(r.error.message);return r.data?.id||null;
}

function saveNav(){
  try{localStorage.setItem(NAV_KEY,JSON.stringify({niveau,classe,currentChapterIndex,view:currentChapterIndex>=0?"chapter":(classe?"chapters":(niveau?"classes":"home"))}))}catch(e){}
}

   MODULE ÉVALUATIONS / CORRECTIONS — V1
   Les données de correction utilisent des tables Supabase
   séparées du cahier. L'interface reste uniquement dans
   prof.html : aucune donnée n'est exposée à l'interface élève.

let evaluationsCache=[];

function isHistoricalEvaluation(e){
  return !!(e && Array.isArray(e.exercices) && e.exercices.some(x=>x&&x.historique===true));
}
function historicalMeta(e){
  const x=(Array.isArray(e?.exercices)?e.exercices:[]).find(v=>v&&v.historique===true)||{};
  return {
    date:x.date||e?.created_at||null,
    competence:safe(x.competence||"Compétence non renseignée")
  };
}

function evalNormalize(e){
  const x=e&&typeof e==="object"?e:{};
  return {
    id:x.id||null,
    titre:safe(x.titre||"Nouvelle évaluation"),
    classe:safe(x.classe||""),
    total:Number(x.total||0),
    competences:Array.isArray(x.competences)?x.competences:[],
    criteres:Array.isArray(x.criteres)?x.criteres:[],
    exercices:Array.isArray(x.exercices)?x.exercices:[],
    folderId:(Array.isArray(x.exercices)?(x.exercices.find(v=>v&&v.__evaluationMeta)?.folderId||""):""),
    created_at:x.created_at||null
  };
}

function criterionDefaults(){
  return [
    {id:"c1",nom:"Choix adaptés",indicateurs:[]},
    {id:"c2",nom:"Qualité du travail",indicateurs:[]},
    {id:"c3",nom:"Travail complet",indicateurs:[]},
    {id:"c4",nom:"Respect des consignes",indicateurs:[]}
  ];
}

function normalizeCriteria(ev){
  let crits=Array.isArray(ev.criteres)?ev.criteres:[];
  if(!crits.length) crits=criterionDefaults();
  return crits.map((c,i)=>({
    id:safe(c.id)||`c${i+1}`,
    nom:safe(c.nom)||`Critère ${i+1}`,
    competenceId:safe(c.competenceId||"comp1"),
    competenceNom:safe(c.competenceNom||""),
    indicateurs:Array.isArray(c.indicateurs)?c.indicateurs:[]
  }));
}

function criteriaFromLegacy(ev){
  // Migration douce de la V1 : les anciens éléments/exercices sont convertis
  // en indicateurs rattachés à leur critère quand leur identifiant est connu.
  const crits=normalizeCriteria(ev);
  if(crits.some(c=>c.indicateurs.length)) return crits;
  const oldMap={choix:0,qualite:1,completude:2,consignes:3};
  const legacy=Array.isArray(ev.exercices)?ev.exercices:[];
  legacy.forEach(ex=>{
    (Array.isArray(ex.items)?ex.items:[]).forEach(it=>{
      const ids=Array.isArray(it.criteres)?it.criteres:[];
      const target=ids.map(id=>oldMap[id]).filter(i=>Number.isInteger(i));
      const indices=target.length?target:[0];
      indices.forEach((ci)=>{
        if(crits[ci]) crits[ci].indicateurs.push({nom:safe(it.nom),points:Number(it.points||0)});
      });
    });
  });
  return crits;
}

async function loadStudentTracking(){
  const {data,error}=await sb.from("EvaluationCorrections").select("id,evaluation_id,eleve,eleve_id,resultat,created_at").order("created_at",{ascending:true});
  if(error)throw new Error(error.message);
  if(!studentsCache.length){
    const {data:students,error:studentsError}=await sb.from("Eleves").select("id,classe,nom,prenom,created_at").order("nom").order("prenom");
    if(studentsError)throw new Error(studentsError.message);
    studentsCache=students||[];
  }
  const studentById=new Map(studentsCache.map(st=>[String(st.id),st]));
  const normalizeStudentName=(value)=>String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-']/g," ").replace(/\s+/g," ").trim().toLocaleLowerCase("fr");
  const studentAliases=new Map();
  studentsCache.forEach(st=>{
    const nom=safe(st?.nom||"").trim(), prenom=safe(st?.prenom||"").trim();
    const aliases=[`${nom} ${prenom}`,`${prenom} ${nom}`,nom,prenom].map(normalizeStudentName).filter(Boolean);
    aliases.forEach(a=>{if(a&&!studentAliases.has(a))studentAliases.set(a,st);});
  });
  const byId={};
  evaluationsCache.forEach(e=>byId[String(e.id)]=e);
  studentTrackingCache=(data||[]).map(c=>{
    let st=c.eleve_id?studentById.get(String(c.eleve_id)):null;
    const fallback=safe(c.eleve||"Élève").trim()||"Élève";
    if(!st){
      const evalClass=String(byId[String(c.evaluation_id)]?.classe||"").trim();
      const candidate=studentAliases.get(normalizeStudentName(fallback));
      if(candidate && (!evalClass || String(candidate.classe||"").trim()===evalClass)) st=candidate;
    }
    const nom=safe(st?.nom||"").trim();
    const prenom=safe(st?.prenom||"").trim();
    const display=nom ? `${nom} ${prenom}`.trim() : fallback;
    return {
      id:c.id,
      evaluationId:c.evaluation_id,
      eleve:display,
      eleveId:c.eleve_id||null,
      nom,
      prenom,
      sortKey:nom ? `${nom} ${prenom}`.toLocaleLowerCase("fr") : fallback.toLocaleLowerCase("fr"),
      resultat:c.resultat||{},
      created_at:c.created_at||null,
      evaluation:byId[String(c.evaluation_id)]||null
    };
  }).filter(x=>x.evaluation);
  return studentTrackingCache;
}

function trackingPeriodLabel(period){
  return period==="t1"?"Trimestre 1":period==="t2"?"Trimestre 2":period==="t3"?"Trimestre 3":"Année";
}
function trackingRecordDate(c){
  return isHistoricalEvaluation(c?.evaluation)?historicalMeta(c.evaluation).date:(c?.created_at||null);
}
function trackingScore20(c){
  const r=c?.resultat||{}, ev=c?.evaluation||{};
  const note=Number(r.note);
  if(!Number.isFinite(note))return null;
  const total=Number(ev.total||0);
  if(total>0)return note/total*20;
  return null;
}
function trackingNoteLabel(c){
  const r=c?.resultat||{}, ev=c?.evaluation||{};
  const note=Number(r.note);
  if(!Number.isFinite(note))return "—";
  const total=Number(ev.total||0);
  return total>0 ? `${note} / ${total}` : `${note}`;
}
function formatAverage20(values){
  const nums=values.filter(v=>Number.isFinite(v));
  if(!nums.length)return "—";
  const avg=nums.reduce((a,b)=>a+b,0)/nums.length;
  return `${avg.toFixed(2).replace(".",",")} / 20`;
}
function normalizeTrackingDate(dateValue){
  if(!dateValue)return null;
  const s=String(dateValue).trim();
  const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(m){
    const dd=String(m[1]).padStart(2,"0"),mm=String(m[2]).padStart(2,"0"),yyyy=m[3];
    return `${yyyy}-${mm}-${dd}T12:00:00`;
  }
  return s;
}
function trackingPeriodMatch(dateValue,period){
  if(period==="year")return true;
  if(!dateValue)return false;
  const d=new Date(normalizeTrackingDate(dateValue));
  if(Number.isNaN(d.getTime()))return false;
  const m=d.getMonth()+1;
  if(period==="t1")return m>=9&&m<=12;
  if(period==="t2")return m>=1&&m<=3;
  if(period==="t3")return m>=4&&m<=7;
  return true;
}
function trackingDate(dateValue){
  if(!dateValue)return "Date non renseignée";
  const d=new Date(normalizeTrackingDate(dateValue));
  if(Number.isNaN(d.getTime()))return "Date non renseignée";
  return d.toLocaleDateString("fr-FR");
}
function trackingRows(){
  return studentTrackingCache.filter(c=>{
    const cls=c.evaluation?.classe||"";
    const date=trackingRecordDate(c);
    return (!studentTrackingClass||cls===studentTrackingClass)
      &&(!studentTrackingStudent||c.eleve===studentTrackingStudent)
      &&trackingPeriodMatch(date,studentTrackingPeriod);
  }).sort((a,b)=>{
    const ad=trackingRecordDate(a),bd=trackingRecordDate(b);
    const da=ad?new Date(ad).getTime():0,db=bd?new Date(bd).getTime():0;
    return da-db;
  });
}
function trackingStudents(){
  const out=new Map();
  const targetClass=String(studentTrackingClass||"").trim();
  studentsCache.filter(s=>!targetClass||String(s.classe||"").trim()===targetClass).forEach(s=>{
    const display=studentDisplayName(s);
    if(display)out.set(String(s.id),display);
  });
  studentTrackingCache.filter(c=>!targetClass||String(c.evaluation?.classe||"").trim()===targetClass).forEach(c=>{
    const key=c.eleveId?String(c.eleveId):`legacy:${normalizeTrackingStudentName(c.eleve)}`;
    if(!out.has(key))out.set(key,c.eleve);
  });
  behaviorEventsCache.filter(e=>!targetClass||String(e.classe||"").trim()===targetClass).forEach(e=>{
    const key=`behavior:${normalizeTrackingStudentName(e.student)}`;
    if(!out.has(key))out.set(key,e.student);
  });
  return [...out.values()].sort((a,b)=>a.localeCompare(b,"fr",{numeric:true,sensitivity:"base"}));
}
function normalizeTrackingStudentName(value){
  return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-']/g," ").replace(/\s+/g," ").trim().toLocaleLowerCase("fr");
}
function trackingCompetencyRows(rows){
  const out=[];
  rows.forEach(c=>{
    const ev=c.evaluation, stats=c.resultat?.criteriaStats||{};
    if(isHistoricalEvaluation(ev)){
      const meta=historicalMeta(ev);
      const masteryCode=c.resultat?.masteryCode||"";
      const mastery=masteryCode?getMasteryByCode(masteryCode):null;
      if(mastery){
        out.push({date:meta.date,evaluation:ev.titre,competence:meta.competence||"Compétence non renseignée",validated:null,total:null,mastery});
      }
      return;
    }
    const crits=criteriaFromLegacy(ev), groups={};
    crits.forEach(cr=>{
      const gid=cr.competenceId||"comp1";
      if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",total:0,validated:0};
      groups[gid].total++;
      if(stats[cr.id]?.validated)groups[gid].validated++;
    });
    Object.values(groups).forEach(g=>{
      const mastery=getMasteryFromValidatedCriteria(g.validated);
      out.push({date:c.created_at,evaluation:ev.titre,competence:g.nom,validated:g.validated,total:g.total,mastery});

  });

}
function masteryValue(code){
  return ({TBM:4,MS:3,MF:2,MI:1})[String(code||"").toUpperCase()]||null;
}
function masteryFromAverage(value){
  const n=Number(value);
  if(!Number.isFinite(n))return null;
  if(n>=3.5)return getMasteryByCode("TBM");
  if(n>=2.5)return getMasteryByCode("MS");
  if(n>=1.5)return getMasteryByCode("MF");
  return getMasteryByCode("MI");
}
function formatMasteryAverage(value){
  const n=Number(value);
  return Number.isFinite(n)?`${n.toFixed(2).replace(".",",")} / 4`:"—";
}
function trackingSummary(rows){
  const total=rows.length;
  const competencies=trackingCompetencyRows(rows);
  const counts={TBM:0,MS:0,MF:0,MI:0};
  competencies.forEach(x=>counts[x.mastery.code]=(counts[x.mastery.code]||0)+1);
  const byComp={};
  competencies.forEach(x=>{
    const key=String(x.competence||"Compétence non renseignée");
    if(!byComp[key])byComp[key]=[];
    byComp[key].push(x);
  });
  const competencySummaries=Object.entries(byComp).map(([competence,items])=>{
    const values=items.map(x=>masteryValue(x.mastery?.code)).filter(Number.isFinite);
    const average=values.length?values.reduce((a,b)=>a+b,0)/values.length:null;
    const ordered=[...items].sort((a,b)=>{
      const da=a.date?new Date(normalizeTrackingDate(a.date)).getTime():0;
      const db=b.date?new Date(normalizeTrackingDate(b.date)).getTime():0;
      return da-db;
    });
    const latest=ordered[ordered.length-1]||items[items.length-1];
    return {competence,evaluations:items.length,average,averageMastery:masteryFromAverage(average),latest};
  }).sort((a,b)=>a.competence.localeCompare(b.competence,"fr"));
  return {total,competencies,counts,competencySummaries};
}

    if(!byStudent[studentKey])byStudent[studentKey]={name,sortKey:c.sortKey||name.toLocaleLowerCase("fr"),evaluations:[],competencies:[]};
    byStudent[studentKey].evaluations.push(c);
    const stats=c.resultat?.criteriaStats||{};

      const meta=historicalMeta(c.evaluation);
      const mastery=getMasteryByCode(c.resultat?.masteryCode||"");
      if(mastery){
        byStudent[studentKey].competencies.push({competence:meta.competence||"Compétence non renseignée",validated:null,total:null,mastery});
      }
    }else{
      const crits=criteriaFromLegacy(c.evaluation),groups={};
      crits.forEach(cr=>{
        const gid=cr.competenceId||"comp1";
        if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",total:0,validated:0};
        groups[gid].total++;
        if(stats[cr.id]?.validated)groups[gid].validated++;
      });
      Object.values(groups).forEach(g=>{

          competence:g.nom,

    const ak=(a.sortKey||a.name||"").toLocaleLowerCase("fr");

function flattenIndicators(ev){
  const crits=criteriaFromLegacy(ev),items=[];
  crits.forEach((c,ci)=>{
    (c.indicateurs||[]).forEach((it,ii)=>items.push({criterionId:c.id,ci,ii,nom:safe(it.nom),points:Number(it.points||0)}));
  });
  return {crits,items};
}

async function loadEvaluations(){
  const {data,error}=await sb.from("Evaluations")
    .select("id,titre,classe,total,criteres,exercices,created_at")
    .order("created_at",{ascending:false});
  if(error)throw new Error(error.message);
  return (data||[]).map(evalNormalize);
}

async function saveEvaluationObject(ev){
  const flatCriteres=(ev.competences&&ev.competences.length)
    ? ev.competences.flatMap(comp=>(comp.criteres||[]).map(cr=>({...cr,competenceId:comp.id,competenceNom:comp.nom})))
    : (ev.criteres||[]);
  const existingExercises=Array.isArray(ev.exercices)?ev.exercices.filter(x=>!(x&&x.__evaluationMeta)):[];
  const meta={__evaluationMeta:true,folderId:ev.folderId||""};
  const payload={
    titre:ev.titre,classe:ev.classe,total:Number(ev.total||0),
    criteres:flatCriteres,exercices:[meta,...existingExercises]
  };
  if(ev.id){
    const {data,error}=await sb.from("Evaluations").update(payload).eq("id",ev.id).select().maybeSingle();
    if(error)throw new Error(error.message);
    return evalNormalize(data);
  }
  const {data,error}=await sb.from("Evaluations").insert(payload).select().maybeSingle();
  if(error)throw new Error(error.message);
  return evalNormalize(data);
}


const EVAL_FOLDERS_KEY="cahierSVT.evaluationFolders.v1";
function loadEvaluationFolders(){
  try{
    const a=JSON.parse(localStorage.getItem(EVAL_FOLDERS_KEY)||"[]");
    return Array.isArray(a)?a.filter(x=>x&&x.id&&x.nom):[];
  }catch(e){return []}
}
function saveEvaluationFolders(folders){
  try{localStorage.setItem(EVAL_FOLDERS_KEY,JSON.stringify(folders));}catch(e){}
}
function ensureFolderId(){
  const folders=loadEvaluationFolders();
  if(!folders.length){const f={id:"folder_general",nom:"Général"};folders.push(f);saveEvaluationFolders(folders);return f.id;}
  return folders[0].id;
}
function folderName(id){
  const f=loadEvaluationFolders().find(x=>String(x.id)===String(id));
  return f?.nom||"Sans dossier";
}
function createEvaluationFolder(){
  const nom=prompt("Nom du dossier :","");
  if(nom===null||!nom.trim())return;
  const folders=loadEvaluationFolders();
  const f={id:"folder_"+Date.now(),nom:nom.trim()};
  folders.push(f);saveEvaluationFolders(folders);openEvaluations();
}
function renameEvaluationFolder(id){
  const folders=loadEvaluationFolders(),f=folders.find(x=>x.id===id);if(!f)return;
  const nom=prompt("Nouveau nom du dossier :",f.nom);
  if(nom===null||!nom.trim())return;
  f.nom=nom.trim();saveEvaluationFolders(folders);openEvaluations();
}
async function deleteEvaluationFolder(id){
  const folders=loadEvaluationFolders();
  if(folders.length<=1){alert("Il doit rester au moins un dossier.");return;}
  const f=folders.find(x=>x.id===id);if(!f)return;
  const target=folders.find(x=>x.id!==id);
  if(!confirm(`Supprimer le dossier « ${f.nom} » ?\n\nLes évaluations seront déplacées dans « ${target.nom} ».`))return;
  evaluationsCache.forEach(e=>{if(e.folderId===id)e.folderId=target.id;});
  for(const e of evaluationsCache.filter(x=>x.folderId===target.id)){
    try{await saveEvaluationObject(e);}catch(err){alert("Déplacement impossible : "+err.message);return;}
  }
  saveEvaluationFolders(folders.filter(x=>x.id!==id));
  await openEvaluations();
}
async function moveEvaluationToFolder(evalId){
  const ev=evaluationsCache.find(x=>String(x.id)===String(evalId));if(!ev)return;
  const folders=loadEvaluationFolders();
  if(folders.length<2){alert("Crée d'abord au moins deux dossiers.");return;}
  const choices=folders.map((f,i)=>`${i+1}. ${f.nom}`).join("\n");
  const answer=prompt(`Déplacer « ${ev.titre} » vers quel dossier ?\n\n${choices}\n\nEntre le numéro :`,String(Math.max(1,folders.findIndex(f=>f.id===ev.folderId)+1)));
  if(answer===null)return;
  const n=Number(answer),f=folders[n-1];if(!f){alert("Numéro de dossier invalide.");return;}
  try{ev.folderId=f.id;const saved=await saveEvaluationObject(ev);const i=evaluationsCache.findIndex(x=>x.id===ev.id);if(i>=0)evaluationsCache[i]=saved;await openEvaluations();}catch(e){alert("Déplacement impossible : "+e.message)}
}
function evaluationFolderGroups(){
  const folders=loadEvaluationFolders();
  if(!folders.length){ensureFolderId();return evaluationFolderGroups();}
  const used=new Set(folders.map(f=>f.id));
  const groups=folders.map(f=>({folder:f,items:evaluationsCache.filter(e=>(e.folderId||folders[0].id)===f.id)}));
  const orphan=evaluationsCache.filter(e=>e.folderId&&!used.has(e.folderId));
  if(orphan.length)groups[0].items.push(...orphan);
  return groups;
}

async function getEvaluationById(evalId){
  const cached=evaluationsCache.find(x=>String(x.id)===String(evalId));
  if(cached)return cached;
  const {data,error}=await sb.from("Evaluations").select("*").eq("id",evalId).maybeSingle();
  if(error)throw new Error(error.message);
  if(!data)return null;
  const ev=evalNormalize(data);
  const idx=evaluationsCache.findIndex(x=>String(x.id)===String(evalId));
  if(idx>=0)evaluationsCache[idx]=ev;else evaluationsCache.push(ev);
  return ev;
}

async function deleteEvaluation(id){
  const ev=evaluationsCache.find(x=>String(x.id)===String(id));
  if(!ev)return;
  if(!confirm(`Supprimer l'évaluation « ${ev.titre||"Sans titre"} » ?\n\nLes corrections associées seront également supprimées.`))return;
  try{
    const {error:corrError}=await sb.from("EvaluationCorrections").delete().eq("evaluation_id",id);
    if(corrError)throw new Error(corrError.message);
    const {error:evalError}=await sb.from("Evaluations").delete().eq("id",id);
    if(evalError)throw new Error(evalError.message);
    evaluationsCache=evaluationsCache.filter(x=>String(x.id)!==String(id));
    await openEvaluations();
  }catch(e){
    alert("Suppression impossible : "+e.message);
  }
}

async function duplicateEvaluation(id){
  try{
    const cached=evaluationsCache.find(x=>String(x.id)===String(id));
    let ev=cached;
    if(!ev){
      const q=await sb.from("Evaluations").select("*").eq("id",id).maybeSingle();
      if(q.error)throw new Error(q.error.message);
      if(!q.data)throw new Error("Évaluation introuvable.");
      ev=evalNormalize(q.data);
    }

    const defaultTitle=(ev.titre||"Nouvelle évaluation")+" — Sujet 2";
    const title=prompt("Nom de la nouvelle évaluation / du sujet :",defaultTitle);
    if(title===null)return;
    const titre=title.trim()||defaultTitle;

    const copy={
      titre,
      classe:ev.classe||"",
      folderId:ev.folderId||ensureFolderId(),
      total:Number(ev.total||0),
      competences:Array.isArray(ev.competences)?JSON.parse(JSON.stringify(ev.competences)):[],
      criteres:Array.isArray(ev.criteres)?JSON.parse(JSON.stringify(ev.criteres)):[],
      exercices:Array.isArray(ev.exercices)?JSON.parse(JSON.stringify(ev.exercices)):[]
    };

    // New IDs are generated so the copy is an independent evaluation.
    delete copy.id;
    const saved=await saveEvaluationObject(copy);
    evaluationsCache.unshift(saved);

    alert("Évaluation dupliquée ✓\n\nLa structure, les compétences, les critères, les indicateurs et les points ont été copiés.\nLes corrections des élèves n'ont pas été copiées.");
    await openEvaluations();
  }catch(e){
    alert("Duplication impossible : "+e.message);
  }
}

async function editEvaluation(id){
  try{
    const cached=evaluationsCache.find(x=>String(x.id)===String(id));
    if(cached){editEvaluationObject(cached);return;}
    const {data,error}=await sb.from("Evaluations").select("*").eq("id",id).maybeSingle();
    if(error)throw new Error(error.message);
    if(!data)throw new Error("Évaluation introuvable.");
    editEvaluationObject(evalNormalize(data));
  }catch(e){alert("Impossible d'ouvrir l'évaluation : "+e.message)}
}

async function saveEvaluationFromEditor(id){
  if(window.__savingEvaluation)return;

  try{
    const btn=document.querySelector('#evalSaveStatus')?.parentElement?.querySelector('button.primary');
    if(btn)btn.disabled=true;
    const e=collectEvaluationEditor();e.id=id||null;
    const saved=await saveEvaluationObject(e);

    if(idx>=0)evaluationsCache[idx]=saved;else evaluationsCache.unshift(saved);
    const s=document.getElementById("evalSaveStatus");if(s)s.textContent="Enregistré ✓";

}

async function saveHistoricalResults(evalId){
  const btn=document.getElementById("saveHistoricalBtn");
  const status=document.getElementById("historicalSaveStatus");
  try{
    if(btn){btn.disabled=true;btn.textContent="⏳ Enregistrement…";}
    if(status)status.textContent="";

    const ev=evaluationsCache.find(x=>String(x.id)===String(evalId))||null;
    const q=ev?{data:ev,error:null}:await sb.from("Evaluations").select("*").eq("id",evalId).maybeSingle();
    if(q.error)throw new Error(q.error.message);
    if(!q.data)throw new Error("Évaluation introuvable.");
    const e=evalNormalize(q.data);

    await loadBanks();
    const students=studentsCache.filter(s=>!e.classe||s.classe===e.classe);
    const existing=await sb.from("EvaluationCorrections").select("id,eleve,eleve_id,resultat").eq("evaluation_id",evalId);
    if(existing.error)throw new Error(existing.error.message);
    const byId=new Map((existing.data||[]).filter(x=>x.eleve_id).map(x=>[String(x.eleve_id),x]));

    let savedCount=0;
    for(const s of students){
      const noteEl=document.getElementById(`histNote_${s.id}`);
      const masteryEl=document.getElementById(`histMastery_${s.id}`);
      const commentEl=document.getElementById(`histComment_${s.id}`);
      const noteRaw=noteEl?.value??"";
      const masteryCode=masteryEl?.value||"";
      const comment=commentEl?.value||"";
      if(noteRaw==="" && !masteryCode && !comment.trim())continue;

      const payload={
        evaluation_id:evalId,
        eleve:s.nom,
        eleve_id:s.id,
        resultat:{
          historique:true,
          note:Number(noteRaw||0),
          points:{},
          criteriaStats:{},
          masteryCode,
          commentaire:comment
        }
      };

      const old=byId.get(String(s.id));
      const r=old
        ? await sb.from("EvaluationCorrections").update(payload).eq("id",old.id)
        : await sb.from("EvaluationCorrections").insert(payload);
      if(r.error)throw new Error(`${s.nom} : ${r.error.message}`);
      savedCount++;
    }

    if(status){
      status.textContent=`✓ ${savedCount} résultat(s) enregistré(s) dans Supabase`;
      status.style.color="var(--ok,#1b7f4b)";
    }
    if(btn){btn.disabled=false;btn.textContent="💾 Enregistrer les résultats";}
  }catch(e){
    if(status){
      status.textContent="⚠️ Enregistrement impossible : "+e.message;
      status.style.color="var(--danger,#b42318)";
    }
    if(btn){btn.disabled=false;btn.textContent="💾 Enregistrer les résultats";}
  }
}

function studentDisplayName(s){
  const nom=String(s?.nom||"").trim();
  const prenom=String(s?.prenom||"").trim();
  return `${nom} ${prenom}`.trim() || String(s?.name||"Élève").trim();
}
function sortStudents(list){
  return [...list].sort((a,b)=>{
    const nomA=String(a?.nom||"").trim();
    const nomB=String(b?.nom||"").trim();
    const c=nomA.localeCompare(nomB,"fr",{numeric:true,sensitivity:"base"});
    if(c!==0)return c;
    return String(a?.prenom||"").trim().localeCompare(String(b?.prenom||"").trim(),"fr",{numeric:true,sensitivity:"base"});
  });
}

async function loadBanks(){
  const [st,co]=await Promise.all([
    sb.from("Eleves").select("id,classe,nom,prenom,created_at").order("classe").order("nom").order("prenom"),

  if(st.error)throw new Error(st.error.message);
  if(co.error)throw new Error(co.error.message);

function renderStudentBank(){
  const groups={};
  studentsCache.forEach(s=>(groups[s.classe]??=[]).push(s));
  const classes=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr",{numeric:true}));
  if(!classes.length)return `<p class="muted">Aucun élève enregistré.</p>`;
  return classes.map(cls=>{
    const students=sortStudents(groups[cls]);
    return `<div class="criteria-box"><strong>${esc(cls)}</strong>${students.map(s=>`<div class="bank-item"><div class="bank-item-main"><strong>${esc(studentDisplayName(s))}</strong></div><div class="bank-actions"><button onclick="editStudent('${esc(s.id)}')">✏️</button><button class="danger" onclick="deleteStudent('${esc(s.id)}','${esc(studentDisplayName(s))}')">🗑️</button></div></div>`).join("")}</div>`;
  }).join("");
}
function renderCompetencyBank(){
  const groups={};competenciesCache.forEach(c=>(groups[c.niveau||"Tous niveaux"]??=[]).push(c));
  const levels=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr"));
  if(!levels.length)return `<p class="muted">Aucune compétence enregistrée.</p>`;
  return levels.map(level=>`<div class="criteria-box"><strong>${esc(level)}</strong>${groups[level].map(c=>`<div class="bank-item"><div class="bank-item-main"><strong>${esc(c.nom)}</strong></div><div class="bank-actions"><button onclick="editCompetency('${esc(c.id)}')">✏️</button><button class="danger" onclick="deleteCompetency('${esc(c.id)}','${esc(c.nom)}')">🗑️</button></div></div>`).join("")}</div>`).join("");
}

function getMasteryByCode(code){
  const map={
    TBM:{code:"TBM",label:"Très bonne maîtrise",cls:"mastery-tbm"},
    MS:{code:"MS",label:"Maîtrise satisfaisante",cls:"mastery-ms"},
    MF:{code:"MF",label:"Maîtrise fragile",cls:"mastery-mf"},
    MI:{code:"MI",label:"Maîtrise insuffisante",cls:"mastery-mi"}
  };
  return map[code]||null;
}

function masteryLabelFromCount(validatedCount){
  return getMasteryFromValidatedCriteria(validatedCount);
}

function computeCorrection(ev){
  const checks=[...document.querySelectorAll(".correction-check")];
  let score=0;const points={};const criteriaStats={};
  checks.forEach(ch=>{
    const key=ch.dataset.key,p=Number(ch.dataset.points||0),cid=ch.dataset.criterion;
    if(ch.checked){score+=p;points[key]=true}
    if(cid){
      if(!criteriaStats[cid])criteriaStats[cid]={got:0,total:0,checked:0,validated:false};
      criteriaStats[cid].count=(criteriaStats[cid].count||0)+1;
      if(ch.checked){criteriaStats[cid].checked+=1;criteriaStats[cid].got+=p;}
    }
  });
  Object.values(criteriaStats).forEach(st=>{
    st.percent=st.count?Math.round(st.checked/st.count*100):0;
    // Rule: a criterion is validated when at least 2/3 of its indicators are checked.
    st.validated=st.count>0 && (st.checked/st.count)>=(2/3);
  });
  return {score,points,criteriaStats};
}

function refreshCorrectionScore(evalId){
  const ev=currentCorrectionEvaluation;
  if(!ev)return;
  const c=computeCorrection(ev),total=Number(ev.total||0),pct=total?Math.round(c.score/total*100):0;
  const score=document.getElementById("liveScore");if(score)score.textContent=`${c.score} / ${total}`;
  const p=document.getElementById("livePercent");if(p)p.textContent=`${pct}% du barème`;
  const crits=criteriaFromLegacy(ev), groups={};
  crits.forEach(cr=>{const gid=cr.competenceId||"comp1";if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",criteres:[]};groups[gid].criteres.push(cr)});
  const compRows=Object.values(groups).map(comp=>{
    const validated=comp.criteres.filter(cr=>!!c.criteriaStats[cr.id]?.validated).length;
    const mastery=masteryLabelFromCount(validated);
    return `<tr><td><strong>${esc(comp.nom)}</strong></td><td>${validated} / ${comp.criteres.length}</td><td><span class="mastery-result ${mastery.cls}">${mastery.code} — ${mastery.label}</span></td></tr>`;
  }).join("");
  const box=document.getElementById("masteryPreview");
  if(box)box.innerHTML=`<div class="criteria-box"><strong>📊 Maîtrise par compétence</strong><p class="small-note">La maîtrise est calculée séparément pour chaque compétence, selon le nombre de critères validés.</p><table class="mastery-table"><thead><tr><th>Compétence</th><th>Critères validés</th><th>Maîtrise</th></tr></thead><tbody>${compRows}</tbody></table></div>`;
  document.querySelectorAll(".criterion-auto-status").forEach(el=>{
    const cid=el.dataset.criterionStatus;
    const st=c.criteriaStats[cid]||{checked:0,count:0,percent:0,validated:false};
    el.innerHTML=st.count
      ? `<span class="small-note">${st.checked} / ${st.count} indicateur(s) coché(s) — ${st.percent}%</span> <strong>${st.validated?"✅ Critère validé":"❌ Critère non validé"}</strong>`
      : `<span class="small-note">Aucun indicateur</span>`;
  });
}

function correctionGridHtml(ev,c){
  const r=c?.resultat||{};
  const crits=criteriaFromLegacy(ev), groups={};
  crits.forEach(cr=>{
    const gid=cr.competenceId||"comp1";
    if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",criteres:[]};
    groups[gid].criteres.push(cr);
  });
  const escPrint=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  const total=Number(ev.total||0);
  const score=Number(r.note ?? r.score ?? 0);
  const pct=total?Math.round(score/total*100):0;
  let body=`<div class="print-page"><h1>Correction — ${escPrint(ev.titre||"Évaluation")}</h1><p><strong>${escPrint(c.eleve||"Élève")}</strong> — ${escPrint(ev.classe||"Classe")}</p><div class="result" style="border:1px solid #ccd5d1;padding:10px;margin:10px 0;font-size:14px"><strong>Note : ${score} / ${total} pt</strong> — ${pct}%</div>`;
  Object.values(groups).forEach((g,gi)=>{
    const validatedCount=g.criteres.filter(cr=>!!r.criteriaStats?.[cr.id]?.validated).length;
    const mastery=getMasteryFromValidatedCriteria(validatedCount);
    body+=`<section><h2>🎯 Compétence ${gi+1} — ${escPrint(g.nom)}</h2>`;
    g.criteres.forEach((cr,i)=>{
      const st=r.criteriaStats?.[cr.id]||{checked:0,count:0,percent:0,validated:false};
      const indicators=Array.isArray(cr.indicateurs)?cr.indicateurs:[];
      const earned=indicators.reduce((sum,it,ii)=>sum+(r.points?.[`${cr.id}_${ii}`]?Number(it.points||0):0),0);
      const possible=indicators.reduce((sum,it)=>sum+Number(it.points||0),0);
      body+=`<div class="criterion"><h3 style="margin:0 0 6px">Critère ${i+1} — ${escPrint(cr.nom)} <span style="float:right">${earned} / ${possible} pt</span></h3><p class="status"><strong>${st.validated?"✅ Critère validé":"❌ Critère non validé"}</strong> · ${st.checked||0} / ${st.count||0} indicateur(s) coché(s) — ${st.percent||0}%</p><ul>`;
      if(indicators.length){
        indicators.forEach((it,ii)=>{const checked=!!r.points?.[`${cr.id}_${ii}`];body+=`<li class="${checked?"checked":"unchecked"}">${checked?"✓":"✗"} ${escPrint(it.nom)} <span>${Number(it.points||0)} pt</span></li>`});
      }else body+='<li>Aucun indicateur.</li>';
      body+=`</ul></div>`;
    });
    body+=`<div class="mastery">Maîtrise de la compétence : <strong>${mastery.code} — ${escPrint(mastery.label)}</strong> (${validatedCount} / ${g.criteres.length} critère(s) validé(s))</div></section>`;
  });
  const comment=r.commentaire||"";
  body+=comment?`<div class="comment" style="border:1px solid #d8dfdc;padding:10px;margin-top:12px"><strong>Commentaire :</strong><br>${escPrint(comment)}</div>`:"";
  body+=`</div>`;
  return body;
}

async function generateCorrectionPDF(evalId){
  try{
    let ev=currentCorrectionEvaluation;
    if(!ev || String(ev.id)!==String(evalId)) ev=await getEvaluationById(evalId);
    if(!ev || String(ev.id)!==String(evalId)) throw new Error("Évaluation introuvable.");
    currentCorrectionEvaluation=ev;
    const c=computeCorrection(ev);
    const crits=criteriaFromLegacy(ev), groups={};
    crits.forEach(cr=>{const gid=cr.competenceId||"comp1";if(!groups[gid])groups[gid]={nom:cr.competenceNom||"Compétence évaluée",criteres:[]};groups[gid].criteres.push(cr)});
    const student=(document.querySelector('h2')?.textContent||"👤 Élève").replace(/^👤\s*/,"").trim();
    const comment=document.getElementById("corrComment")?.value||"";
    const total=Number(ev.total||0),pct=total?Math.round(c.score/total*100):0;
    const escPrint=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
    const masteryForComp=comp=>{const validated=comp.criteres.filter(cr=>!!c.criteriaStats[cr.id]?.validated).length;return {validated,mastery:getMasteryFromValidatedCriteria(validated)}};
    const compHtml=Object.values(groups).map((comp,ci)=>{
      const m=masteryForComp(comp);
      const criteriaHtml=comp.criteres.map((cr,i)=>{
        const st=c.criteriaStats[cr.id]||{checked:0,count:0,percent:0,validated:false};
        const indicators=(cr.indicateurs||[]).map((it,ii)=>{const key=`${cr.id}_${ii}`,checked=!!c.points[key];return `<li class="${checked?"checked":"unchecked"}">${checked?"✓":"✗"} ${escPrint(it.nom)} <span>${Number(it.points||0)} pt</span></li>`}).join("");
        const earned=(cr.indicateurs||[]).reduce((sum,it,ii)=>sum+(c.points[`${cr.id}_${ii}`]?Number(it.points||0):0),0);
        const possible=(cr.indicateurs||[]).reduce((sum,it)=>sum+Number(it.points||0),0);
        return `<div class="criterion"><h4>Critère ${i+1} — ${escPrint(cr.nom)} <span style="float:right">${earned} / ${possible} pt</span></h4><p class="status">${st.checked} / ${st.count} indicateur(s) coché(s) — ${st.percent}% — <strong>${st.validated?"Critère validé":"Critère non validé"}</strong></p><ul>${indicators||"<li>Aucun indicateur.</li>"}</ul></div>`;
      }).join("");
      return `<section><h3>🎯 Compétence ${ci+1} — ${escPrint(comp.nom)}</h3>${criteriaHtml}<div class="mastery">Maîtrise : <strong>${m.mastery.code} — ${escPrint(m.mastery.label)}</strong> (${m.validated} / ${comp.criteres.length} critère(s) validé(s))</div></section>`;
    }).join("");
    const body=`<div class="print-page"><h1>Correction — ${escPrint(ev.titre)}</h1><p><strong>${escPrint(student)}</strong> — ${escPrint(ev.classe||"Classe")}</p><div class="result" style="border:1px solid #ccd5d1;padding:10px;margin:10px 0;font-size:14px"><strong>${c.score} / ${total}</strong> — ${pct}%</div>${compHtml}${comment?`<div class="comment" style="border:1px solid #d8dfdc;padding:10px;margin-top:12px"><strong>Commentaire :</strong><br>${escPrint(comment)}</div>`:""}</div>`;
    printHtmlInCurrentWindow(`Correction — ${ev.titre}`,body);
  }catch(e){alert("Impression impossible : "+e.message)}
}

async function saveCorrection(evalId,correctionId,eleve,eleveId){
  if(window.__savingCorrection)return;
  window.__savingCorrection=true;
  try{
    const {data,error}=await sb.from("Evaluations").select("*").eq("id",evalId).maybeSingle();
    if(error)throw new Error(error.message);
    if(!data)throw new Error("Évaluation introuvable.");
    const ev=evalNormalize(data),c=computeCorrection(ev);
    const resultat={note:c.score,points:c.points,criteriaStats:c.criteriaStats,commentaire:document.getElementById("corrComment")?.value||""};
    if(currentCorrectionGroupIds.length>1){
      const students=sortStudents(studentsCache.filter(s=>currentCorrectionGroupIds.includes(String(s.id))));
      const failures=[];
      for(const s of students){
        try{
          const existing=await sb.from("EvaluationCorrections").select("id").eq("evaluation_id",evalId).eq("eleve_id",s.id).maybeSingle();
          if(existing.error)throw new Error(existing.error.message);
          const payload={evaluation_id:evalId,eleve:studentDisplayName(s),eleve_id:s.id,resultat};
          const r=existing.data
            ? await sb.from("EvaluationCorrections").update(payload).eq("id",existing.data.id)
            : await sb.from("EvaluationCorrections").insert(payload);
          if(r.error)throw new Error(r.error.message);
        }catch(err){failures.push(`${studentDisplayName(s)} : ${err.message}`)}
      }
      if(failures.length){
        currentCorrectionGroupIds=[];
        await openCorrection(evalId);
        alert(`Correction enregistrée pour ${students.length-failures.length} élève(s).\n\nÉchec pour :\n${failures.join("\n")}`);
        return;
      }
    }else{
      const payload={evaluation_id:evalId,eleve,eleve_id:eleveId||null,resultat};
      if(correctionId){
        const r=await sb.from("EvaluationCorrections").update(payload).eq("id",correctionId);
        if(r.error)throw new Error(r.error.message);
      }else{
        const r=await sb.from("EvaluationCorrections").insert(payload);
        if(r.error)throw new Error(r.error.message);
      }
    }
    currentCorrectionGroupIds=[];
    await openCorrection(evalId);
  }catch(e){alert("Enregistrement impossible : "+e.message)}
  finally{window.__savingCorrection=false;}
}

  label.textContent="Éditeur professeur";content.innerHTML=`<section class="hero login"><span class="eyebrow">Espace sécurisé</span><h2>👨‍🏫 Éditeur professeur</h2><p class="muted">Connecte-toi pour modifier les cahiers de tes classes.</p><div class="editbox"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="ton adresse e-mail"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="primary" style="width:100%;margin-top:5px" onclick="doLogin()">Se connecter</button><div id="loginStatus" class="status" style="margin-top:10px"></div></div></section>`;
}
async function doLogin(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,status=document.getElementById("loginStatus");status.textContent="Connexion…";const{error}=await sb.auth.signInWithPassword({email,password});if(error)status.textContent="Connexion impossible : "+error.message}
async function logout(){clearTimeout(autosaveTimer);await sb.auth.signOut()}

function home(){
  clearTimeout(autosaveTimer);try{localStorage.removeItem(EVAL_NAV_KEY)}catch(e){}niveau=null;classe=null;currentClassData=null;currentChapterIndex=-1;clearNav();label.textContent="Éditeur professeur";updateQuickNav();
  content.innerHTML=`<section class="hero" style="text-align:center;padding:40px 25px"><span class="eyebrow">Espace professeur</span><h2>🧪 Cahier numérique de SVT</h2><p class="muted">Gère tes cahiers et tes évaluations depuis un espace professeur sécurisé.</p></section>
  <div class="grid">
    <article class="card" onclick="openEvaluations()"><span class="tag">📝 Correction</span><h3>Mes évaluations</h3><p class="muted">Créer des barèmes, corriger les élèves et générer automatiquement les grilles.</p></article>
    ${Object.keys(CLASSES).map(n=>`<article class="card" onclick="openNiveau('${n}')"><span class="tag">🧪 Niveau</span><h3>${n}</h3><p class="muted">Choisir une classe →</p></article>`).join("")}
  </div>`;
}
async function openNiveau(n){
  clearTimeout(autosaveTimer);niveau=n;classe=null;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${n}`;updateQuickNav();
  content.innerHTML=`<button onclick="home()">← Accueil</button><section class="hero" style="margin-top:14px"><span class="eyebrow">${n}</span><h2>Choisir une classe</h2><p class="muted">Sélectionne la classe dont tu veux modifier le cahier.</p></section><div id="classes" class="grid"><p class="muted">Chargement…</p></div>`;
  try{
    const arr=await Promise.all(CLASSES[n].map(async c=>{try{const d=await loadClass(c);return{c,count:d.contenu.chapitres.length}}catch(e){return{c,count:0}}}));
    const target=document.getElementById("classes");if(!target)return;target.innerHTML=arr.map(o=>`<article class="card" onclick="openClasse('${o.c}')"><span class="tag">Classe</span><h3>${o.c}</h3><p class="muted">${o.count} chapitre(s) · Modifier →</p></article>`).join("");
  }catch(e){showError(e.message)}
}
async function openClasse(c){clearTimeout(autosaveTimer);classe=c;currentClassData=null;currentChapterIndex=-1;saveNav();label.textContent=`Éditeur · ${c}`;updateQuickNav();await chapters()}
async function chapters(){
  if(!classe)return;
  try{
    currentClassData=await loadClass(classe);currentChapterIndex=-1;saveNav();const x=currentClassData.contenu;
    content.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div class="row"><button type="button" onclick="openNiveau('${niveau}')">← ${niveau}</button><button type="button" onclick="home()">🏠 Accueil</button></div></div><section class="hero" style="margin-top:14px"><span class="eyebrow">${classe}</span><h2>📚 Mes chapitres</h2><p class="muted">Ajoute et complète les chapitres directement ici.</p><button class="primary" onclick="newChapter()">＋ Ajouter un chapitre</button></section><div class="grid">${x.chapitres.map((ch,i)=>`<article class="card" onclick="editChapter(${i})"><span class="tag">Chapitre ${i+1}</span><div class="rich-output"><h3>${ch.titre||"Nouveau chapitre"}</h3></div><p class="muted">${stripHtml(ch.problematique)||"Aucune problématique renseignée"}</p><p class="small">${ch.seances.length} séance(s)</p></article>`).join("")||`<section class="hero"><h3>Aucun chapitre</h3><p class="muted">Clique sur « Ajouter un chapitre » pour commencer.</p></section>`}</div>`;
  }catch(e){showError(e.message)}
}
function stripHtml(v){const d=document.createElement("div");d.innerHTML=safe(v);return d.textContent||d.innerText||""}
async function newChapter(){
  try{if(!currentClassData)currentClassData=await loadClass(classe);currentClassData.contenu.chapitres.push(normalizeChapter({titre:"Nouveau chapitre",problematique:"",germoir:"",seances:[]}));currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);const i=currentClassData.contenu.chapitres.length-1;currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible d'ajouter le chapitre : "+e.message)}
}
function editChapter(i){
  try{
    if(!currentClassData||!Array.isArray(currentClassData.contenu?.chapitres)){showError("Le cahier n'est pas chargé.");return}
    if(i<0||i>=currentClassData.contenu.chapitres.length){showError("Ce chapitre est introuvable.");return}
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);currentClassData.contenu.chapitres[i]=ch;currentChapterIndex=i;saveNav();
    content.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div class="row"><button type="button" onclick="chapters()">← Tous les chapitres</button><button type="button" onclick="openNiveau('${niveau}')">← ${niveau}</button><button type="button" onclick="home()">🏠 Accueil</button></div></div><section class="hero teacher" style="margin-top:14px"><span class="eyebrow">Chapitre ${i+1}</span><h2>✏️ Modifier le chapitre</h2>
      <div class="editbox"><label>🌱 Germoir à idées</label>${richToolbar("chGermoir")}<div id="chGermoir" class="rich-editor" contenteditable="true" data-placeholder="Écris ici les idées à faire émerger…">${ch.germoir||""}</div>${pdfField("le Germoir à idées","germoirPdf",i,ch.germoirPdf)}
      <label>Titre du chapitre</label>${richToolbar("chTitre")}<div id="chTitre" class="rich-editor" contenteditable="true" data-placeholder="Titre du chapitre">${ch.titre||""}</div>
      <label>Problématique du chapitre</label>${richToolbar("chProb")}<div id="chProb" class="rich-editor" contenteditable="true" data-placeholder="Problématique du chapitre…">${ch.problematique||""}</div></div>
      <div class="section-heading"><h2>📖 Séances</h2><span class="status">Une séance peut s'étaler sur plusieurs jours.</span></div>
      <div id="sessions">${ch.seances.map((s,n)=>sessionEditor(s,n)).join("")}</div><button type="button" class="entry-add" onclick="addSession(${i})">＋ Ajouter une séance</button>
      <div class="editbox"><label>🧠 Schéma-bilan du chapitre</label>${pdfField("le schéma-bilan","schemaPdf",i,ch.schemaPdf)}<label>📝 Fiche de mémorisation</label>${pdfField("la fiche de mémorisation","memoPdf",i,ch.memoPdf)}<label>✅ Évaluation de fin de chapitre</label>${pdfField("l'évaluation de fin de chapitre","evaluationPdf",i,ch.evaluationPdf)}</div>
      <div class="row"><button class="primary" onclick="saveChapter(${i})">💾 Enregistrer</button><button class="danger" onclick="deleteChapter(${i})">🗑️ Supprimer le chapitre</button><span id="saveStatus" class="status save-indicator"></span></div></section>`;
  }catch(e){showError(e.message)}
}
async function addSession(i){
  try{
    if(!currentClassData)currentClassData=await loadClass(classe);
    const saved=await saveChapter(i);if(saved!==true)return;
    const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.push(normalizeSession({titre:`Séance ${ch.seances.length+1}`,problematique:"",activites:[],corrections:[],bilans:[]}));currentClassData.contenu.chapitres[i]=ch;
    currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i);
  }catch(e){alert("Impossible d'ajouter la séance : "+e.message)}
}
async function removeSession(n){
  const i=currentChapterIndex;if(i<0||!currentClassData)return;if(!confirm("Supprimer définitivement cette séance ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;const ch=normalizeChapter(currentClassData.contenu.chapitres[i]);ch.seances.splice(n,1);currentClassData.contenu.chapitres[i]=ch;currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=i;saveNav();editChapter(i)}
  catch(e){alert("Impossible de supprimer la séance : "+e.message)}
}
async function deleteChapter(i){
  if(!confirm("Supprimer définitivement ce chapitre ?"))return;
  try{const saved=await saveChapter(i);if(saved!==true)return;currentClassData.contenu.chapitres.splice(i,1);currentClassData.id=await saveClass(classe,currentClassData.contenu,currentClassData.id);currentChapterIndex=-1;saveNav();await chapters()}
  catch(e){alert("Suppression impossible : "+e.message)}
}
async function uploadPdf(input,kind,id){
  const file=input.files?.[0];if(!file)return;if(file.type!=="application/pdf"){alert("Choisis un fichier PDF.");input.value="";return}
  const box=input.closest(".pdf-box"),status=box?.querySelector(".status");if(status)status.textContent="Envoi du PDF…";
  const path=`${classe}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  try{
    const{error}=await sb.storage.from("documents").upload(path,file,{contentType:"application/pdf",upsert:false});if(error)throw new Error(error.message);
    const{data}=sb.storage.from("documents").getPublicUrl(path);input.dataset.url=data.publicUrl;if(box)box.dataset.currentUrl=data.publicUrl;if(status)status.textContent="PDF ajouté ✓";
    if(currentChapterIndex>=0){clearTimeout(autosaveTimer);await runAutosave()}
  }catch(e){if(status)status.textContent="Erreur : "+e.message;alert("Envoi du PDF impossible : "+e.message)}
}
async function restoreLastPosition(){
  try{
    const en=JSON.parse(localStorage.getItem(EVAL_NAV_KEY)||"null");
    if(en?.view){
      if(en.view==="list"){await openEvaluations();return;}
      if(en.view==="editor"){
        if(en.id){const all=await loadEvaluations();const ev=all.find(x=>x.id===en.id);if(ev){editEvaluationObject(ev);return;}}
        if(en.draft){editEvaluationObject(en.draft);return;}
      }
      if(en.view==="correction"&&en.id){await openCorrection(en.id);return;}
      if(en.view==="studentCorrection"&&en.evalId){await renderCorrectionEditor(en.evalId,en.correctionId||null,{eleve:en.eleve||"Élève",resultat:en.resultat||{points:{},note:0,commentaire:"",criteriaStats:{}}});return;}
      if(en.view==="tracking"){studentTrackingClass=en.classe||"";studentTrackingStudent=en.student||"";studentTrackingPeriod=en.period||"year";await openStudentTracking();return;}
      if(en.view==="classTracking"){classTrackingClass=en.classe||"";classTrackingPeriod=en.period||"year";await openClassTracking();return;}
    }
  }catch(e){}
  const n=loadNav();if(!n?.niveau){home();return}niveau=n.niveau;if(!CLASSES[niveau]){home();return}
  if(n.classe&&CLASSES[niveau].includes(n.classe)){classe=n.classe;label.textContent=`Éditeur · ${classe}`;try{currentClassData=await loadClass(classe);const ci=Number.isInteger(n.currentChapterIndex)?n.currentChapterIndex:-1;if(n.view==="chapter"&&ci>=0&&ci<currentClassData.contenu.chapitres.length){currentChapterIndex=ci;editChapter(ci);return}await chapters();return}catch(e){showError(e.message);return}}
  await openNiveau(niveau);
}
init();
</script>
</body>
</html>
