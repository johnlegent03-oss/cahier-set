name: Preparer l'identite commune SVT
on:
  push:
    branches: [harmonisation-identite-svt]
    paths: [site-identite.js, .github/workflows/harmoniser-identite.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harmoniser:
    if: github.ref == 'refs/heads/harmonisation-identite-svt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonisation-identite-svt
      - name: Ajouter le chargement du theme sans reecrire les outils
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = '<script src="site-identite.js?v=1" defer data-svt-identite="1"></script>'
          changes = []
          for name in ('prof.html', 'evaluations.html', 'atelier.html'):
              path = Path(name)
              original = path.read_text(encoding='utf-8')
              if 'data-svt-identite="1"' in original:
                  print(name + ': chargement deja present')
                  continue
              end = original.lower().rfind('</body>')
              if end < 0:
                  raise SystemExit('Fin de document introuvable : ' + name)
              changes.append((path, original[:end] + '\n' + marker + '\n' + original[end:]))
          for path, content in changes:
              path.write_text(content, encoding='utf-8')
              print(str(path) + ': chargement ajoute')
          PY
      - name: Enregistrer uniquement les trois pages sur la branche de travail
        shell: bash
        run: |
          if git diff --quiet -- prof.html evaluations.html atelier.html; then
            echo "Aucune modification supplementaire necessaire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prof.html evaluations.html atelier.html
          git commit -m "Brancher l'identite commune sur les trois espaces SVT"
          git push origin HEAD:harmonisation-identite-svt
