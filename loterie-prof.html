<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Productions élèves — La loterie génétique</title><style>
*{box-sizing:border-box}body{background:#f5f3fa;color:#29233e;font:16px system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:24px}header,section{background:white;border-radius:15px;padding:20px;margin:14px 0}h1{color:#633386;margin:8px 0}h2{font-size:20px}button,select,input{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #b8a9c9;background:white}button{background:#633386;color:white;border:0;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:default}button.secondary{background:#ece5f5;color:#43256c}a{color:#633386}table{border-collapse:collapse;width:100%}th,td{padding:11px 8px;border-bottom:1px solid #e3dce9;text-align:left}code{font-size:14px;white-space:nowrap}.scroll{overflow:auto}.status{font-weight:600}.ok{color:#246b41}.pending{color:#786339}#viewer[hidden],#tools[hidden]{display:none}iframe{display:block;width:100%;height:78vh;border:1px solid #ded5e9;border-radius:8px}#link{width:min(100%,680px)}@media print{body{background:white}button,a,#tools,#viewer,#status{display:none!important}main{padding:0}header,section{padding:0}table{font-size:12px}tr{break-inside:avoid}}
</style></head><body><main><header><a href="atelier.html">← Retour à l’atelier pédagogique</a><h1>La loterie génétique</h1><p>Productions élèves — accès professeur confidentiel.</p><p id="status" role="status" aria-live="polite">Vérification de la connexion…</p></header><section id="tools" hidden><label>Classe : <select id="classe"><option>3e3</option><option>3e2</option></select></label><button id="generate">Générer les codes manquants</button><button class="secondary" id="refresh">Actualiser</button><button class="secondary" id="printcodes">Imprimer les codes</button><button class="secondary" id="export">Exporter les fiches rendues (JSON)</button><p><label for="link">Lien commun à distribuer :</label></p><input id="link" readonly><button class="secondary" id="copylink">Copier le lien</button><p><small>Un code individuel = une seule fiche rendue. Aucune note ni correction automatique.</small></p></section><section><h2 id="count">Productions</h2><div class="scroll"><table><thead><tr><th>Élève</th><th>Code individuel</th><th>État</th><th>Production</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="viewer" hidden><h2 id="viewtitle">Fiche rendue</h2><button id="printcopy">Imprimer / PDF</button><button class="secondary" id="closeviewer">Fermer la fiche</button><iframe id="frame" title="Production élève"></iframe></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{
const $=id=>document.getElementById(id), status=$('status'), table='loterie_genetique_copies';let sb,rows=[],busy=false,uid=null,opened=null;const studentUrl=new URL('loterie-genetique.html',location.href).href;$('link').value=studentUrl;
function unwrap(r){if(r.error)throw Error(r.error.message);return r.data}function msg(t){status.textContent=t}function el(tag,text,parent){let e=document.createElement(tag);e.textContent=text;if(parent)parent.append(e);return e}function cell(row,text){return el('td',text,row)}
function download(obj,name){let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function close(){opened=null;$('viewer').hidden=true;$('frame').removeAttribute('src')}
function show(r){opened=r;$('viewtitle').textContent='Fiche rendue — '+r.prenom+' '+r.nom+' · '+r.classe;$('viewer').hidden=false;$('frame').src=studentUrl;$('viewer').scrollIntoView({behavior:'smooth'})}
$('frame').addEventListener('load',()=>{if(!opened)return;try{const d=$('frame').contentDocument,f=d.querySelector('#work');if(!f)throw Error('Fichier élève introuvable.');const r=opened;Object.entries(r.reponses||{}).forEach(([k,v])=>{let x=f.elements.namedItem(k);if(x&&typeof v==='string')x.value=v});f.elements.prenom.value=r.prenom+' '+r.nom+' · '+r.classe;f.elements.code.closest('label').remove();f.querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);f.querySelectorAll('button').forEach(e=>e.remove());const last=f.lastElementChild;if(last)last.remove();d.querySelectorAll('.source').forEach(e=>e.remove());d.querySelectorAll('header').forEach(e=>e.remove());const title=d.createElement('h1');title.textContent='La loterie génétique — '+r.prenom+' '+r.nom;d.querySelector('main').prepend(title);const s=d.createElement('style');s.textContent='select:disabled,input:disabled,textarea:disabled{opacity:1;color:inherit;-webkit-text-fill-color:currentColor}select:disabled{appearance:none}';d.head.append(s)}catch(e){msg('Impossible d’ouvrir la fiche : '+e.message)}});
$('closeviewer').onclick=close;$('printcopy').onclick=()=>{if(opened&&$('frame').contentDocument?.querySelector('#work'))$('frame').contentWindow.print()};
function render(){const b=$('rows');b.replaceChildren();let done=rows.filter(r=>r.submitted_at).length;$('count').textContent=$('classe').value+' — '+done+'/'+rows.length+' fiches rendues';for(const r of rows){let tr=el('tr','',b);cell(tr,r.prenom+' '+r.nom);let c=cell(tr,'');el('code',r.code,c);let state=cell(tr,r.submitted_at?'Rendue le '+new Date(r.submitted_at).toLocaleString('fr-FR'):'En attente');state.className=r.submitted_at?'ok':'pending';let a=cell(tr,'');if(r.submitted_at){let btn=el('button','Ouvrir la fiche',a);btn.onclick=()=>show(r);let save=el('button','JSON',a);save.className='secondary';save.onclick=()=>download({prenom:r.prenom,nom:r.nom,classe:r.classe,reponses:r.reponses},'loterie-'+r.eleve_id+'.json');let reset=el('button','Réinitialiser la fiche',a);reset.className='secondary';reset.onclick=()=>{if(busy||!confirm('Supprimer définitivement la production de '+r.prenom+' '+r.nom+' ? Son code restera utilisable.'))return;run(async()=>{await check();const changed=unwrap(await sb.from(table).update({reponses:null,submitted_at:null}).eq('id',r.id).eq('professeur_id',uid).eq('submitted_at',r.submitted_at).select('id').single());if(!changed)throw Error('Fiche non réinitialisée.');if(opened?.id===r.id)close();await load();msg('Fiche réinitialisée. Le code est de nouveau utilisable.')})}}}}
async function check(){let {data,error}=await sb.auth.getUser();if(error||!data?.user)throw Error('Connecte-toi d’abord à ton espace professeur.');uid=data.user.id;let aal=unwrap(await sb.auth.mfa.getAuthenticatorAssuranceLevel());if(aal.currentLevel!=='aal2')throw Error('Reconnecte-toi avec la double authentification.');}
async function load(){rows=unwrap(await sb.from(table).select('id,eleve_id,classe,prenom,nom,code,submitted_at,reponses').eq('classe',$('classe').value).order('nom').order('prenom'));render();msg('Dernière actualisation : '+new Date().toLocaleTimeString('fr-FR'))}
async function run(fn){if(busy)return;busy=true;$('generate').disabled=$('refresh').disabled=$('classe').disabled=true;try{await fn()}catch(e){msg('Erreur : '+e.message)}finally{busy=false;$('generate').disabled=$('refresh').disabled=$('classe').disabled=false}}
$('generate').onclick=()=>run(async()=>{await check();let cls=$('classe').value,students=unwrap(await sb.from('Eleves').select('id,prenom,nom').eq('classe',cls).order('nom'));if(!students.length)throw Error('Aucun élève trouvé pour '+cls);await load();let ids=new Set(rows.map(r=>r.eleve_id));let add=students.filter(s=>!ids.has(String(s.id))).map(s=>({professeur_id:uid,eleve_id:String(s.id),classe:cls,prenom:s.prenom,nom:s.nom||''}));if(add.length)unwrap(await sb.from(table).insert(add));await load();msg(add.length+' nouveaux codes générés. Les anciens codes sont conservés.')});
$('refresh').onclick=()=>run(load);$('classe').onchange=()=>{close();rows=[];render();run(load)};
$('copylink').onclick=async()=>{try{await navigator.clipboard.writeText(studentUrl);msg('Lien copié.')}catch{ $('link').select();msg('Copie le lien sélectionné.')}};
$('printcodes').onclick=()=>{let w=window.open('','_blank');if(!w){msg('Autorise les fenêtres surgissantes.');return}w.document.title='Codes confidentiels — '+$('classe').value;const d=w.document;let st=d.createElement('style');st.textContent='body{font:15px Arial;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:12px;text-align:left}tr{break-inside:avoid}@media print{button{display:none}}';d.head.append(st);el('h1','La loterie génétique — '+$('classe').value,d.body);el('p',studentUrl,d.body);el('p','Distribuer individuellement. Ne pas projeter cette liste.',d.body);let t=el('table','',d.body);for(let r of rows.filter(r=>!r.submitted_at)){let tr=el('tr','',t);cell(tr,r.prenom+' '+r.nom);cell(tr,r.code)}let btn=el('button','Imprimer',d.body);btn.onclick=()=>w.print();w.opener=null};
$('export').onclick=()=>download(rows.filter(r=>r.submitted_at).map(({prenom,nom,classe,reponses,submitted_at})=>({prenom,nom,classe,reponses,submitted_at})),'loterie-'+$('classe').value+'-productions.json');
try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}});await check();$('tools').hidden=false;await run(load);setInterval(()=>{if(!document.hidden&&!busy&&!opened)run(load)},15000)}catch(e){msg(e.message);$('tools').hidden=true}
})();
</script></body></html>
